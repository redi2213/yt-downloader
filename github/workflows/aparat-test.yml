mkdir -p .github/workflows
cat > .github/workflows/aparat-test.yml << 'EOF'
name: aparat-test
on:
  workflow_dispatch:
    inputs:
      uid:
        description: Aparat video id (aparat.com/v/xxxx)
        required: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: API and CDN check
        env:
          UID_IN: ${{ inputs.uid }}
        run: |
          API="https://www.aparat.com/api/fa/v1/video/video/show/videohash/$UID_IN"
          code=$(curl -s -o api.json -w '%{http_code}' -A 'Mozilla/5.0' -e 'https://www.aparat.com/' "$API")
          echo "API status: $code"
          URL=$(python3 -c "import json;a=json.load(open('api.json'))['data']['attributes'];print(a['file_link_all'][0]['urls'][0])")
          echo "CDN host: $(echo "$URL" | cut -d/ -f3)"
          code=$(curl -s -o /dev/null -w '%{http_code}' -r 0-1023 -A 'Mozilla/5.0' -e 'https://www.aparat.com/' "$URL")
          echo "CDN status: $code"
EOF
git add . && git commit -m "aparat test" && git push
