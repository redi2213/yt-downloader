name: List Formats

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video URL (any yt-dlp-supported site)'
        required: true

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Install Deno
        uses: denoland/setup-deno@v2

      - name: Start PO Token provider server
        run: |
          docker run --name bgutil-provider -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          for i in {1..15}; do
            if curl -sf http://127.0.0.1:4416/ping > /dev/null; then
              echo "PO Token server is up"
              break
            fi
            sleep 1
          done

      - name: Install yt-dlp and PO Token plugin
        run: |
          pip install -U yt-dlp
          pip install -U bgutil-ytdlp-pot-provider

      - name: Write cookies file
        run: echo "${{ secrets.YTDLP_COOKIES }}" > cookies.txt

      - name: List formats
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          yt-dlp --cookies cookies.txt --remote-components ejs:github \
            --extractor-args "youtube:player_client=mweb,tv,web_safari,web;formats=missing_pot" \
            -F "${{ github.event.inputs.video_url }}" | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Clean up cookies
        if: always()
        run: rm -f cookies.txt