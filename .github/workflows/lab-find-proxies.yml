name: Lab Find Proxies

# Copy of link_downloader's find_proxies.yml for the app's Lab.
# The list is saved on the lab branch (lab/working_proxies.txt), not in the main branch.
# This file is the real definition: it runs from the lab branch (main only keeps a stub).

run-name: ${{ inputs.run_title || 'Lab proxies' }} [${{ inputs.job_id }}]

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Unique id the app puts in the run name to find this run (set by the app)'
        required: false
        default: ''
        type: string
      run_title:
        description: 'Short name for this run, set by the app (leave empty when running by hand)'
        required: false
        default: ''
        type: string
      needed:
        description: "Stop after this many working proxies"
        required: false
        default: "8"
        type: string
      max_candidates:
        description: "Max proxies to test from free lists"
        required: false
        default: "100"
        type: string
      xh_check:
        description: "Also test opening xhamster.com (1=yes, 0=no)"
        required: false
        default: "0"
        type: string

permissions:
  contents: write

# REGISTRATION STUB. GitHub only starts a workflow by file name when the file exists on main.
# The real definition lives on the `lab` branch (same path) and is what runs when the app
# dispatches this file with ref=lab. Do not put steps here.
jobs:
  stub:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Stub on main. The real workflow runs from the lab branch."
