name: Lab Find Proxies

# Copy of link_downloader's find_proxies.yml for the app's Lab.
# The list is saved on the config branch (lab/working_proxies.txt), not in the main branch.

run-name: ${{ inputs.run_title || 'Lab proxies' }} [${{ inputs.job_id }}]

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Unique id the app puts in the run name to find this run (set by the app)'
        required: false
        default: ''
        type: string
      run_title:
        description: 'Short name for this run, set by the app (leave empty when running by hand)'
        required: false
        default: ''
        type: string
      needed:
        description: "Stop after this many working proxies"
        required: false
        default: "8"
        type: string
      max_candidates:
        description: "Max proxies to test from free lists"
        required: false
        default: "100"
        type: string
      xh_check:
        description: "Also test opening xhamster.com (1=yes, 0=no)"
        required: false
        default: "0"
        type: string

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Checkout config branch
        uses: actions/checkout@v4
        with:
          ref: config
          path: labcfg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -U pip
          pip install requests PySocks

      - name: Find working free proxies
        env:
          NEEDED: ${{ inputs.needed }}
          MAX_CANDIDATES: ${{ inputs.max_candidates }}
          XH_CHECK: ${{ inputs.xh_check }}
          PROXY_TIMEOUT: "8"
          MAX_WORKERS: "20"
        run: python lab_scripts/find_proxies.py

      - name: Save the list on the config branch
        run: |
          if [ ! -s working_proxies.txt ]; then
            echo "No working proxies found - nothing saved"
            exit 0
          fi
          mkdir -p labcfg/lab
          {
            echo "# Auto-updated by Lab Find Proxies workflow"
            echo "# Updated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "# Format: socks5://ip:port  or  http://ip:port"
            grep -v '^#' working_proxies.txt | sed '/^$/d'
          } > labcfg/lab/working_proxies.txt
          if [ -f working_proxies.json ]; then cp working_proxies.json labcfg/lab/working_proxies.json; fi
          cd labcfg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/working_proxies.txt lab/working_proxies.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(lab): update working proxies ($(grep -vc '^#' lab/working_proxies.txt) proxies)"
          git pull --rebase origin config || true
          git push origin HEAD:config

      - name: Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-working-proxies
          path: |
            working_proxies.txt
            working_proxies.json
          if-no-files-found: warn
