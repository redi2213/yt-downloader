name: Lab Links

# Copy of link_downloader's xh_links.yml for the app's Lab.
# Extracts the video links of any site yt-dlp supports (xhamster_api is tried first
# only inside the script), then writes them into the notes of a release "run-<id>"
# so the app can show them.

run-name: ${{ inputs.run_title || 'Lab links' }} [${{ inputs.job_id }}]

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Unique id the app puts in the run name to find this run (set by the app)'
        required: false
        default: ''
        type: string
      run_title:
        description: 'Short name for this run, set by the app (leave empty when running by hand)'
        required: false
        default: ''
        type: string
      url:
        description: "Video page URL (several links: one per line)"
        required: false
        type: string
      links:
        description: "Multiple links, one per line"
        required: false
        type: string
      proxy:
        description: "Optional single proxy override (socks5://... or http://...)"
        required: false
        type: string
      v2ray_config:
        description: "Xray/V2Ray config (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Checkout config branch (proxy list)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: config
          path: labcfg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          set -e
          pip install -U pip setuptools wheel
          pip install curl_cffi requests PySocks
          pip uninstall -y xhamster_api unofficial-api-for-xhamster 2>/dev/null || true
          pip install -U unofficial-api-for-xhamster
          pip install -U yt-dlp
          python - <<'PY'
          import base_api.base as b
          if not hasattr(b, "setup_logger") and hasattr(b, "get_logger"):
              b.setup_logger = b.get_logger
          from xhamster_api import Client
          print("OK", Client)
          PY
          yt-dlp --version

      - name: Setup Xray from config (optional)
        env:
          V2RAY_CONFIG: ${{ inputs.v2ray_config }}
        run: bash lab_scripts/setup_xray.sh

      - name: Prepare proxy list
        env:
          PROXY_IN: ${{ inputs.proxy }}
        run: |
          if [ -f labcfg/lab/working_proxies.txt ]; then
            cp labcfg/lab/working_proxies.txt working_proxies.txt
          fi
          if [ -n "$PROXY_IN" ]; then
            echo "$PROXY_IN" > working_proxies.txt
          fi
          echo "=== working_proxies.txt ==="
          cat working_proxies.txt 2>/dev/null || echo "(none)"

      - name: Extract quality links
        env:
          URL: ${{ inputs.url }}
          LINKS: ${{ inputs.links }}
          PROXY: ${{ inputs.proxy }}
          V2RAY_CONFIG: ${{ inputs.v2ray_config }}
        run: python lab_scripts/links.py

      - name: Publish the links as release notes (the app reads them)
        if: always() && hashFiles('xh_links.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="run-${{ github.run_id }}"
          { echo "Lab links"; echo; cat xh_links.txt; } > lab_release_notes.md
          gh release delete "$TAG" --yes --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "Lab links #${{ github.run_number }}" \
            --notes-file lab_release_notes.md
