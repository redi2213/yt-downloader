name: Lab Links

# Copy of link_downloader's xh_links.yml for the app's Lab.
# Extracts the video links of any site yt-dlp supports (xhamster_api is tried first
# only inside the script), then writes them into the notes of a release "run-<id>"
# so the app can show them.

run-name: ${{ inputs.run_title || 'Lab links' }} [${{ inputs.job_id }}]

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Unique id the app puts in the run name to find this run (set by the app)'
        required: false
        default: ''
        type: string
      run_title:
        description: 'Short name for this run, set by the app (leave empty when running by hand)'
        required: false
        default: ''
        type: string
      url:
        description: "Video page URL (several links: one per line)"
        required: false
        type: string
      links:
        description: "Multiple links, one per line"
        required: false
        type: string
      proxy:
        description: "Optional single proxy override (socks5://... or http://...)"
        required: false
        type: string
      v2ray_config:
        description: "Xray/V2Ray config (optional)"
        required: false
        type: string

permissions:
  contents: write

# REGISTRATION STUB. GitHub only starts a workflow by file name when the file exists on main.
# The real definition lives on the `lab` branch (same path) and is what runs when the app
# dispatches this file with ref=lab. Do not put steps here.
jobs:
  stub:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Stub on main. The real workflow runs from the lab branch."
