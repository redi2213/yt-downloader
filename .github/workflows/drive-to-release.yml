
ASSET_URL="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
  | jq -r --arg name "$FILE_NAME" \
  '.assets[] | select(.name == $name) | .browser_download_url')"

if [[ -z "$ASSET_URL" || "$ASSET_URL" == "null" ]]; then
  echo "::error::Release asset URL could not be found."
  exit 1
fi

echo "Release asset uploaded successfully."
echo "Direct download URL: $ASSET_URL"

{
  echo "## Release Upload"
  echo ""
  echo "- File: \`$FILE_NAME\`"
  echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
  echo "- Direct download: $ASSET_URL"
} >> "$GITHUB_STEP_SUMMARY"
