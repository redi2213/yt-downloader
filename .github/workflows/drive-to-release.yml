
name: Google Drive to GitHub Release
run-name: ${{ inputs.run_title || inputs.drive_url }} [${{ inputs.job_id }}]${{ inputs.rerun && format(' ~{0}', inputs.rerun) || '' }}

# Started from the app (Download Anything > Upload / import > Google Drive) or by hand.
# The file is published as release "run-<run id>" (like the other tools) unless
# release_tag is filled in by hand.

on:
  workflow_dispatch:
    inputs:
      drive_url:
        description: "Google Drive file URL"
        required: true
        default: "https://drive.google.com/file/d/17ghIqZCvRnRj9RxHoVfps1a1CUk_dmwh/view"
        type: string
      release_tag:
        description: "GitHub Release tag (leave empty = run-<run id>, what the app expects)"
        required: false
        default: ""
        type: string
      job_id:
        description: "Set by the app so it can find this exact run (leave empty when running by hand)"
        required: false
        default: ""
        type: string
      rerun:
        description: 'Set by the app: the other inputs packed into the run name so "Run again" can repeat this run (leave empty when running by hand)'
        required: false
        default: ""
        type: string
      run_title:
        description: "Short name for this run, set by the app (leave empty when running by hand)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: drive-to-release-${{ inputs.release_tag || github.run_id }}
  cancel-in-progress: false

jobs:
  download-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install gdown
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Download from Google Drive
        id: download
        env:
          DRIVE_URL: ${{ inputs.drive_url }}
        run: |
          set -euo pipefail

          mkdir -p downloaded
          cd downloaded

          gdown "$DRIVE_URL"

          FILE_PATH="$(find . -maxdepth 1 -type f -printf '%p\n' | head -n 1)"

          if [[ -z "$FILE_PATH" || ! -f "$FILE_PATH" ]]; then
            echo "::error::No file was downloaded."
            exit 1
          fi

          FILE_NAME="${FILE_PATH#./}"
          FILE_SIZE="$(stat -c '%s' "$FILE_PATH")"

          if [[ "$FILE_SIZE" -le 0 ]]; then
            echo "::error::Downloaded file is empty."
            exit 1
          fi

          echo "Downloaded file: $FILE_NAME"
          echo "File size: $FILE_SIZE bytes"

          echo "file_name=$FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "file_path=$FILE_PATH" >> "$GITHUB_OUTPUT"
          echo "file_size=$FILE_SIZE" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || format('run-{0}', github.run_id) }}
          FILE_NAME: ${{ steps.download.outputs.file_name }}
          FILE_PATH: downloaded/${{ steps.download.outputs.file_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release exists. Uploading asset..."
            gh release upload "$TAG" "$FILE_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            echo "Creating release and uploading asset..."
            gh release create "$TAG" "$FILE_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes "Uploaded from Google Drive by GitHub Actions."
          fi

          echo "Release upload command completed."

      - name: Get direct download URL
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || format('run-{0}', github.run_id) }}
          FILE_NAME: ${{ steps.download.outputs.file_name }}
          FILE_SIZE: ${{ steps.download.outputs.file_size }}
        run: |
          set -euo pipefail

          RELEASE_JSON="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"

          ASSET_URL="$(printf '%s' "$RELEASE_JSON" \
            | jq -r --arg name "$FILE_NAME" \
            '.assets[] | select(.name == $name) | .browser_download_url' \
            | head -n 1)"

          if [[ -z "$ASSET_URL" || "$ASSET_URL" == "null" ]]; then
            echo "::error::Release asset URL could not be found."
            echo "Check the release Assets section."
            exit 1
          fi

          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

          echo ""
          echo "========================================"
          echo "UPLOAD COMPLETED"
          echo "========================================"
          echo "File: $FILE_NAME"
          echo "Size: $FILE_SIZE bytes"
          echo "Release: $RELEASE_URL"
          echo "Direct download URL: $ASSET_URL"
          echo "========================================"

          {
            echo "## Google Drive to GitHub Release"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| File | \`$FILE_NAME\` |"
            echo "| Size | $FILE_SIZE bytes |"
            echo "| Release | [Open Release]($RELEASE_URL) |"
            echo "| Direct download | [Download file]($ASSET_URL) |"
            echo ""
            echo "The release asset was found successfully."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify (ntfy)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          TOOL_NAME: Google Drive
          ONLY_FAILURE: 'false'
          RUN_TITLE: ${{ inputs.run_title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          if [ "$JOB_STATUS" = "success" ] && [ "$ONLY_FAILURE" = "true" ]; then
            echo "Success and this tool only reports failures: no notification."
            exit 0
          fi
          # The topic is set once in the app (Settings) and kept in ntfy.json on the config branch.
          CFG=$(curl -fsS -m 20 -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ntfy.json?ref=config" 2>/dev/null || true)
          if [ -z "$CFG" ]; then
            echo "No ntfy.json on the config branch: no notification."
            exit 0
          fi
          RESULT=$(CFG="$CFG" python3 - <<'PY'
          import json, os, re
          try:
              d = json.loads(os.environ["CFG"])
          except Exception:
              d = {}
          topic = str(d.get("topic", "")).strip()
          server = str(d.get("server") or "https://ntfy.sh").strip().rstrip("/")
          if re.fullmatch(r"[A-Za-z0-9_-]{1,64}", topic) and re.fullmatch(r"https://[A-Za-z0-9.-]+(:[0-9]+)?", server):
              print(topic + " " + server)
          PY
          )
          if [ -z "$RESULT" ]; then
            echo "ntfy topic is not set: no notification."
            exit 0
          fi
          TOPIC=${RESULT%% *}
          SERVER=${RESULT#* }
          case "$JOB_STATUS" in
            success)   WORD="OK";        TAGS="white_check_mark"; PRIO="default" ;;
            cancelled) WORD="Cancelled"; TAGS="no_entry_sign";    PRIO="default" ;;
            *)         WORD="FAILED";    TAGS="x";                PRIO="high" ;;
          esac
          BODY="$TOOL_NAME: $WORD"
          if [ -n "${RUN_TITLE:-}" ]; then BODY="$BODY"$'\n'"$RUN_TITLE"; fi
          BODY="$BODY"$'\n'"$RUN_URL"
          if curl -fsS -m 20 -X POST "$SERVER/$TOPIC" \
              -H "Title: YT Bridge - $TOOL_NAME - $WORD" -H "Tags: $TAGS" -H "Priority: $PRIO" \
              -H "Click: $RUN_URL" --data-binary "$BODY" >/dev/null; then
            echo "Notification sent."
          else
            echo "ntfy could not be reached."
          fi
