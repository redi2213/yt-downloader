name: Filimo Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Filimo URL or item ID"
        required: true
        type: string

      quality:
        description: "Video quality"
        required: true
        type: choice
        options:
          - Best available
          - 1080p
          - 720p
          - 480p
          - 360p

      subtitle:
        description: "Subtitle language"
        required: true
        type: choice
        options:
          - none
          - Persian

      output_mode:
        description: "Output destination"
        required: true
        type: choice
        options:
          - Workflow Artifact
          - GitHub Release
          - Direct link only (HLS)

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache ffmpeg (static build)
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: /opt/ffmpeg-bin
          # Same key as the Download Video workflow: the cache is shared.
          key: ffmpeg-static-ytdlp-v1

      - name: Install ffmpeg static build (cache miss only)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/ffmpeg-bin
          sudo chown "$USER" /opt/ffmpeg-bin
          curl -fsSL --retry 5 --retry-delay 3 -o /tmp/ffmpeg.tar.xz \
            "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          mkdir -p /tmp/ffx
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffx --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          find /tmp/ffx -type f \( -name ffmpeg -o -name ffprobe \) -exec cp {} /opt/ffmpeg-bin/ \;
          chmod +x /opt/ffmpeg-bin/ffmpeg /opt/ffmpeg-bin/ffprobe
          rm -rf /tmp/ffx /tmp/ffmpeg.tar.xz

      - name: Add ffmpeg to PATH and verify
        run: |
          echo "/opt/ffmpeg-bin" >> "$GITHUB_PATH"
          /opt/ffmpeg-bin/ffmpeg -version | head -n1
          /opt/ffmpeg-bin/ffprobe -version | head -n1

      - name: Cache Python libs
        id: cache-pylib
        uses: actions/cache@v4
        with:
          path: /opt/pylib
          key: filimo-pylib-pexpect-v1

      - name: Install pexpect (cache miss only)
        if: steps.cache-pylib.outputs.cache-hit != 'true'
        run: pip install --target /opt/pylib pexpect

      - name: Add Python libs to PYTHONPATH
        run: echo "PYTHONPATH=/opt/pylib" >> "$GITHUB_ENV"

      - name: Resolve Filimo CLI version
        id: cli
        run: |
          SHA=$(git ls-remote \
            https://github.com/SaeedDev94/filimo-plus-cli.git HEAD \
            | cut -c1-12)
          [ -n "$SHA" ] || { echo "::error::Cannot resolve CLI version"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Cache Filimo CLI binary
        id: cache-cli
        uses: actions/cache@v4
        with:
          path: filimo-cli-bin
          # Bump -p1 when the patch below changes.
          key: filimo-cli-${{ steps.cli.outputs.sha }}-p1-go1.24.3

      - name: Set up Go (cache miss only)
        if: steps.cache-cli.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.3"
          cache: false

      - name: Clone, patch and build Filimo CLI (cache miss only)
        if: steps.cache-cli.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 \
            https://github.com/SaeedDev94/filimo-plus-cli.git \
            filimo-cli

          # Adds the -l/-link flag: print the selected HLS link and exit
          # without downloading. Fails loudly if upstream code moved.
          python3 - <<'PY'
          import re

          def edit(path, anchor, add, before=True):
              t = open(path, encoding="utf-8").read()
              assert t.count(anchor) == 1, f"anchor not found in {path}"
              t = t.replace(anchor, add + anchor if before else anchor + add)
              open(path, "w", encoding="utf-8").write(t)

          edit("filimo-cli/internal/cli/args.go",
               "\tIsContinueDownload bool\n",
               "\tLinkOnly           bool\n", before=False)

          edit("filimo-cli/internal/cli/flags.go",
               '\t\t{\n\t\t\tShortName: "c",\n',
               '\t\t{\n\t\t\tShortName: "l",\n\t\t\tFullName:  "link",\n'
               '\t\t\tUsage:     "Print selected HLS link without downloading",\n'
               '\t\t\tRegister: func(flag *Flag) {\n'
               '\t\t\t\tflagSet.BoolVar(&args.LinkOnly, flag.ShortName, args.LinkOnly, flag.Usage)\n'
               '\t\t\t\tflagSet.BoolVar(&args.LinkOnly, flag.FullName, args.LinkOnly, flag.Usage)\n'
               '\t\t\t},\n\t\t},\n')

          edit("filimo-cli/internal/cli/download.go",
               "\tvar downloadDir string\n",
               '\tif args.LinkOnly {\n'
               '\t\tif len(selectedVariants) == 0 {\n'
               '\t\t\tfmt.Println("No video quality selected.")\n'
               '\t\t\treturn\n'
               '\t\t}\n'
               '\t\tfor _, item := range selectedVariants {\n'
               '\t\t\tfmt.Println("Selected HLS link:")\n'
               '\t\t\tfmt.Println(hls.Variants[item].Link)\n'
               '\t\t}\n'
               '\t\treturn\n'
               '\t}\n\n')
          PY

          cd filimo-cli
          go version
          go build -v -o ../filimo-cli-bin ./cmd/filimo-plus-cli

      - name: Verify CLI binary
        run: |
          chmod +x filimo-cli-bin
          ./filimo-cli-bin -h | grep -q -- "-l, -link"

      - name: Download and build video
        env:
          FILIMO_AUTHV1: ${{ secrets.FILIMO_AUTHV1 }}
          FILIMO_URL: ${{ inputs.url }}
          VIDEO_QUALITY: ${{ inputs.quality }}
          SUBTITLE_LANGUAGE: ${{ inputs.subtitle }}
          OUTPUT_MODE: ${{ inputs.output_mode }}
        run: |
          set -euo pipefail

          if [ -z "$FILIMO_AUTHV1" ]; then
            echo "::error::FILIMO_AUTHV1 secret is missing"
            exit 1
          fi

          mkdir -p output media

          cat > filimo_runner.py <<'PY'
          import os
          import re
          import sys
          import pexpect

          CLI = os.path.abspath("./filimo-cli-bin")
          TOKEN = os.environ["FILIMO_AUTHV1"]
          URL = os.environ["FILIMO_URL"]
          QUALITY = os.environ["VIDEO_QUALITY"]
          SUBTITLE = os.environ["SUBTITLE_LANGUAGE"]

          PROMPTS = [
              "Select video variant:",
              "Select audio track:",
              "Select subtitle:",
          ]

          def height(option):
              m = re.search(r"(\d+)p\b", option)
              return int(m.group(1)) if m else 0

          def choose(options, prompt):
              if not options:
                  raise RuntimeError(
                      f"No numbered menu options found for {prompt!r}"
                  )

              if prompt == "Select video variant:":
                  # CLI menu is NOT sorted (360p, 144p, 240p, 480p ...),
                  # so always pick by the real resolution number.
                  ranked = sorted(
                      ((height(o), n) for n, o in options), reverse=True
                  )

                  if QUALITY == "Best available":
                      print(f"[runner] Best -> {ranked[0][0]}p",
                            file=sys.stderr)
                      return str(ranked[0][1])

                  wanted = int(re.match(r"\d+", QUALITY).group(0))

                  for h, n in ranked:
                      if h == wanted:
                          return str(n)

                  lower = [(h, n) for h, n in ranked if 0 < h < wanted]
                  if lower:
                      print(
                          f"[runner] {wanted}p unavailable; "
                          f"using {lower[0][0]}p",
                          file=sys.stderr,
                      )
                      return str(lower[0][1])

                  raise RuntimeError(
                      f"Quality {QUALITY!r} unavailable. "
                      f"Available options: {options!r}"
                  )

              if prompt == "Select subtitle:":
                  if SUBTITLE.lower() == "none":
                      return ""

                  # CLI lists language codes (fa, en, ar), not names.
                  persian = ("fa", "fas", "per", "persian", "farsi", "فارسی")

                  for number, option in options:
                      if option.strip().lower() in persian:
                          return str(number)

                  print(
                      "Persian subtitle not available; skipping.",
                      file=sys.stderr,
                  )
                  return ""

              # Select first available audio track.
              return "1"

          NAME = ""

          WORDS = {
              "فصل": "fasl", "قسمت": "qesmat", "فیلم": "film",
              "سریال": "serial", "مستند": "mostanad",
              "انیمیشن": "animation", "آبی": "abi",
          }

          LETTERS = {
              "آ": "a", "ا": "a", "أ": "a", "إ": "e", "ء": "", "ئ": "i",
              "ب": "b", "پ": "p", "ت": "t", "ث": "s", "ج": "j",
              "چ": "ch", "ح": "h", "خ": "kh", "د": "d", "ذ": "z",
              "ر": "r", "ز": "z", "ژ": "zh", "س": "s", "ش": "sh",
              "ص": "s", "ض": "z", "ط": "t", "ظ": "z", "ع": "a",
              "غ": "gh", "ف": "f", "ق": "q", "ک": "k", "ك": "k",
              "گ": "g", "ل": "l", "م": "m", "ن": "n", "و": "v",
              "ه": "h", "ة": "e", "ی": "i", "ي": "i", "ى": "i",
              "ؤ": "o",
          }

          def finglish(text):
              for i, d in enumerate("۰۱۲۳۴۵۶۷۸۹"):
                  text = text.replace(d, str(i))
              for i, d in enumerate("٠١٢٣٤٥٦٧٨٩"):
                  text = text.replace(d, str(i))

              parts = []
              for word in re.split(r"(\s+)", text):
                  if word in WORDS:
                      parts.append(WORDS[word])
                  else:
                      parts.append("".join(
                          LETTERS.get(c, c) for c in word
                      ))
              return "".join(parts)

          def safe_name(text):
              # Pure English names stay as they are; Persian letters
              # become Finglish. Then make the name filesystem-safe.
              text = finglish(text)
              text = re.sub(r"[^A-Za-z0-9]+", "_", text).strip("_")
              return text[:80].strip("_") or "filimo"

          LINK_ONLY = os.environ.get("OUTPUT_MODE", "") == "Direct link only (HLS)"
          MEDIA = "media/filimo-item"

          def count_segments(directory):
              try:
                  with open(os.path.join(directory, "playlist.m3u8"),
                            encoding="utf-8") as fh:
                      return sum(
                          1 for l in fh
                          if l.strip() and not l.startswith("#")
                      )
              except OSError:
                  return 0

          class Tee:
              """Keeps the full CLI output, but logs segment downloads
              only when they cross a new 10% step (562 lines -> ~10)."""

              def __init__(self):
                  self.text = ""
                  self.buf = ""
                  self.totals = {}
                  self.count = {}
                  self.last = {}

              def write(self, data):
                  self.text += data
                  self.buf += data
                  parts = re.split(r"\r\n|\n|\r", self.buf)
                  self.buf = parts.pop()
                  for line in parts:
                      self.emit(line)

              def flush(self):
                  sys.stdout.flush()

              def finish(self):
                  if self.buf.strip():
                      self.emit(self.buf)
                  self.buf = ""

              def emit(self, line):
                  if "wmsAuthSign" in line:
                      print("[HLS link hidden in log]")
                      return

                  m = re.match(r"Downloading:\s*(.+?),\s*atempt #(\d+)", line)
                  if m and m.group(2) == "1":
                      path = m.group(1)
                      if path.endswith(".key"):
                          return
                      d = os.path.dirname(path)
                      if d not in self.totals:
                          self.totals[d] = count_segments(d)
                      total = self.totals[d]
                      n = self.count[d] = self.count.get(d, 0) + 1
                      if total:
                          pct = min(100, n * 100 // total)
                          bucket = pct // 10
                          if self.last.get(d) == bucket and n != total:
                              return
                          self.last[d] = bucket
                          label = os.path.relpath(d, MEDIA)
                          print(f"[progress] {label}: {pct}% ({n}/{total})")
                      elif n % 50 == 1:
                          print(f"[progress] {d}: {n} segments")
                      sys.stdout.flush()
                      return

                  print(line)
                  sys.stdout.flush()

          def run_cli(args):
              child = pexpect.spawn(
                  CLI,
                  args,
                  encoding="utf-8",
                  timeout=3600,
                  maxread=65535,
              )

              tee = Tee()
              child.logfile_read = tee

              while True:
                  index = child.expect(
                      PROMPTS + [pexpect.EOF],
                      timeout=3600,
                  )

                  if index == len(PROMPTS):
                      break

                  global NAME
                  if not NAME:
                      m = re.search(r"Name:\s*(.+)", child.before or "")
                      if m:
                          NAME = m.group(1).strip()

                  prompt = PROMPTS[index]
                  options = []

                  # Read numbered menu options from the output buffer.
                  while True:
                      try:
                          child.expect(
                              r"(?m)^\s*(\d+)\)\s*(.*?)\r?$",
                              timeout=2,
                          )
                          options.append((
                              int(child.match.group(1)),
                              child.match.group(2).strip(),
                          ))
                      except pexpect.TIMEOUT:
                          break

                  answer = choose(options, prompt)
                  child.sendline(answer)

              child.close()
              tee.finish()

              if child.exitstatus not in (0, None):
                  raise RuntimeError(
                      f"Filimo CLI failed: {child.exitstatus}"
                  )

              return tee.text

          if LINK_ONLY:
              out = run_cli([
                  "-token", TOKEN,
                  "-id", URL,
                  "-l",
              ])

              m = re.search(r"Selected HLS link:\s*\r?\n\s*(\S+)", out)
              if not m:
                  raise RuntimeError("HLS link was not printed by the CLI.")
              link = m.group(1)

              # Remaining validity from the JWT "exp" claim, if present.
              left = ""
              try:
                  import base64, json, time
                  sign = re.search(r"wmsAuthSign=([\w-]+)\.([\w-]+)\.", link)
                  payload = sign.group(2)
                  payload += "=" * (-len(payload) % 4)
                  exp = json.loads(base64.urlsafe_b64decode(payload))["exp"]
                  left = f"{max(0, int(exp - time.time())) // 60} min"
              except Exception:
                  pass

              with open("output/direct-link.txt", "w") as f:
                  f.write(link + "\n")

              with open(os.environ["GITHUB_ENV"], "a") as f:
                  f.write("FILE_NAME=direct-link.txt\n")
                  f.write("FILE_PATH=output/direct-link.txt\n")

              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write("### Filimo direct link (HLS)\n")
                  f.write(f"Title: {NAME}\n\n")
                  f.write(f"Quality: {QUALITY}\n\n")
                  if left:
                      f.write(f"Valid for about: {left}\n\n")
                  f.write(f"{link}\n")
              print("[runner] HLS link saved to output/direct-link.txt")
              sys.exit(0)

          # Download selected video, audio and subtitle tracks.
          run_cli([
              "-token", TOKEN,
              "-id", URL,
              "-o", "media/filimo-item",
          ])

          if not os.path.isdir("media/filimo-item/video"):
              raise RuntimeError("Downloaded video files were not found.")

          # Build a single MP4 from the downloaded media.
          run_cli([
              "-build", "media/filimo-item",
              "-o", "output/filimo.mp4",
          ])

          if not os.path.isfile("output/filimo.mp4"):
              raise RuntimeError("MP4 output was not created.")

          if os.path.getsize("output/filimo.mp4") == 0:
              raise RuntimeError("Generated MP4 is empty.")

          # Final file name from the title (English kept, Persian ->
          # Finglish).
          file_name = safe_name(NAME) + ".mp4"
          os.rename("output/filimo.mp4", f"output/{file_name}")
          print(f"[runner] Title: {NAME!r} -> {file_name}")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"FILE_NAME={file_name}\n")
              f.write(f"FILE_PATH=output/{file_name}\n")
          PY

          python filimo_runner.py

      - name: Validate output file
        if: ${{ inputs.output_mode != 'Direct link only (HLS)' }}
        run: |
          set -euo pipefail

          FILE="$FILE_PATH"
          SIZE=$(stat -c %s "$FILE")

          ffprobe -v error -print_format json \
            -show_format -show_streams "$FILE" > probe.json

          python3 - <<'PY'
          import json, os

          path = os.environ["FILE_PATH"]
          d = json.load(open("probe.json"))
          v = [s for s in d["streams"] if s["codec_type"] == "video"]
          a = [s for s in d["streams"] if s["codec_type"] == "audio"]
          dur = float(d["format"].get("duration", 0))
          size = os.path.getsize(path)

          assert v, "No video stream in output"
          assert a, "No audio stream in output"
          assert dur > 10, f"Duration too short: {dur}s"

          line = (
              f"{v[0]['width']}x{v[0]['height']}, "
              f"{int(dur // 60)}m{int(dur % 60)}s, "
              f"{size / 1048576:.1f} MiB"
          )
          print("Validated:", line)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### Filimo output\n{line}\n")
          PY

          if [ "${{ inputs.output_mode }}" = "GitHub Release" ] \
             && [ "$SIZE" -ge 2147483648 ]; then
            echo "::error::File is over the 2 GiB Release limit"
            exit 1
          fi

      - name: Upload workflow artifact
        if: ${{ inputs.output_mode == 'Workflow Artifact' }}
        uses: actions/upload-artifact@v4
        with:
          name: filimo-video
          path: ${{ env.FILE_PATH }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: ${{ inputs.output_mode != 'Workflow Artifact' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: run-${{ github.run_id }}
          name: Filimo Download ${{ github.run_number }}
          files: ${{ env.FILE_PATH }}
          fail_on_unmatched_files: true
          generate_release_notes: false

      - name: Release links
        if: ${{ inputs.output_mode != 'Workflow Artifact' }}
        run: |
          BASE="https://github.com/${{ github.repository }}/releases"
          TAG="run-${{ github.run_id }}"
          {
            echo "Release: $BASE/tag/$TAG"
            echo "Direct: $BASE/download/$TAG/$FILE_NAME"
          } >> "$GITHUB_STEP_SUMMARY"
