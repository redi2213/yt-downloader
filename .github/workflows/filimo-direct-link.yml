name: Filimo Downloader

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Filimo URL or item ID"
        required: true
        type: string

      quality:
        description: "Video quality"
        required: true
        type: choice
        options:
          - Best available
          - 1080p
          - 720p
          - 480p
          - 360p

      subtitle:
        description: "Subtitle language"
        required: true
        type: choice
        options:
          - none
          - Persian
          - English

      output_mode:
        description: "Output destination"
        required: true
        type: choice
        options:
          - Workflow Artifact
          - GitHub Release

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install pexpect

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.3"
          cache: false

      - name: Clone Filimo CLI
        run: |
          git clone --depth 1 \
            https://github.com/SaeedDev94/filimo-plus-cli.git \
            filimo-cli

      - name: Build Filimo CLI
        working-directory: filimo-cli
        run: |
          go version
          go build -v -o ../filimo-cli-bin \
            ./cmd/filimo-plus-cli

      - name: Download and build video
        env:
          FILIMO_AUTHV1: ${{ secrets.FILIMO_AUTHV1 }}
          FILIMO_URL: ${{ inputs.url }}
          VIDEO_QUALITY: ${{ inputs.quality }}
          SUBTITLE_LANGUAGE: ${{ inputs.subtitle }}
        run: |
          set -euo pipefail

          if [ -z "$FILIMO_AUTHV1" ]; then
            echo "::error::FILIMO_AUTHV1 secret is missing"
            exit 1
          fi

          mkdir -p output media

          cat > filimo_runner.py <<'PY'
          import os
          import re
          import sys
          import pexpect

          CLI = os.path.abspath("./filimo-cli-bin")
          TOKEN = os.environ["FILIMO_AUTHV1"]
          URL = os.environ["FILIMO_URL"]
          QUALITY = os.environ["VIDEO_QUALITY"]
          SUBTITLE = os.environ["SUBTITLE_LANGUAGE"]

          def choose(options, prompt):
              if not options:
                  raise RuntimeError("No menu options detected: " + prompt)

              if prompt == "Select video variant:":
                  if QUALITY == "Best available":
                      return "1"

                  for number, option in options:
                      if QUALITY.lower() in option.lower():
                          return str(number)

                  raise RuntimeError(
                      "Requested quality is unavailable. Options: "
                      + repr(options)
                  )

              if prompt == "Select subtitle:":
                  if SUBTITLE.lower() == "none":
                      return ""

                  aliases = {
                      "persian": ("persian", "farsi", "فارسی"),
                      "english": ("english",),
                  }
                  wanted = aliases.get(SUBTITLE.lower(), (SUBTITLE.lower(),))

                  for number, option in options:
                      if any(x in option.lower() for x in wanted):
                          return str(number)

                  print(
                      "Requested subtitle not found; skipping subtitle.",
                      file=sys.stderr
                  )
                  return ""

              # Select the first audio track by default.
              return "1"

          def run_cli(args):
              child = pexpect.spawn(
                  CLI, args, encoding="utf-8", timeout=3600
              )
              child.logfile_read = sys.stdout

              prompts = [
                  "Select video variant:",
                  "Select audio track:",
                  "Select subtitle:",
              ]

              while True:
                  index = child.expect(
                      prompts + [pexpect.EOF],
                      timeout=3600
                  )

                  if index == len(prompts):
                      break

                  prompt = prompts[index]

                  # The CLI prints numbered options after the prompt
                  # and then waits for a line of input.
                  menu = ""
                  while True:
                      try:
                          menu += child.read_nonblocking(
                              size=4096, timeout=0.4
                          )
                      except (pexpect.TIMEOUT, pexpect.EOF):
                          break

                  options = []
                  for line in menu.splitlines():
                      match = re.match(r"\s*(\d+)\)\s*(.*?)\s*$", line)
                      if match:
                          options.append(
                              (int(match.group(1)), match.group(2))
                          )

                  answer = choose(options, prompt)
                  child.sendline(answer)

              child.close()
              if child.exitstatus not in (0, None):
                  raise RuntimeError(
                      "Filimo CLI failed with exit code "
                      + str(child.exitstatus)
                  )

          run_cli([
              "-token", TOKEN,
              "-id", URL,
              "-o", "media/filimo-item",
          ])

          if not os.path.isdir("media/filimo-item/video"):
              raise RuntimeError("Downloaded video files were not found.")

          # Build the selected video, audio and subtitle into one MP4.
          run_cli([
              "-build", "media/filimo-item",
              "-o", "output/filimo.mp4",
          ])

          if not os.path.isfile("output/filimo.mp4"):
              raise RuntimeError(
                  "The MP4 output was not created. Check the build logs."
              )

          if os.path.getsize("output/filimo.mp4") == 0:
              raise RuntimeError("The generated MP4 is empty.")
          PY

          python filimo_runner.py

      - name: Upload temporary workflow artifact
        if: ${{ inputs.output_mode == 'Workflow Artifact' }}
        uses: actions/upload-artifact@v4
        with:
          name: filimo-video
          path: output/filimo.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: ${{ inputs.output_mode == 'GitHub Release' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: filimo-${{ github.run_number }}
          name: Filimo Download ${{ github.run_number }}
          files: output/filimo.mp4
          fail_on_unmatched_files: true
          generate_release_notes: false
