name: Filimo Downloader

on:
  workflow_dispatch:
    inputs:
      filimo_url:
        description: "Filimo URL or item ID"
        required: true
        type: string

      output_mode:
        description: "Output mode"
        required: true
        type: choice
        options:
          - direct_link
          - github_release
        default: github_release

      video_index:
        description: "Video quality option number"
        required: true
        type: string
        default: "1"

      audio_index:
        description: "Audio track option number"
        required: true
        type: string
        default: "1"

      subtitle_index:
        description: "Subtitle option number; leave blank to skip"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg expect

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24.3"

      - name: Get Filimo CLI
        run: |
          git clone --depth 1 \
            https://github.com/saeeddev94/filimo-plus-cli.git \
            filimo-cli

      - name: Build CLI
        working-directory: filimo-cli
        run: go build -o ../filimo-cli-bin .

      - name: Validate inputs
        env:
          FILIMO_URL: ${{ inputs.filimo_url }}
          VIDEO_INDEX: ${{ inputs.video_index }}
          AUDIO_INDEX: ${{ inputs.audio_index }}
          SUBTITLE_INDEX: ${{ inputs.subtitle_index }}
        run: |
          test -n "$FILIMO_URL"
          [[ "$VIDEO_INDEX" =~ ^[1-9][0-9]*$ ]]
          [[ "$AUDIO_INDEX" =~ ^[1-9][0-9]*$ ]]
          if [[ -n "$SUBTITLE_INDEX" ]]; then
            [[ "$SUBTITLE_INDEX" =~ ^[1-9][0-9]*$ ]]
          fi

      - name: Create interactive runner
        run: |
          cat > run-filimo.exp <<'EXPECT'
          #!/usr/bin/expect -f
          set timeout -1

          set mode $env(PHASE)
          set url $env(FILIMO_URL)
          set token $env(FILIMO_TOKEN)
          set video $env(VIDEO_INDEX)
          set audio $env(AUDIO_INDEX)
          set subtitle $env(SUBTITLE_INDEX)

          log_user 1

          if {$mode eq "link"} {
              spawn ./filimo-cli-bin -id $url -token $token -link
          } elseif {$mode eq "download"} {
              spawn ./filimo-cli-bin -id $url -token $token \
                  -output media/filimo-item
          } elseif {$mode eq "build"} {
              spawn ./filimo-cli-bin -build media/filimo-item \
                  -output dist/filimo-item.mp4
          } else {
              exit 2
          }

          expect {
              -re {(?i)(select|choose).*(video|quality|resolution)|(?i)(video|quality|resolution).*(select|choose)} {
                  if {$mode eq "build"} {
                      send -- "1\r"
                  } else {
                      send -- "$video\r"
                  }
                  exp_continue
              }

              -re {(?i)(select|choose).*(audio|track)|(?i)(audio|track).*(select|choose)} {
                  if {$mode eq "build"} {
                      send -- "1\r"
                  } else {
                      send -- "$audio\r"
                  }
                  exp_continue
              }

              -re {(?i)(select|choose).*(subtitle|subtitles)|(?i)(subtitle|subtitles).*(select|choose)} {
                  if {$mode eq "build"} {
                      if {$subtitle eq ""} {
                          send -- "\r"
                      } else {
                          send -- "1\r"
                      }
                  } else {
                      if {$subtitle eq ""} {
                          send -- "\r"
                      } else {
                          send -- "$subtitle\r"
                      }
                  }
                  exp_continue
              }

              eof {
                  catch wait result
                  set status [lindex $result 3]
                  exit $status
              }
          }
          EXPECT

          chmod +x run-filimo.exp

      - name: Extract direct stream link
        if: inputs.output_mode == 'direct_link'
        env:
          FILIMO_TOKEN: ${{ secrets.FILIMO_AUTHV1 }}
          FILIMO_URL: ${{ inputs.filimo_url }}
          VIDEO_INDEX: ${{ inputs.video_index }}
          AUDIO_INDEX: ${{ inputs.audio_index }}
          SUBTITLE_INDEX: ${{ inputs.subtitle_index }}
          PHASE: link
        run: |
          test -n "$FILIMO_TOKEN" || {
            echo "Missing FILIMO_AUTHV1 repository secret."
            exit 1
          }

          ./run-filimo.exp 2>&1 | tee filimo-output.txt

          {
            echo "## Filimo direct-link result"
            echo
            echo 'The CLI output is available in the workflow logs.'
            echo 'Stream links may expire and may require authorization.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download selected media
        if: inputs.output_mode == 'github_release'
        env:
          FILIMO_TOKEN: ${{ secrets.FILIMO_AUTHV1 }}
          FILIMO_URL: ${{ inputs.filimo_url }}
          VIDEO_INDEX: ${{ inputs.video_index }}
          AUDIO_INDEX: ${{ inputs.audio_index }}
          SUBTITLE_INDEX: ${{ inputs.subtitle_index }}
          PHASE: download
        run: |
          test -n "$FILIMO_TOKEN" || {
            echo "Missing FILIMO_AUTHV1 repository secret."
            exit 1
          }

          mkdir -p media dist
          ./run-filimo.exp 2>&1 | tee filimo-download.log

      - name: Build MP4
        if: inputs.output_mode == 'github_release'
        env:
          FILIMO_TOKEN: ${{ secrets.FILIMO_AUTHV1 }}
          FILIMO_URL: ${{ inputs.filimo_url }}
          VIDEO_INDEX: ${{ inputs.video_index }}
          AUDIO_INDEX: ${{ inputs.audio_index }}
          SUBTITLE_INDEX: ${{ inputs.subtitle_index }}
          PHASE: build
        run: |
          mkdir -p dist
          ./run-filimo.exp 2>&1 | tee filimo-build.log
          test -s dist/filimo-item.mp4

      - name: Publish GitHub Release
        if: inputs.output_mode == 'github_release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: filimo-${{ github.run_id }}-${{ github.run_attempt }}
          name: Filimo Download ${{ github.run_id }}
          files: dist/filimo-item.mp4
          fail_on_unmatched_files: true
          generate_release_notes: false

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filimo-workflow-logs
          path: |
            filimo-output.txt
            filimo-download.log
            filimo-build.log
          if-no-files-found: ignore
          retention-days: 2
