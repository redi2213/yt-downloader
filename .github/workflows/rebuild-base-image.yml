name: Rebuild Base Image

# Runs daily so yt-dlp inside the image always has the latest YouTube
# extraction fixes. The main download workflow (download.yml) just
# pulls this pre-built image instead of installing anything — that's
# where the ~50s -> near-0s speedup comes from.

on:
  schedule:
    - cron: '0 3 * * *'  # every day at 03:00 UTC
  workflow_dispatch: {}   # allow manual trigger from Actions tab
  push:
    paths:
      - 'Dockerfile'
      - '.github/workflows/rebuild-base-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/yt-downloader-base:latest
            ghcr.io/${{ github.repository_owner }}/yt-downloader-base:${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image works
        run: |
          docker run --rm ghcr.io/${{ github.repository_owner }}/yt-downloader-base:latest \
            sh -c "yt-dlp --version && ffmpeg -version | head -1 && aria2c --version | head -1"
