name: Pornhub to GitHub Release

on:
  workflow_dispatch:
    inputs:
      link:
        description: "Pornhub video URL"
        required: true
        type: string

      quality:
        description: "Quality: best, 1080p, 720p, 480p, 240p"
        required: false
        default: "best"
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 python3-requests

      - name: Download Pornhub video
        env:
          INPUT_URL: ${{ inputs.link }}
          QUALITY: ${{ inputs.quality }}
        run: |
          set -e

          python3 <<'PY'
          import os
          import re
          import html
          import subprocess
          import sys
          from urllib.parse import unquote
          import requests

          url = os.environ["INPUT_URL"]
          wanted = os.environ.get("QUALITY", "best").lower().strip()

          # Accept 240 as 240p
          if wanted.isdigit():
              wanted += "p"

          UA = (
              "Mozilla/5.0 (Linux; Android 13) "
              "AppleWebKit/537.36 "
              "(KHTML, like Gecko) "
              "Chrome/140.0.0.0 "
              "Mobile Safari/537.36"
          )

          REFERER = "https://www.pornhub.com/"

          headers = {
              "User-Agent": UA,
              "Referer": REFERER,
              "Accept": (
                  "text/html,application/xhtml+xml,"
                  "application/xml;q=0.9,image/avif,"
                  "image/webp,*/*;q=0.8"
              ),
              "Accept-Language": "en-US,en;q=0.9",
              "Connection": "keep-alive",
          }

          print("Fetching Pornhub page...")

          session = requests.Session()

          response = session.get(
              url,
              headers=headers,
              timeout=30,
              allow_redirects=True
          )

          print("HTTP:", response.status_code)
          print("Final URL:", response.url)
          print("Page size:", len(response.text))

          response.raise_for_status()

          page = response.text

          # Save page for debugging if extraction fails
          with open("/tmp/pornhub_page.html", "w", encoding="utf-8") as f:
              f.write(page)

          # -------------------------
          # Title
          # -------------------------

          title_match = re.search(
              r"<title[^>]*>(.*?)</title>",
              page,
              re.I | re.S
          )

          title = (
              html.unescape(title_match.group(1)).strip()
              if title_match
              else "Pornhub Video"
          )

          title = re.sub(r"\s+", " ", title)

          title = re.sub(
              r"\s*-\s*Pornhub\.com\s*$",
              "",
              title,
              flags=re.I
          )

          print("")
          print("Title:", title)

          # -------------------------
          # Decode escaped HTML/JSON
          # -------------------------

          decoded = page

          decoded = decoded.replace("\\/", "/")
          decoded = decoded.replace("\\u002F", "/")
          decoded = decoded.replace("\\u002f", "/")
          decoded = decoded.replace("\\u0026", "&")
          decoded = html.unescape(decoded)

          # -------------------------
          # Find HLS master URLs
          # -------------------------

          patterns = [

              r'https?://[^"\']+?master\.m3u8[^"\']*',

              r'https?:\\/\\/[^"\']+?master\.m3u8[^"\']*',

              r'"videoUrl"\s*:\s*"([^"]+master\.m3u8[^"]*)"',
          ]

          found = []

          for pattern in patterns:
              for match in re.findall(
                  pattern,
                  decoded,
                  re.I
              ):

                  if isinstance(match, tuple):
                      match = match[0]

                  match = match.replace("\\/", "/")
                  match = match.replace("\\u0026", "&")
                  match = html.unescape(match)

                  if "master.m3u8" in match:
                      found.append(match)

          # Remove duplicates
          found = list(dict.fromkeys(found))

          qualities = {}

          for item in found:

              qm = re.search(
                  r"/(\d{3,4})P[_/]",
                  item,
                  re.I
              )

              if not qm:
                  qm = re.search(
                      r"(\d{3,4})P",
                      item,
                      re.I
                  )

              if qm:
                  q = qm.group(1) + "p"
                  qualities[q] = item

          # -------------------------
          # Debug if extraction fails
          # -------------------------

          if not qualities:

              print("")
              print("ERROR: No HLS streams found.")

              # Look for evidence that page contains HLS
              for keyword in [
                  "master.m3u8",
                  "videoUrl",
                  "hls",
                  "1080P",
                  "720P"
              ]:
                  print(
                      f"{keyword}:",
                      keyword.lower() in decoded.lower()
                  )

              print("")
              print("First 500 characters:")
              print(decoded[:500])

              sys.exit(1)

          # -------------------------
          # Available qualities
          # -------------------------

          print("")
          print("Available qualities:")

          for q in sorted(
              qualities,
              key=lambda x: int(x[:-1]),
              reverse=True
          ):
              print(" ", q)

          # -------------------------
          # Select quality
          # -------------------------

          if wanted == "best":

              selected = max(
                  qualities,
                  key=lambda x: int(x[:-1])
              )

          else:

              if wanted not in qualities:

                  print("")
                  print(
                      f"ERROR: Quality {wanted} "
                      f"is not available."
                  )

                  print(
                      "Available:",
                      ", ".join(
                          sorted(
                              qualities,
                              key=lambda x: int(x[:-1]),
                              reverse=True
                          )
                      )
                  )

                  sys.exit(1)

              selected = wanted

          stream = qualities[selected]

          print("")
          print("Selected:", selected)
          print("Stream:", stream)

          # -------------------------
          # Safe filename
          # -------------------------

          filename = re.sub(
              r'[\\/:*?"<>|]',
              "_",
              title
          )

          filename = re.sub(
              r"\s+",
              " ",
              filename
          ).strip()

          if not filename:
              filename = "Pornhub Video"

          output = filename + ".mp4"

          # -------------------------
          # GitHub environment
          # -------------------------

          with open(
              os.environ["GITHUB_ENV"],
              "a"
          ) as env:

              env.write(
                  "VIDEO_TITLE<<EOF\n"
                  + title
                  + "\nEOF\n"
              )

              env.write(
                  f"VIDEO_QUALITY={selected}\n"
              )

              env.write(
                  "VIDEO_FILE<<EOF\n"
                  + output
                  + "\nEOF\n"
              )

          # -------------------------
          # FFmpeg
          # -------------------------

          cmd = [
              "ffmpeg",

              "-hide_banner",

              "-user_agent",
              UA,

              "-referer",
              REFERER,

              "-i",
              stream,

              "-c",
              "copy",

              "-movflags",
              "+faststart",

              "-y",
              output,
          ]

          print("")
          print("Starting FFmpeg...")
          print("")

          result = subprocess.run(cmd)

          if result.returncode != 0:
              print("")
              print("ERROR: FFmpeg failed.")
              sys.exit(result.returncode)

          if not os.path.exists(output):

              print(
                  "ERROR: Output file was not created."
              )

              sys.exit(1)

          size = os.path.getsize(output)

          print("")
          print("Download completed.")
          print("File:", output)
          print(
              "Size:",
              f"{size / 1024 / 1024:.2f} MB"
          )

          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          set -e

          TAG="ph-$(date -u +%Y%m%d-%H%M%S)"

          echo "Creating release..."
          echo "Tag: $TAG"

          gh release create \
            "$TAG" \
            "$VIDEO_FILE" \
            --repo "${{ github.repository }}" \
            --title "$VIDEO_TITLE ($VIDEO_QUALITY)" \
            --notes "Downloaded automatically by GitHub Actions."

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${VIDEO_FILE}"

          echo ""
          echo "=========================================="
          echo "DOWNLOAD COMPLETED"
          echo "=========================================="
          echo ""
          echo "Title:   $VIDEO_TITLE"
          echo "Quality: $VIDEO_QUALITY"
          echo "File:    $VIDEO_FILE"
          echo ""
          echo "DIRECT LINK:"
          echo "$RELEASE_URL"
          echo ""
          echo "=========================================="

          echo "RELEASE_URL=$RELEASE_URL" >> "$GITHUB_ENV"