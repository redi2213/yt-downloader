name: Pornhub to GitHub Release

on:
  workflow_dispatch:
    inputs:
      link:
        description: "Pornhub video URL"
        required: true
        type: string

      quality:
        description: "Quality: best, 1080p, 720p, 480p, 240p"
        required: false
        default: "best"
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    env:
      INPUT_URL: ${{ inputs.link }}
      QUALITY: ${{ inputs.quality }}

    steps:

      # ==========================================
      # 1. Install dependencies
      # ==========================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            curl \
            python3

          echo
          echo "FFmpeg:"
          ffmpeg -version | head -1

          echo
          echo "Curl:"
          curl --version | head -1


      # ==========================================
      # 2. Fetch Pornhub page with session cookies
      # ==========================================

      - name: Fetch Pornhub page
        run: |
          set -e

          UA="Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36"

          rm -f /tmp/cookies.txt
          rm -f /tmp/home.html
          rm -f /tmp/pornhub.html
          rm -f /tmp/home_headers.txt
          rm -f /tmp/video_headers.txt

          echo "=========================================="
          echo "STEP 1: GET HOMEPAGE"
          echo "=========================================="

          echo
          echo "URL:"
          echo "https://www.pornhub.com/"

          curl \
            --max-time 30 \
            --retry 2 \
            --retry-delay 2 \
            --compressed \
            --user-agent "$UA" \
            --header "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
            --header "Accept-Language: en-US,en;q=0.9" \
            --header "Upgrade-Insecure-Requests: 1" \
            --cookie-jar /tmp/cookies.txt \
            --dump-header /tmp/home_headers.txt \
            --output /tmp/home.html \
            "https://www.pornhub.com/"

          echo
          echo "Homepage size:"
          wc -c /tmp/home.html

          echo
          echo "Homepage cookies:"
          cat /tmp/cookies.txt || true

          echo
          echo "=========================================="
          echo "STEP 2: GET VIDEO PAGE"
          echo "=========================================="

          echo
          echo "Video URL:"
          echo "$INPUT_URL"

          curl \
            --max-time 30 \
            --retry 2 \
            --retry-delay 2 \
            --compressed \
            --user-agent "$UA" \
            --referer "https://www.pornhub.com/" \
            --header "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
            --header "Accept-Language: en-US,en;q=0.9" \
            --header "Upgrade-Insecure-Requests: 1" \
            --header "Sec-Fetch-Dest: document" \
            --header "Sec-Fetch-Mode: navigate" \
            --header "Sec-Fetch-Site: same-origin" \
            --header "Sec-Fetch-User: ?1" \
            --cookie /tmp/cookies.txt \
            --cookie-jar /tmp/cookies.txt \
            --dump-header /tmp/video_headers.txt \
            --output /tmp/pornhub.html \
            "$INPUT_URL"

          echo
          echo "=========================================="
          echo "VIDEO RESPONSE"
          echo "=========================================="

          echo
          echo "Page size:"
          wc -c /tmp/pornhub.html

          echo
          echo "=========================================="
          echo "HEADERS"
          echo "=========================================="

          cat /tmp/video_headers.txt

          echo
          echo "=========================================="
          echo "TITLE"
          echo "=========================================="

          grep -oi '<title[^>]*>[^<]*' \
            /tmp/pornhub.html |
            head -1 || true

          echo
          echo "=========================================="
          echo "HLS CHECK"
          echo "=========================================="

          if grep -qi "master.m3u8" /tmp/pornhub.html; then
            echo "HLS master playlist FOUND."
          else
            echo "WARNING: master.m3u8 NOT found."
          fi

          echo
          echo "=========================================="
          echo "VIEWKEY CHECK"
          echo "=========================================="

          VIEWKEY=$(echo "$INPUT_URL" | sed -n 's/.*viewkey=\([^&]*\).*/\1/p')

          echo "Requested viewkey:"
          echo "$VIEWKEY"

          if [ -n "$VIEWKEY" ]; then
            if grep -q "$VIEWKEY" /tmp/pornhub.html; then
              echo "Viewkey FOUND in page."
            else
              echo "Viewkey NOT found in page."
            fi
          fi


      # ==========================================
      # 3. Extract HLS streams
      # ==========================================

      - name: Extract HLS streams
        run: |
          set -e

          python3 <<'PY'

          import os
          import re
          import html
          import sys
          from urllib.parse import unquote

          page_file = "/tmp/pornhub.html"

          with open(
              page_file,
              "r",
              encoding="utf-8",
              errors="ignore"
          ) as f:
              page = f.read()

          wanted = os.environ.get(
              "QUALITY",
              "best"
          ).lower().strip()

          if wanted.isdigit():
              wanted += "p"

          # ======================================
          # TITLE
          # ======================================

          title_match = re.search(
              r"<title[^>]*>(.*?)</title>",
              page,
              re.I | re.S
          )

          title = (
              html.unescape(
                  title_match.group(1)
              ).strip()
              if title_match
              else "Pornhub Video"
          )

          title = re.sub(
              r"\s+",
              " ",
              title
          )

          title = re.sub(
              r"\s*-\s*Pornhub\.com\s*$",
              "",
              title,
              flags=re.I
          )

          print("Title:")
          print(title)

          # ======================================
          # DECODE
          # ======================================

          decoded = page

          for _ in range(3):

              decoded = decoded.replace(
                  "\\/",
                  "/"
              )

              decoded = decoded.replace(
                  "\\u002F",
                  "/"
              )

              decoded = decoded.replace(
                  "\\u002f",
                  "/"
              )

              decoded = decoded.replace(
                  "\\u0026",
                  "&"
              )

              decoded = html.unescape(
                  decoded
              )

          # ======================================
          # EXTRACT MASTER PLAYLISTS
          # ======================================

          patterns = [

              r'"videoUrl"\s*:\s*"([^"]*master\.m3u8[^"]*)"',

              r'"videoUrl"\s*:\s*\\?"([^"]*master\.m3u8[^"]*)',

              r'https?://[^"\s<>]+master\.m3u8[^"\s<>]*',

              r'https?:\\/\\/[^"\s<>]+master\.m3u8[^"\s<>]*',

          ]

          found = []

          for pattern in patterns:

              matches = re.findall(
                  pattern,
                  decoded,
                  re.I
              )

              for item in matches:

                  if isinstance(item, tuple):
                      item = item[0]

                  item = item.replace(
                      "\\/",
                      "/"
                  )

                  item = item.replace(
                      "\\u0026",
                      "&"
                  )

                  item = item.replace(
                      "\\u002F",
                      "/"
                  )

                  item = html.unescape(
                      item
                  )

                  if "master.m3u8" in item:

                      found.append(item)

          # ======================================
          # ALSO SEARCH RAW PAGE
          # ======================================

          raw_matches = re.findall(
              r'https?://[^"\s<>\\]+master\.m3u8[^"\s<>\\]*',
              page,
              re.I
          )

          for item in raw_matches:

              item = item.replace(
                  "\\/",
                  "/"
              )

              item = item.replace(
                  "\\u0026",
                  "&"
              )

              item = html.unescape(
                  item
              )

              found.append(item)

          # ======================================
          # CLEAN DUPLICATES
          # ======================================

          cleaned = []

          for item in found:

              item = item.strip()

              if item not in cleaned:
                  cleaned.append(item)

          found = cleaned

          print("")
          print("Found master playlists:")
          print(len(found))

          # ======================================
          # DETECT QUALITIES
          # ======================================

          qualities = {}

          for item in found:

              match = re.search(
                  r"/(\d{3,4})P[_/]",
                  item,
                  re.I
              )

              if not match:

                  match = re.search(
                      r"(\d{3,4})P",
                      item,
                      re.I
                  )

              if match:

                  quality = (
                      match.group(1)
                      + "p"
                  )

                  qualities[quality] = item

          # ======================================
          # DIAGNOSTICS
          # ======================================

          if not qualities:

              print("")
              print("ERROR: No HLS streams found.")

              print("")
              print("Diagnostics:")

              for keyword in [
                  "master.m3u8",
                  "videoUrl",
                  "hls",
                  "1080P",
                  "720P",
                  "480P",
                  "240P",
              ]:

                  print(
                      f"{keyword}:",
                      keyword.lower()
                      in decoded.lower()
                  )

              print("")
              print(
                  "Page size:",
                  len(page)
              )

              print("")
              print(
                  "First 500 characters:"
              )

              print(page[:500])

              sys.exit(1)

          # ======================================
          # AVAILABLE QUALITIES
          # ======================================

          ordered = sorted(
              qualities,
              key=lambda x: int(x[:-1]),
              reverse=True
          )

          print("")
          print("Available qualities:")

          for q in ordered:
              print(" ", q)

          # ======================================
          # SELECT QUALITY
          # ======================================

          if wanted == "best":

              selected = ordered[0]

          else:

              if wanted not in qualities:

                  print("")
                  print(
                      "ERROR: Requested quality "
                      f"{wanted} is not available."
                  )

                  print(
                      "Available:",
                      ", ".join(ordered)
                  )

                  sys.exit(1)

              selected = wanted

          stream = qualities[selected]

          print("")
          print(
              "Selected quality:",
              selected
          )

          print("")
          print("Stream URL:")
          print(stream)

          # ======================================
          # SAFE FILENAME
          # ======================================

          filename = re.sub(
              r'[\\/:*?"<>|]',
              "_",
              title
          )

          filename = re.sub(
              r"\s+",
              " ",
              filename
          ).strip()

          if not filename:
              filename = "Pornhub Video"

          output = filename + ".mp4"

          # ======================================
          # GITHUB ENV
          # ======================================

          env_file = os.environ["GITHUB_ENV"]

          with open(
              env_file,
              "a",
              encoding="utf-8"
          ) as env:

              env.write(
                  "VIDEO_TITLE<<EOF\n"
              )

              env.write(
                  title + "\n"
              )

              env.write(
                  "EOF\n"
              )

              env.write(
                  f"VIDEO_QUALITY={selected}\n"
              )

              env.write(
                  "VIDEO_STREAM<<EOF\n"
              )

              env.write(
                  stream + "\n"
              )

              env.write(
                  "EOF\n"
              )

              env.write(
                  "VIDEO_FILE<<EOF\n"
              )

              env.write(
                  output + "\n"
              )

              env.write(
                  "EOF\n"
              )

          PY


      # ==========================================
      # 4. Download with FFmpeg
      # ==========================================

      - name: Download video
        run: |
          set -e

          UA="Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36"

          echo "=========================================="
          echo "DOWNLOADING"
          echo "=========================================="

          echo
          echo "Title:"
          echo "$VIDEO_TITLE"

          echo
          echo "Quality:"
          echo "$VIDEO_QUALITY"

          echo
          echo "Output:"
          echo "$VIDEO_FILE"

          echo
          echo "Starting FFmpeg..."

          ffmpeg \
            -hide_banner \
            -stats \
            -user_agent "$UA" \
            -referer "https://www.pornhub.com/" \
            -i "$VIDEO_STREAM" \
            -c copy \
            -movflags +faststart \
            -y \
            "$VIDEO_FILE"

          echo
          echo "=========================================="
          echo "DOWNLOAD COMPLETE"
          echo "=========================================="

          ls -lh "$VIDEO_FILE"

          echo
          echo "File information:"

          ffprobe \
            -hide_banner \
            "$VIDEO_FILE" 2>&1 |
            grep -E \
              "Duration:|Video:|Audio:" ||
              true


      # ==========================================
      # 5. Create GitHub Release
      # ==========================================

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -e

          TAG="ph-$(date -u +%Y%m%d-%H%M%S)"

          echo "=========================================="
          echo "CREATING RELEASE"
          echo "=========================================="

          echo
          echo "Tag:"
          echo "$TAG"

          echo
          echo "File:"
          echo "$VIDEO_FILE"

          gh release create \
            "$TAG" \
            "$VIDEO_FILE" \
            --repo "${{ github.repository }}" \
            --title "$VIDEO_TITLE ($VIDEO_QUALITY)" \
            --notes "Downloaded automatically by GitHub Actions."

          # ======================================
          # DIRECT ASSET URL
          # ======================================

          ENCODED_FILE=$(python3 -c '
          import urllib.parse
          import sys
          print(
              urllib.parse.quote(
                  sys.argv[1]
              )
          )
          ' "$VIDEO_FILE")

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ENCODED_FILE}"

          echo
          echo "=========================================="
          echo "SUCCESS"
          echo "=========================================="

          echo
          echo "Direct link:"
          echo "$RELEASE_URL"

          echo
          echo "Release:"
          echo "https://github.com/${{ github.repository }}/releases/tag/${TAG}"

          echo
          echo "=========================================="

          {
            echo "### Pornhub Download"
            echo
            echo "**Title:** $VIDEO_TITLE"
            echo
            echo "**Quality:** $VIDEO_QUALITY"
            echo
            echo "**Direct link:**"
            echo
            echo "$RELEASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"