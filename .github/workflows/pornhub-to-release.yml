name: Pornhub to GitHub Release

on:
  workflow_dispatch:
    inputs:
      link:
        description: "Pornhub video URL"
        required: true
        type: string

      quality:
        description: "Quality: best, 1080p, 720p, 480p, 240p"
        required: false
        default: "best"
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    env:
      INPUT_URL: ${{ inputs.link }}
      QUALITY: ${{ inputs.quality }}

    steps:

      # ==========================================
      # 1. Install
      # ==========================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update
          sudo apt-get install -y ffmpeg curl python3

          echo "FFmpeg:"
          ffmpeg -version | head -1

          echo
          echo "Curl:"
          curl --version | head -1


      # ==========================================
      # 2. Create Pornhub session
      # ==========================================

      - name: Create Pornhub session
        run: |
          set -e

          UA="Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36"

          rm -f /tmp/cookies.txt
          rm -f /tmp/home.html
          rm -f /tmp/home_headers.txt

          echo "=========================================="
          echo "CREATING SESSION"
          echo "=========================================="

          curl \
            --http2 \
            --max-time 30 \
            --retry 2 \
            --retry-delay 2 \
            --compressed \
            --user-agent "$UA" \
            --header "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
            --header "Accept-Language: en-US,en;q=0.9" \
            --header "Upgrade-Insecure-Requests: 1" \
            --cookie-jar /tmp/cookies.txt \
            --dump-header /tmp/home_headers.txt \
            --output /tmp/home.html \
            "https://www.pornhub.com/"

          echo
          echo "Homepage size:"
          wc -c /tmp/home.html

          echo
          echo "Homepage headers:"
          cat /tmp/home_headers.txt

          echo
          echo "Cookies:"
          cat /tmp/cookies.txt

          if [ ! -s /tmp/home.html ]; then
            echo
            echo "ERROR: Homepage download is empty."
            exit 1
          fi


      # ==========================================
      # 3. Fetch video page WITHOUT auto redirect
      # ==========================================

      - name: Fetch video page
        run: |
          set -e

          UA="Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36"

          rm -f /tmp/pornhub.html
          rm -f /tmp/video_headers.txt

          echo "=========================================="
          echo "FETCHING VIDEO PAGE"
          echo "=========================================="

          echo
          echo "Requested URL:"
          echo "$INPUT_URL"

          HTTP_CODE=$(curl \
            --http2 \
            --max-time 30 \
            --retry 2 \
            --retry-delay 2 \
            --compressed \
            --user-agent "$UA" \
            --referer "https://www.pornhub.com/" \
            --header "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
            --header "Accept-Language: en-US,en;q=0.9" \
            --header "Upgrade-Insecure-Requests: 1" \
            --header "Sec-Fetch-Dest: document" \
            --header "Sec-Fetch-Mode: navigate" \
            --header "Sec-Fetch-Site: same-origin" \
            --header "Sec-Fetch-User: ?1" \
            --cookie /tmp/cookies.txt \
            --cookie-jar /tmp/cookies.txt \
            --dump-header /tmp/video_headers.txt \
            --output /tmp/pornhub.html \
            --write-out "%{http_code}" \
            "$INPUT_URL")

          echo
          echo "HTTP CODE:"
          echo "$HTTP_CODE"

          echo
          echo "=========================================="
          echo "VIDEO HEADERS"
          echo "=========================================="

          cat /tmp/video_headers.txt

          echo
          echo "=========================================="
          echo "PAGE SIZE"
          echo "=========================================="

          wc -c /tmp/pornhub.html

          echo
          echo "=========================================="
          echo "TITLE"
          echo "=========================================="

          grep -oi '<title[^>]*>[^<]*' \
            /tmp/pornhub.html |
            head -1 || true

          echo
          echo "=========================================="
          echo "LOCATION"
          echo "=========================================="

          grep -i "^location:" \
            /tmp/video_headers.txt ||
            echo "No Location header"

          echo
          echo "=========================================="
          echo "HLS CHECK"
          echo "=========================================="

          if grep -qi "master.m3u8" /tmp/pornhub.html; then
            echo "master.m3u8 FOUND"
          else
            echo "master.m3u8 NOT FOUND"
          fi

          echo
          echo "=========================================="
          echo "VIDEO URL CHECK"
          echo "=========================================="

          if grep -qi "videoUrl" /tmp/pornhub.html; then
            echo "videoUrl FOUND"
          else
            echo "videoUrl NOT FOUND"
          fi

          if [ ! -s /tmp/pornhub.html ]; then
            echo
            echo "ERROR: Video page is EMPTY."
            echo
            echo "Cookies:"
            cat /tmp/cookies.txt
            exit 1
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo
            echo "ERROR: Video page returned HTTP $HTTP_CODE"
            exit 1
          fi


      # ==========================================
      # 4. Extract HLS
      # ==========================================

      - name: Extract HLS streams
        run: |
          set -e

          python3 <<'PY'

          import os
          import re
          import html
          import sys

          page_file = "/tmp/pornhub.html"

          with open(
              page_file,
              "r",
              encoding="utf-8",
              errors="ignore"
          ) as f:
              page = f.read()

          print("Page size:", len(page))

          if not page:
              print("ERROR: Empty page")
              sys.exit(1)

          wanted = os.environ.get(
              "QUALITY",
              "best"
          ).lower().strip()

          if wanted.isdigit():
              wanted += "p"

          # ======================================
          # TITLE
          # ======================================

          title_match = re.search(
              r"<title[^>]*>(.*?)</title>",
              page,
              re.I | re.S
          )

          title = (
              html.unescape(
                  title_match.group(1)
              ).strip()
              if title_match
              else "Pornhub Video"
          )

          title = re.sub(
              r"\s+",
              " ",
              title
          )

          title = re.sub(
              r"\s*-\s*Pornhub\.com\s*$",
              "",
              title,
              flags=re.I
          )

          print("")
          print("Title:")
          print(title)

          # ======================================
          # DECODE
          # ======================================

          decoded = page

          for _ in range(5):

              decoded = decoded.replace(
                  "\\/",
                  "/"
              )

              decoded = decoded.replace(
                  "\\u002F",
                  "/"
              )

              decoded = decoded.replace(
                  "\\u002f",
                  "/"
              )

              decoded = decoded.replace(
                  "\\u0026",
                  "&"
              )

              decoded = html.unescape(
                  decoded
              )

          # ======================================
          # FIND MASTER M3U8
          # ======================================

          patterns = [

              r'"videoUrl"\s*:\s*"([^"]*master\.m3u8[^"]*)',

              r'"videoUrl"\s*:\s*\\?"([^"]*master\.m3u8[^"]*)',

              r'https?://[^"\'<>\s\\]+master\.m3u8[^"\'<>\s\\]*',

              r'https?:\\/\\/[^"\'<>\s]+master\.m3u8[^"\'<>\s]*',

          ]

          found = []

          for pattern in patterns:

              for item in re.findall(
                  pattern,
                  decoded,
                  re.I
              ):

                  if isinstance(item, tuple):
                      item = item[0]

                  item = item.replace(
                      "\\/",
                      "/"
                  )

                  item = item.replace(
                      "\\u0026",
                      "&"
                  )

                  item = item.replace(
                      "\\u002F",
                      "/"
                  )

                  item = html.unescape(
                      item
                  )

                  if "master.m3u8" in item:
                      found.append(item)

          # ======================================
          # UNIQUE
          # ======================================

          unique = []

          for item in found:

              item = item.strip()

              if item and item not in unique:
                  unique.append(item)

          found = unique

          print("")
          print("Found master playlists:")
          print(len(found))

          # ======================================
          # QUALITIES
          # ======================================

          qualities = {}

          for item in found:

              match = re.search(
                  r"/(\d{3,4})P[_/]",
                  item,
                  re.I
              )

              if not match:

                  match = re.search(
                      r"(\d{3,4})P",
                      item,
                      re.I
                  )

              if match:

                  q = match.group(1) + "p"

                  qualities[q] = item

          if not qualities:

              print("")
              print("ERROR: No HLS streams found.")

              print("")
              print("Diagnostics:")

              for keyword in [
                  "master.m3u8",
                  "videoUrl",
                  "hls",
                  "1080P",
                  "720P",
                  "480P",
                  "240P",
              ]:

                  print(
                      keyword + ":",
                      keyword.lower()
                      in decoded.lower()
                  )

              print("")
              print("Page size:", len(page))

              print("")
              print("First 1000 chars:")
              print(page[:1000])

              sys.exit(1)

          # ======================================
          # ORDER
          # ======================================

          ordered = sorted(
              qualities,
              key=lambda x: int(x[:-1]),
              reverse=True
          )

          print("")
          print("Available qualities:")

          for q in ordered:
              print(" ", q)

          # ======================================
          # SELECT
          # ======================================

          if wanted == "best":

              selected = ordered[0]

          elif wanted in qualities:

              selected = wanted

          else:

              print("")
              print(
                  "ERROR: Requested quality "
                  + wanted
                  + " is not available."
              )

              sys.exit(1)

          stream = qualities[selected]

          print("")
          print("Selected quality:")
          print(selected)

          print("")
          print("Stream URL:")
          print(stream)

          # ======================================
          # FILENAME
          # ======================================

          filename = re.sub(
              r'[\\/:*?"<>|]',
              "_",
              title
          )

          filename = re.sub(
              r"\s+",
              " ",
              filename
          ).strip()

          if not filename:
              filename = "Pornhub Video"

          output = filename + ".mp4"

          # ======================================
          # GITHUB ENV
          # ======================================

          env_file = os.environ["GITHUB_ENV"]

          with open(
              env_file,
              "a",
              encoding="utf-8"
          ) as env:

              env.write(
                  "VIDEO_TITLE<<EOF\n"
              )
              env.write(
                  title + "\n"
              )
              env.write(
                  "EOF\n"
              )

              env.write(
                  "VIDEO_QUALITY="
                  + selected
                  + "\n"
              )

              env.write(
                  "VIDEO_STREAM<<EOF\n"
              )
              env.write(
                  stream + "\n"
              )
              env.write(
                  "EOF\n"
              )

              env.write(
                  "VIDEO_FILE<<EOF\n"
              )
              env.write(
                  output + "\n"
              )
              env.write(
                  "EOF\n"
              )

          PY


      # ==========================================
      # 5. FFmpeg
      # ==========================================

      - name: Download video
        run: |
          set -e

          UA="Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36"

          echo "=========================================="
          echo "FFMPEG DOWNLOAD"
          echo "=========================================="

          echo
          echo "Quality:"
          echo "$VIDEO_QUALITY"

          echo
          echo "Output:"
          echo "$VIDEO_FILE"

          ffmpeg \
            -hide_banner \
            -stats \
            -user_agent "$UA" \
            -referer "https://www.pornhub.com/" \
            -i "$VIDEO_STREAM" \
            -c copy \
            -movflags +faststart \
            -y \
            "$VIDEO_FILE"

          echo
          echo "=========================================="
          echo "DOWNLOAD COMPLETE"
          echo "=========================================="

          ls -lh "$VIDEO_FILE"

          ffprobe \
            -hide_banner \
            "$VIDEO_FILE" 2>&1 |
            grep -E "Duration:|Video:|Audio:" ||
            true


      # ==========================================
      # 6. GitHub Release
      # ==========================================

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}

        run: |
          set -e

          TAG="ph-$(date -u +%Y%m%d-%H%M%S)"

          echo "=========================================="
          echo "CREATING RELEASE"
          echo "=========================================="

          gh release create \
            "$TAG" \
            "$VIDEO_FILE" \
            --repo "${{ github.repository }}" \
            --title "$VIDEO_TITLE ($VIDEO_QUALITY)" \
            --notes "Downloaded automatically by GitHub Actions."

          ENCODED_FILE=$(python3 -c '
          import urllib.parse
          import sys
          print(urllib.parse.quote(sys.argv[1]))
          ' "$VIDEO_FILE")

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ENCODED_FILE}"

          echo
          echo "=========================================="
          echo "SUCCESS"
          echo "=========================================="

          echo
          echo "Direct link:"
          echo "$RELEASE_URL"

          echo
          echo "Release:"
          echo "https://github.com/${{ github.repository }}/releases/tag/${TAG}"

          {
            echo "## Pornhub Download"
            echo
            echo "**Title:** $VIDEO_TITLE"
            echo
            echo "**Quality:** $VIDEO_QUALITY"
            echo
            echo "**Direct link:**"
            echo
            echo "$RELEASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"