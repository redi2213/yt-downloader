name: Pornhub to GitHub Release

on:
  workflow_dispatch:
    inputs:
      link:
        description: "Pornhub video URL"
        required: true
        type: string

      quality:
        description: "Quality: best, 1080p, 720p, 480p, 240p"
        required: false
        default: "best"
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 python3-requests

      - name: Download video
        env:
          INPUT_URL: ${{ inputs.link }}
          QUALITY: ${{ inputs.quality }}
        run: |
          set -e

          python3 <<'PY'
          import os
          import re
          import html
          import subprocess
          import sys
          from urllib.parse import unquote
          import requests

          url = os.environ["INPUT_URL"]
          wanted = os.environ.get("QUALITY", "best").lower()

          UA = (
              "Mozilla/5.0 (Linux; Android 13) "
              "AppleWebKit/537.36 "
              "Chrome/140.0 Mobile Safari/537.36"
          )

          REFERER = "https://www.pornhub.com/"

          headers = {
              "User-Agent": UA,
              "Referer": REFERER,
          }

          print("Fetching Pornhub page...")

          session = requests.Session()
          response = session.get(
              url,
              headers=headers,
              timeout=30
          )
          response.raise_for_status()

          page = response.text

          # -------------------------
          # Title
          # -------------------------

          title_match = re.search(
              r"<title>(.*?)</title>",
              page,
              re.I | re.S
          )

          title = (
              html.unescape(title_match.group(1)).strip()
              if title_match
              else "Pornhub Video"
          )

          title = re.sub(r"\s+", " ", title)
          title = re.sub(
              r"\s*-\s*Pornhub\.com\s*$",
              "",
              title,
              flags=re.I
          )

          # -------------------------
          # Extract master.m3u8
          # -------------------------

          matches = re.findall(
              r'"videoUrl"\s*:\s*"([^"]*master\.m3u8[^"]*)"',
              page,
              re.I
          )

          qualities = {}

          for item in matches:

              item = item.replace("\\/", "/")
              item = item.replace("\\u0026", "&")
              item = html.unescape(item)
              item = unquote(item)

              q = re.search(
                  r"/(\d{3,4})P_",
                  item,
                  re.I
              )

              if q:
                  quality = q.group(1) + "p"
                  qualities[quality] = item

          if not qualities:
              print("ERROR: No HLS streams found.")
              sys.exit(1)

          print("")
          print("Available qualities:")

          for q in sorted(
              qualities,
              key=lambda x: int(x[:-1]),
              reverse=True
          ):
              print(" ", q)

          # -------------------------
          # Select quality
          # -------------------------

          if wanted == "best":
              selected = max(
                  qualities,
                  key=lambda x: int(x[:-1])
              )
          else:
              if wanted not in qualities:
                  print(
                      f"ERROR: Requested quality "
                      f"{wanted} is not available."
                  )
                  sys.exit(1)

              selected = wanted

          stream = qualities[selected]

          print("")
          print("Title:", title)
          print("Selected:", selected)
          print("Stream:", stream)

          # -------------------------
          # Safe filename
          # -------------------------

          filename = re.sub(
              r'[\\/:*?"<>|]',
              "_",
              title
          )

          filename = re.sub(
              r"\s+",
              " ",
              filename
          ).strip()

          if not filename:
              filename = "Pornhub Video"

          output = filename + ".mp4"

          # GitHub environment variables
          with open(
              os.environ["GITHUB_ENV"],
              "a"
          ) as env:

              env.write(f"VIDEO_TITLE={title}\n")
              env.write(f"VIDEO_QUALITY={selected}\n")
              env.write(f"VIDEO_FILE={output}\n")

          # -------------------------
          # FFmpeg
          # -------------------------

          cmd = [
              "ffmpeg",
              "-hide_banner",
              "-loglevel", "warning",

              "-user_agent",
              UA,

              "-referer",
              REFERER,

              "-i",
              stream,

              "-c",
              "copy",

              "-movflags",
              "+faststart",

              "-y",
              output,
          ]

          print("")
          print("Starting FFmpeg...")

          result = subprocess.run(cmd)

          if result.returncode != 0:
              print("ERROR: FFmpeg failed.")
              sys.exit(result.returncode)

          if not os.path.exists(output):
              print("ERROR: Output file not created.")
              sys.exit(1)

          size = os.path.getsize(output)

          print("")
          print("Download completed.")
          print("File:", output)
          print(
              "Size:",
              f"{size / 1024 / 1024:.2f} MB"
          )
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="ph-$(date -u +%Y%m%d-%H%M%S)"

          echo "Creating release: $TAG"

          gh release create "$TAG" \
            "$VIDEO_FILE" \
            --repo "${{ github.repository }}" \
            --title "$VIDEO_TITLE ($VIDEO_QUALITY)" \
            --notes "Downloaded automatically by GitHub Actions."

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${VIDEO_FILE}"

          echo ""
          echo "=========================================="
          echo "DOWNLOAD COMPLETED"
          echo "=========================================="
          echo "Title:   $VIDEO_TITLE"
          echo "Quality: $VIDEO_QUALITY"
          echo "File:    $VIDEO_FILE"
          echo ""
          echo "Direct link:"
          echo "$RELEASE_URL"
          echo "=========================================="

          echo "RELEASE_URL=$RELEASE_URL" >> "$GITHUB_ENV"