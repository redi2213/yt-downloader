name: Pornhub to GitHub Release

on:
  workflow_dispatch:
    inputs:
      link:
        description: "Pornhub video URL"
        required: true
        type: string

      quality:
        description: "Quality: best, 1080p, 720p, 480p, 240p"
        required: false
        default: "best"
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Install
      # ==========================================

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl python3

          echo "FFmpeg:"
          ffmpeg -version | head -1

          echo "Curl:"
          curl --version | head -1

      # ==========================================
      # Fetch Pornhub page
      # ==========================================

      - name: Fetch Pornhub page
        env:
          INPUT_URL: ${{ inputs.link }}
        run: |
          set -e

          UA="Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36"

          echo "Fetching:"
          echo "$INPUT_URL"
          echo

          curl \
            --location \
            --max-time 30 \
            --retry 2 \
            --retry-delay 2 \
            --compressed \
            --user-agent "$UA" \
            --referer "https://www.pornhub.com/" \
            --header "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
            --header "Accept-Language: en-US,en;q=0.9" \
            --header "Sec-Fetch-Dest: document" \
            --header "Sec-Fetch-Mode: navigate" \
            --header "Sec-Fetch-Site: same-origin" \
            --header "Sec-Fetch-User: ?1" \
            --dump-header /tmp/headers.txt \
            --output /tmp/pornhub.html \
            "$INPUT_URL"

          echo
          echo "===== RESPONSE ====="

          wc -c /tmp/pornhub.html

          echo
          echo "===== HEADERS ====="

          cat /tmp/headers.txt

          echo
          echo "===== TITLE ====="

          grep -oi '<title[^>]*>[^<]*' /tmp/pornhub.html | head -1 || true

          echo
          echo "===== URL CHECK ====="

          if grep -qi "master.m3u8" /tmp/pornhub.html; then
            echo "HLS master playlist found."
          else
            echo "WARNING: master.m3u8 not found."
          fi

      # ==========================================
      # Extract stream
      # ==========================================

      - name: Extract video stream
        env:
          QUALITY: ${{ inputs.quality }}
        run: |
          set -e

          python3 <<'PY'

          import os
          import re
          import html
          import sys
          from urllib.parse import unquote

          page_file = "/tmp/pornhub.html"

          with open(
              page_file,
              "r",
              encoding="utf-8",
              errors="ignore"
          ) as f:
              page = f.read()

          wanted = os.environ.get(
              "QUALITY",
              "best"
          ).lower().strip()

          if wanted.isdigit():
              wanted += "p"

          # ======================================
          # Title
          # ======================================

          title_match = re.search(
              r"<title[^>]*>(.*?)</title>",
              page,
              re.I | re.S
          )

          title = (
              html.unescape(
                  title_match.group(1)
              ).strip()
              if title_match
              else "Pornhub Video"
          )

          title = re.sub(
              r"\s+",
              " ",
              title
          )

          title = re.sub(
              r"\s*-\s*Pornhub\.com\s*$",
              "",
              title,
              flags=re.I
          )

          print("Title:")
          print(title)

          # ======================================
          # Decode escaped JSON
          # ======================================

          decoded = page

          for _ in range(2):

              decoded = decoded.replace(
                  "\\/",
                  "/"
              )

              decoded = decoded.replace(
                  "\\u002F",
                  "/"
              )

              decoded = decoded.replace(
                  "\\u002f",
                  "/"
              )

              decoded = decoded.replace(
                  "\\u0026",
                  "&"
              )

              decoded = html.unescape(
                  decoded
              )

          # ======================================
          # Extract master.m3u8 URLs
          # ======================================

          patterns = [

              r'"videoUrl"\s*:\s*"([^"]*master\.m3u8[^"]*)"',


              r'https?://[^"\s<>]+master\.m3u8[^"\s<>]*',


              r'https?:\\/\\/[^"\s<>]+master\.m3u8[^"\s<>]*',

          ]

          found = []

          for pattern in patterns:

              matches = re.findall(
                  pattern,
                  decoded,
                  re.I
              )

              for item in matches:

                  if isinstance(item, tuple):
                      item = item[0]

                  item = item.replace(
                      "\\/",
                      "/"
                  )

                  item = item.replace(
                      "\\u0026",
                      "&"
                  )

                  item = html.unescape(
                      item
                  )

                  item = unquote(
                      item
                  )

                  if (
                      "master.m3u8"
                      in item
                  ):
                      found.append(item)

          # Remove duplicates

          found = list(
              dict.fromkeys(found)
          )

          # ======================================
          # Detect qualities
          # ======================================

          qualities = {}

          for item in found:

              match = re.search(
                  r"/(\d{3,4})P[_/]",
                  item,
                  re.I
              )

              if not match:

                  match = re.search(
                      r"(\d{3,4})P",
                      item,
                      re.I
                  )

              if match:

                  quality = (
                      match.group(1)
                      + "p"
                  )

                  qualities[quality] = item

          # ======================================
          # Failure diagnostics
          # ======================================

          if not qualities:

              print("")
              print(
                  "ERROR: No HLS streams found."
              )

              print("")
              print("Diagnostics:")

              for keyword in [
                  "master.m3u8",
                  "videoUrl",
                  "hls",
                  "1080P",
                  "720P",
                  "480P",
                  "240P",
              ]:

                  print(
                      f"{keyword}:",
                      keyword.lower()
                      in decoded.lower()
                  )

              print("")
              print(
                  "Page size:",
                  len(page)
              )

              print("")
              print(
                  "This usually means Pornhub "
                  "redirected the Runner or "
                  "returned a different page."
              )

              sys.exit(1)

          # ======================================
          # Show qualities
          # ======================================

          print("")
          print(
              "Available qualities:"
          )

          ordered = sorted(
              qualities,
              key=lambda x: int(
                  x[:-1]
              ),
              reverse=True
          )

          for q in ordered:
              print(" ", q)

          # ======================================
          # Select quality
          # ======================================

          if wanted == "best":

              selected = ordered[0]

          else:

              if wanted not in qualities:

                  print("")
                  print(
                      "ERROR: Requested quality "
                      f"{wanted} is not available."
                  )

                  print(
                      "Available:",
                      ", ".join(ordered)
                  )

                  sys.exit(1)

              selected = wanted

          stream = qualities[selected]

          print("")
          print(
              "Selected quality:",
              selected
          )

          print("")
          print(
              "Stream URL:"
          )

          print(stream)

          # ======================================
          # Safe filename
          # ======================================

          filename = re.sub(
              r'[\\/:*?"<>|]',
              "_",
              title
          )

          filename = re.sub(
              r"\s+",
              " ",
              filename
          ).strip()

          if not filename:

              filename = "Pornhub Video"

          output = filename + ".mp4"

          # ======================================
          # Save GitHub environment
          # ======================================

          env_file = os.environ[
              "GITHUB_ENV"
          ]

          with open(
              env_file,
              "a",
              encoding="utf-8"
          ) as env:

              env.write(
                  "VIDEO_TITLE<<EOF\n"
              )

              env.write(
                  title + "\n"
              )

              env.write(
                  "EOF\n"
              )

              env.write(
                  f"VIDEO_QUALITY={selected}\n"
              )

              env.write(
                  "VIDEO_STREAM<<EOF\n"
              )

              env.write(
                  stream + "\n"
              )

              env.write(
                  "EOF\n"
              )

              env.write(
                  "VIDEO_FILE<<EOF\n"
              )

              env.write(
                  output + "\n"
              )

              env.write(
                  "EOF\n"
              )

          PY

      # ==========================================
      # Download with FFmpeg
      # ==========================================

      - name: Download with FFmpeg
        env:
          VIDEO_STREAM: ${{ env.VIDEO_STREAM }}
          VIDEO_FILE: ${{ env.VIDEO_FILE }}
        run: |
          set -e

          UA="Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36"

          echo "=========================================="
          echo "FFmpeg download"
          echo "=========================================="
          echo
          echo "Quality: $VIDEO_QUALITY"
          echo "File: $VIDEO_FILE"
          echo

          ffmpeg \
            -hide_banner \
            -stats \
            -user_agent "$UA" \
            -referer "https://www.pornhub.com/" \
            -i "$VIDEO_STREAM" \
            -c copy \
            -movflags +faststart \
            -y \
            "$VIDEO_FILE"

          echo
          echo "=========================================="
          echo "Download finished"
          echo "=========================================="

          ls -lh "$VIDEO_FILE"

          test -s "$VIDEO_FILE"

      # ==========================================
      # Create Release
      # ==========================================

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="ph-$(date -u +%Y%m%d-%H%M%S)"

          echo "Creating release..."
          echo "Tag: $TAG"
          echo

          gh release create \
            "$TAG" \
            "$VIDEO_FILE" \
            --repo "${{ github.repository }}" \
            --title "$VIDEO_TITLE ($VIDEO_QUALITY)" \
            --notes "Downloaded automatically by GitHub Actions."

          # ======================================
          # Direct Release Asset URL
          # ======================================

          ENCODED_FILE=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))' "$VIDEO_FILE")

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ENCODED_FILE}"

          echo
          echo "=========================================="
          echo "DOWNLOAD COMPLETED"
          echo "=========================================="
          echo
          echo "Title:"
          echo "$VIDEO_TITLE"
          echo
          echo "Quality:"
          echo "$VIDEO_QUALITY"
          echo
          echo "File:"
          echo "$VIDEO_FILE"
          echo
          echo "Direct link:"
          echo "$RELEASE_URL"
          echo
          echo "=========================================="

          echo "RELEASE_URL=$RELEASE_URL" >> "$GITHUB_ENV"