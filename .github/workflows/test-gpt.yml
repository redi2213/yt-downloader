name: Test gpt

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gpt:
    name: Test GPT workflow
    runs-on: ubuntu-24.04
    steps:
      - name: Report workflow test
        run: |
          echo "Test gpt workflow started successfully."
          echo "Repository: $GITHUB_REPOSITORY"
