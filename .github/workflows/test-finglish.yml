name: Test Finglish
run-name: Test Finglish

on:
  workflow_dispatch:
    inputs:
      titles:
        description: 'Persian titles separated by |'
        required: true
        default: 'سخت ترین قسمت بازی|سلام دنیا|بهترین ماشین های ایران'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Install candidates and inspect them
        run: |
          pip install parstalk
          pip show parstalk | head -n 3
          python3 -c "import parstalk; print('parstalk exports:', [n for n in dir(parstalk) if not n.startswith('_')])"
          git clone --depth 1 https://github.com/mmahdibarghi/persian-to-finglish /tmp/p2f || true
          echo "=== persian-to-finglish files ==="
          find /tmp/p2f -not -path '*/.git*' -type f | head -n 30
          echo "=== py file heads ==="
          for f in $(find /tmp/p2f -name '*.py' -not -path '*/.git*' | head -n 3); do echo "--- $f"; head -n 40 "$f"; done

      - name: Compare
        env:
          TITLES: ${{ github.event.inputs.titles }}
        run: |
          cat > cmp.py << 'PYEOF'
          import os, traceback

          M = {"ا":"a","آ":"a","ب":"b","پ":"p","ت":"t","ث":"s","ج":"j","چ":"ch","ح":"h","خ":"kh",
               "د":"d","ذ":"z","ر":"r","ز":"z","ژ":"zh","س":"s","ش":"sh","ص":"s","ض":"z","ط":"t",
               "ظ":"z","ع":"","غ":"gh","ف":"f","ق":"gh","ک":"k","گ":"g","ل":"l","م":"m","ن":"n",
               "ه":"h","و":"v","ی":"y","ئ":"","\u200c":""}
          def baseline(t):
              return "".join(M.get(c, c) for c in t)

          def parstalk(t):
              import parstalk as p
              fn = next((getattr(p, n) for n in dir(p)
                         if callable(getattr(p, n)) and "finglish" in n.lower()), None)
              if fn is None:
                  raise RuntimeError("no finglish function in parstalk")
              return fn(t)

          for title in os.environ["TITLES"].split("|"):
              title = title.strip()
              if not title:
                  continue
              print("\n>>", title)
              for name, fn in (("baseline", baseline), ("parstalk", parstalk)):
                  try:
                      print(f"  {name:9}: {fn(title)}")
                  except Exception as e:
                      print(f"  {name:9}: ERROR {e}")
          PYEOF
          python3 cmp.py
