name: Any Site Extrac
run-name: Media ${{ inputs.mode }} [${{ inputs.job_id }}]

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "direct = لینک مستقیم | release = آپلود به ریلیز"
        required: true
        default: "release"
        type: choice
        options: ["direct", "release"]
      urls:
        description: "لینک‌ها (هر خط یکی). اگر خالی باشد، urls.txt مخزن خوانده می‌شود"
        required: false
        type: string
      quality:
        description: "کیفیت هدف"
        required: true
        default: "720"
        type: choice
        options: ["144", "240", "360", "480", "720", "1080", "highest"]
      job_id:
        description: "Set by the app so it can find this exact run (leave empty when running by hand)"
        required: false
        default: ""
        type: string
      storage:
        description: 'Where to keep the file: github, arvan or both (set by the app)'
        required: false
        default: 'github'
        type: string
      arvan_bucket:
        description: 'Preferred Arvan bucket id (set by the app; empty = the main bucket)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
      tag: ${{ steps.collect.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect links
        id: collect
        env:
          URLS: ${{ inputs.urls }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path

          raw = os.environ.get("URLS", "").strip()
          if not raw and Path("urls.txt").is_file():
              raw = Path("urls.txt").read_text(encoding="utf-8-sig")

          lines = [l for l in raw.splitlines() if not l.lstrip().startswith("#")]
          urls = [u for u in " ".join(lines).split()
                  if u.lower().startswith(("http://", "https://"))]
          urls = list(dict.fromkeys(urls))
          if not urls:
              print("::error::No valid links found (must start with http:// or https://)")
              sys.exit(1)

          print(f"Found {len(urls)} link(s)")
          matrix = [{"idx": i, "url": u} for i, u in enumerate(urls, 1)]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
              f.write("tag=run-" + os.environ["GITHUB_RUN_ID"] + "\n")
          PY

      - name: Create the release
        if: ${{ inputs.mode == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.collect.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Media $GITHUB_RUN_ID" \
            --notes "Auto upload"

  process:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 340
    name: link ${{ matrix.idx }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install -U yt-dlp
          pip install --quiet curl_cffi || pip install --quiet --break-system-packages curl_cffi
          sudo apt-get update -qq && sudo apt-get install -y -qq aria2

      # اختیاری: اگر Secret به اسم COOKIES_TXT (فرمت Netscape) بسازی استفاده می‌شود
      - name: Prepare cookies (optional)
        env:
          COOKIES: ${{ secrets.COOKIES_TXT }}
        run: |
          if [ -n "$COOKIES" ]; then
            printf '%s\n' "$COOKIES" > cookies.txt
            echo "Cookies loaded"
          fi

      - name: Extract direct link (fallback chain)
        id: pick
        env:
          URL: ${{ matrix.url }}
          QUALITY: ${{ inputs.quality }}
          PROXY: ${{ secrets.PROXY }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          url = os.environ["URL"]
          q = os.environ["QUALITY"]
          proxy = os.environ.get("PROXY", "").strip()
          target = 0 if q == "highest" else int(q)
          cookie = ["--cookies", "cookies.txt"] if os.path.isfile("cookies.txt") else []

          base = ["yt-dlp", "--no-warnings", "--no-playlist"] + cookie

          def run(args, timeout=180):
              return subprocess.run(base + args, capture_output=True, text=True, timeout=timeout)

          def fail(msg):
              msg = (msg or "unknown error")[-300:].replace("\n", " ")
              print(f"::error::{msg}")
              sys.exit(1)

          # ---------- مرحله ۱: حالت عادی ----------
          def try_json(extra=()):
              r = run(["-J"] + list(extra) + [url])
              if r.returncode == 0:
                  try:
                      return json.loads(r.stdout), None
                  except Exception as e:
                      return None, f"JSON parse failed: {e}"
              err = (r.stderr or r.stdout).strip()
              return None, err.splitlines()[-1] if err else "unknown"

          data, err = try_json()
          mode = "normal"

          # ---------- مرحله ۲: impersonate ----------
          if data is None:
              print(f"[fallback] normal failed: {err}")
              print("[fallback] trying --impersonate chrome ...")
              data, err2 = try_json(["--impersonate", "chrome"])
              if data is not None:
                  mode = "impersonate"
              else:
                  print(f"[fallback] impersonate failed: {err2}")
                  err = err2

          # ---------- مرحله ۳: master build ----------
          if data is None:
              print("[fallback] trying master build ...")
              subprocess.run(
                  ["pip", "install", "--force-reinstall", "--quiet",
                   "https://github.com/yt-dlp/yt-dlp/archive/master.tar.gz"],
                  capture_output=True, text=True, timeout=300)
              data, err3 = try_json(["--impersonate", "chrome"])
              if data is not None:
                  mode = "master+impersonate"
              else:
                  print(f"[fallback] master failed: {err3}")
                  err = err3

          # ---------- مرحله ۴: پروکسی ----------
          if data is None and proxy:
              print("[fallback] trying with proxy ...")
              data, err4 = try_json(["--impersonate", "chrome", "--proxy", proxy])
              if data is not None:
                  mode = "proxy"
              else:
                  print(f"[fallback] proxy failed: {err4}")
                  err = err4

          if data is None:
              fail(f"all fallbacks failed: {err}")

          print(f"[ok] using mode = {mode}")

          # ---------- انتخاب فرمت ----------
          fmts = []
          for f in data.get("formats") or []:
              if f.get("vcodec") == "none":
                  continue
              fid = str(f.get("format_id", ""))
              h = f.get("height")
              if not h:
                  m = re.search(r"(\d+)p", fid)
                  h = int(m.group(1)) if m else None
              if h and fid:
                  fmts.append((fid, int(h), f.get("ext", ""), f.get("acodec")))

          ext = ""
          if fmts:
              t = target or max(f[1] for f in fmts)
              fmts.sort(key=lambda f: (abs(f[1] - t),
                                       0 if f[2] == "mp4" else 1, -f[1]))
              fid, h, ext, acodec = fmts[0]
              fsel = f"{fid}+ba/{fid}" if acodec == "none" else fid
              print(f"Chosen: {fid} ({h}p) -> {fsel}")
          else:
              fsel = "bv*+ba/b"
              print("No height info, using best available")

          # ---------- گرفتن لینک با همون mode ----------
          extra_dl = []
          if mode in ("impersonate", "master+impersonate"):
              extra_dl = ["--impersonate", "chrome"]
          elif mode == "proxy":
              extra_dl = ["--impersonate", "chrome", "--proxy", proxy]

          r = run(["-g", "-f", fsel] + extra_dl + [url])
          if r.returncode:
              fail(r.stderr or r.stdout)
          links = [l.strip() for l in r.stdout.splitlines()
                   if l.strip().startswith(("http://", "https://"))]
          if not links:
              fail("No media URL returned.")
          open("link.txt", "w").write("\n".join(links) + "\n")

          title = re.sub(r"[^A-Za-z0-9._-]+", "_", data.get("title") or "video")
          title = title.strip("._-")[:120] or "video"
          if len(links) > 1 or any(".m3u8" in l for l in links) or ext not in ("mp4", "webm", "mkv", "mov", "m4v"):
              ext = "mp4"
          name = f"{title}.{ext}"

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"fsel={fsel}\nname={name}\nmode={mode}\n")
          PY

      # ---------- حالت direct ----------
      - name: Save direct link
        if: ${{ inputs.mode == 'direct' }}
        run: |
          N=$(printf '%04d' "${{ matrix.idx }}")
          mv link.txt "link_$N.txt"
          echo "LINKFILE=link_$N.txt" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.mode == 'direct' }}
        with:
          name: link-${{ matrix.idx }}
          path: ${{ env.LINKFILE }}
          retention-days: 1

      # ---------- حالت release ----------
      - name: Download (aria2, fallback yt-dlp)
        if: ${{ inputs.mode == 'release' }}
        env:
          URL: ${{ matrix.url }}
          FSEL: ${{ steps.pick.outputs.fsel }}
          NAME: ${{ steps.pick.outputs.name }}
          MODE: ${{ steps.pick.outputs.mode }}
          PROXY: ${{ secrets.PROXY }}
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          mapfile -t LINKS < link.txt
          mkdir -p work

          COOKIE_ARGS=()
          if [ -s cookies.txt ]; then COOKIE_ARGS=(--cookies cookies.txt); fi

          MODE_ARGS=()
          if [ "$MODE" = "impersonate" ] || [ "$MODE" = "master+impersonate" ]; then
            MODE_ARGS=(--impersonate chrome)
          elif [ "$MODE" = "proxy" ] && [ -n "${PROXY:-}" ]; then
            MODE_ARGS=(--impersonate chrome --proxy "$PROXY")
          fi

          USE_YTDLP=0
          if printf '%s\n' "${LINKS[@]}" | grep -qi '\.m3u8'; then
            echo "HLS stream detected, using yt-dlp"
            USE_YTDLP=1
          else
            PARTS=()
            i=0
            for L in "${LINKS[@]}"; do
              i=$((i+1))
              if aria2c -x 16 -s 16 -k 1M \
                  --file-allocation=none \
                  --connect-timeout=20 \
                  --max-tries=5 --retry-wait=5 \
                  --user-agent="$UA" \
                  --referer="$URL" \
                  -d work -o "part$i" "$L"; then
                PARTS+=("work/part$i")
              else
                echo "aria2 failed, falling back to yt-dlp"
                USE_YTDLP=1
                break
              fi
            done
          fi

          if [ "$USE_YTDLP" = "1" ]; then
            rm -rf work && mkdir -p work
            yt-dlp --no-warnings --no-playlist "${COOKIE_ARGS[@]}" "${MODE_ARGS[@]}" \
              -f "$FSEL" \
              --merge-output-format mp4 \
              --concurrent-fragments 16 \
              --retries 5 --fragment-retries 5 \
              -o "work/$NAME" "$URL"
          elif [ "${#PARTS[@]}" -eq 1 ]; then
            mv "${PARTS[0]}" "work/$NAME"
          else
            ffmpeg -y -loglevel error -i "${PARTS[0]}" -i "${PARTS[1]}" -c copy "work/$NAME"
            rm -f "${PARTS[@]}"
          fi

          if [ ! -s "work/$NAME" ]; then
            echo "::error::Download failed or file is empty"
            exit 1
          fi
          ls -lh work

      - name: Get the publish scripts
        if: ${{ inputs.mode == 'release' }}
        uses: actions/checkout@v4
        with:
          path: _repo
          sparse-checkout: scripts
      - name: Install boto3 (Arvan Cloud)
        if: ${{ inputs.mode == 'release' && (inputs.storage == 'arvan' || inputs.storage == 'both') }}
        run: python3 -m pip install --quiet boto3 || python3 -m pip install --quiet --break-system-packages boto3
      - name: Upload (GitHub Release and/or Arvan Cloud)
        if: ${{ inputs.mode == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STORAGE: ${{ inputs.storage || 'github' }}
          ARVAN_BUCKET: ${{ inputs.arvan_bucket }}
          ALL_SECRETS: ${{ (inputs.storage == 'arvan' || inputs.storage == 'both') && toJSON(secrets) || '' }}
          TAG: ${{ needs.prepare.outputs.tag }}
          IDX: ${{ matrix.idx }}
          NAME: ${{ steps.pick.outputs.name }}
        run: |
          python3 _repo/scripts/storage_publish.py upload --file "work/$NAME" --tag "$TAG" --idx "$IDX" --meta-out "meta/meta-$IDX.json"

      - name: Keep the Arvan result for the final step
        if: ${{ !cancelled() && inputs.mode == 'release' && (inputs.storage == 'arvan' || inputs.storage == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: storage-meta-${{ matrix.idx }}
          path: meta/meta-${{ matrix.idx }}.json
          retention-days: 1
          if-no-files-found: ignore

  finalize:
    needs: [prepare, process]
    if: ${{ !cancelled() && inputs.mode == 'release' && (inputs.storage == 'arvan' || inputs.storage == 'both') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: arvan links
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: storage-meta-*
          merge-multiple: true
          path: metas

      - name: Write the Arvan links into the release
        env:
          GH_TOKEN: ${{ github.token }}
          STORAGE: ${{ inputs.storage }}
        run: |
          mkdir -p metas
          python3 scripts/storage_publish.py finalize --tag "${{ needs.prepare.outputs.tag }}" --meta-dir metas --notes "Auto upload"

  collect:
    needs: process
    if: ${{ !cancelled() && inputs.mode == 'direct' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: link-*
          merge-multiple: true

      - name: Merge links
        run: |
          ls link_*.txt 2>/dev/null | sort | xargs cat > links.txt || true
          {
            echo "**Links:** $(wc -l < links.txt)"
            echo '```'
            cat links.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: links
          path: links.txt
          retention-days: 1
