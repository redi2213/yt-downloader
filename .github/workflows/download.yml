
name: Download Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "YouTube or video URL"
        required: true
        type: string

      format_id:
        description: "Format ID (e.g. 397-1), quality (e.g. 480p), or bestvideo+bestaudio"
        required: true
        default: "bestvideo+bestaudio"
        type: string

      audio_only:
        description: "Download audio as MP3"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: download-video-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  download:
    name: Download and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      VIDEO_URL: ${{ inputs.video_url }}
      FORMAT_ID: ${{ inputs.format_id }}
      AUDIO_ONLY: ${{ inputs.audio_only }}

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          python3 -m pip install --user --break-system-packages -U yt-dlp

      - name: Add yt-dlp to PATH
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_ENV"

      - name: Verify dependencies
        run: |
          ffmpeg -version
          yt-dlp --version

      - name: Prepare download directory
        run: |
          mkdir -p downloads
          mkdir -p release

      - name: Download video
        if: env.AUDIO_ONLY != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          FORMAT="$(printf '%s' "$FORMAT_ID" | xargs)"

          if [[ "$FORMAT" =~ ^[0-9]+p$ ]]; then
            HEIGHT="${FORMAT%p}"
            FORMAT="bestvideo[height<=${HEIGHT}]+bestaudio/best[height<=${HEIGHT}]/best"
          fi

          echo "Selected format: $FORMAT"

          yt-dlp \
            --no-playlist \
            --no-warnings \
            --retries 10 \
            --fragment-retries 10 \
            --retry-sleep 2 \
            --merge-output-format mp4 \
            --format "$FORMAT" \
            --output "downloads/%(title).180B.%(ext)s" \
            --print after_move:filepath \
            "$VIDEO_URL" | tee downloads/download-path.txt

      - name: Download audio as MP3
        if: env.AUDIO_ONLY == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          yt-dlp \
            --no-playlist \
            --no-warnings \
            --retries 10 \
            --fragment-retries 10 \
            --retry-sleep 2 \
            --extract-audio \
            --audio-format mp3 \
            --audio-quality 0 \
            --output "downloads/%(title).180B.%(ext)s" \
            --print after_move:filepath \
            "$VIDEO_URL" | tee downloads/download-path.txt

      - name: Validate and prepare output
        id: output
        shell: bash
        run: |
          set -Eeuo pipefail

          SRC="$(tail -n 1 downloads/download-path.txt)"

          if [[ ! -f "$SRC" ]]; then
            echo "::error::Downloaded file not found: $SRC"
            find downloads -maxdepth 2 -type f -print
            exit 1
          fi

          EXT="${SRC##*.}"
          BASENAME="$(basename "$SRC")"

          # Remove problematic filename characters
          SAFE_NAME="$(printf '%s' "$BASENAME" | \
            sed 's/[<>:"\/\\|?*]/_/g' | \
            sed 's/[[:cntrl:]]//g' | \
            sed 's/[[:space:]]\+/ /g' | \
            sed 's/^ *//; s/ *$//')"

          if [[ -z "$SAFE_NAME" ]]; then
            SAFE_NAME="download.${EXT}"
          fi

          DEST="release/$SAFE_NAME"

          cp -- "$SRC" "$DEST"

          echo "file=$DEST" >> "$GITHUB_OUTPUT"
          echo "name=$SAFE_NAME" >> "$GITHUB_OUTPUT"

          echo "Output file: $DEST"
          ls -lh "$DEST"

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-file
          path: ${{ steps.output.outputs.file }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: download-${{ github.run_id }}
          name: Download ${{ github.run_number }}
          body: |
            Download completed successfully.

            Source URL: ${{ inputs.video_url }}
            Requested format: ${{ inputs.format_id }}
            Audio only: ${{ inputs.audio_only }}

            Downloaded automatically using GitHub Actions.
          files: ${{ steps.output.outputs.file }}
          fail_on_unmatched_files: true
          make_latest: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show result
        if: success()
        run: |
          echo "Download completed successfully."
          echo "Artifact: downloaded-file"
          echo "Release tag: download-${{ github.run_id }}"

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Download workflow failed."
          echo "Check the failed step above for the actual error."
          find downloads release -maxdepth 2 -type f -print 2>/dev/null || true
