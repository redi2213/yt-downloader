name: Fast YouTube Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube URL'
        required: true
      format_id:
        description: 'Exact format id (no fallback)'
        required: true
        default: '136'
      audio_only:
        description: 'true for MP3'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install ffmpeg (static binary, super fast)
        run: |
          curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          sudo mv ffmpeg-*-static/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-*-static/ffprobe /usr/local/bin/

      - name: Install Node.js (fix n-challenge)
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs

      - name: Install yt-dlp (binary)
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp \
            -o /usr/local/bin/yt-dlp
          sudo chmod +x /usr/local/bin/yt-dlp

      - name: Write cookies
        run: echo "${{ secrets.YTDLP_COOKIES }}" > cookies.txt

      - name: Download video
        id: dl
        run: |
          OUT="%(title).120s.%(ext)s"
          ARIA="aria2c:-x16 -s16 -k4M --file-allocation=none"

          if [ "${{ github.event.inputs.audio_only }}" = "true" ]; then
            yt-dlp --cookies cookies.txt \
              -f "bestaudio" \
              --downloader aria2c --downloader-args "$ARIA" \
              -x --audio-format mp3 \
              -o "$OUT" \
              --print filename.txt \
              "${{ github.event.inputs.video_url }}"
            QUALITY="audio"
          else
            yt-dlp --cookies cookies.txt \
              -f "${{ github.event.inputs.format_id }}" \
              --downloader aria2c --downloader-args "$ARIA" \
              -o "$OUT" \
              --print filename.txt \
              "${{ github.event.inputs.video_url }}"

            QUALITY="${{ github.event.inputs.format_id }}"
          fi

          FILE=$(cat filename.txt)
          BASE="${FILE%.*}"
          EXT="${FILE##*.}"
          FINAL="${BASE}_${QUALITY}.${EXT}"

          mv "$FILE" "$FINAL"
          echo "filename=$FINAL" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: ${{ steps.dl.outputs.filename }}
          retention-days: 1

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: run-${{ github.run_id }}
          files: ${{ steps.dl.outputs.filename }}
          prerelease: true
