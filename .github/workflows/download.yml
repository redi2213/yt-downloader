name: Download Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube URL'
        required: true
      format_id:
        description: 'Format id (e.g. 337) or bestaudio for audio-only'
        required: true
        default: 'bestvideo+bestaudio'
      audio_only:
        description: 'true for audio-only MP3'
        required: false
        default: 'false'

env:
  YTDLP_VERSION: '2026.08.19'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      # --- ffmpeg (cached as .deb files, installed via dpkg = fast) ---
      # aria2c دیگه لازم نیست چون گوگل‌ویدیو با دانلودر خارجی 403 می‌ده
      - name: Cache apt debs
        id: cache-apt
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-debs-ffmpeg-v3

      - name: Download apt packages (cache miss only)
        if: steps.cache-apt.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --download-only ffmpeg

      - name: Install ffmpeg from local debs
        run: sudo dpkg -i /var/cache/apt/archives/*.deb || sudo apt-get install -f -y

      # --- yt-dlp (pinned version, cached — no network call when cached) ---
      - name: Cache yt-dlp
        id: cache-ytdlp
        uses: actions/cache@v4
        with:
          path: /opt/ytdlp
          key: ytdlp-${{ env.YTDLP_VERSION }}-v2

      - name: Install yt-dlp (cache miss only)
        if: steps.cache-ytdlp.outputs.cache-hit != 'true'
        run: pip install --target /opt/ytdlp yt-dlp==${{ env.YTDLP_VERSION }}

      - name: Add yt-dlp to PATH
        run: |
          echo "PYTHONPATH=/opt/ytdlp" >> $GITHUB_ENV
          mkdir -p /opt/ytdlp-bin
          printf '#!/usr/bin/env bash\nPYTHONPATH=/opt/ytdlp python3 -m yt_dlp "$@"\n' > /opt/ytdlp-bin/yt-dlp
          chmod +x /opt/ytdlp-bin/yt-dlp
          echo "/opt/ytdlp-bin" >> $GITHUB_PATH

      # --- Deno (used by yt-dlp's n-challenge solver) ---
      - name: Install Deno
        uses: denoland/setup-deno@v2

      # --- PO Token provider ---
      - name: Start PO Token provider server
        run: |
          docker run --name bgutil-provider -d -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider
          for i in {1..15}; do
            if curl -sf http://127.0.0.1:4416/ping > /dev/null; then
              echo "PO Token server is up"
              break
            fi
            sleep 1
          done

      - name: Install PO Token plugin (cache miss only, same cache as yt-dlp)
        if: steps.cache-ytdlp.outputs.cache-hit != 'true'
        run: pip install --target /opt/ytdlp -U bgutil-ytdlp-pot-provider

      # --- Cookies ---
      - name: Write cookies file
        run: echo "${{ secrets.YTDLP_COOKIES }}" > cookies.txt

      # --- Download (runs directly on the runner) ---
      - name: Download
        id: dl
        shell: bash
        run: |
          set -euo pipefail
          OUTTMPL="%(title).120s.%(ext)s"
          # aria2c حذف شد: گوگل‌ویدیو با دانلودر خارجی چون هدر/context یوتیوب رو نداره 403 می‌ده.
          # از دانلودر داخلی yt-dlp با چندنخی (-N) استفاده می‌کنیم که context درست رو حفظ می‌کنه.
          # -N از 8 به 4 کاهش یافت و retry-sleep افزایشی اضافه شد: روی فرمت‌های سنگین (4K/HFR)
          # تعداد اتصالات موازی بالا باعث می‌شد سرور گوگل‌ویدیو وسط دانلود (حوالی \~18%) با 403 قطع کنه.
          # --http-chunk-size 10M: طبق مستندات رسمی yt-dlp، یوتیوب هر درخواستی با
          # chunk size بزرگ‌تر از 10MB رو throttle/قطع می‌کنه. همین باعث می‌شد فرمت‌های
          # سنگین (4K/HFR) همیشه حوالی درصد مشخصی با 403 قطع بشن، چون یوتیوب داشت
          # http chunk بزرگ رو رد می‌کرد. با محدود کردنش به زیر 10MB، دیگه به اون حد نمی‌رسه.
          COMMON_SPEED_FLAGS=(-N 4 --http-chunk-size 10M --retries 20 --fragment-retries 20 --socket-timeout 30 --retry-sleep linear=1:5:30)

          # === تغییر اصلی (آگوست ۲۰۲۶) ===
          # کلاینت‌های tv / tv_downgraded با کوکی لاگین‌شده ارور
          # "The page needs to be reloaded" می‌دن (issue #17389).
          # web_safari + web_embedded + web پایدارترن و با کوکی + PO Token کار می‌کنن.
          # ios هم حذف شد چون با کوکی پشتیبانی نمی‌شه.
          CLIENT_ARGS="youtube:player_client=web_safari,web_embedded,web;formats=missing_pot"

          if [ "${{ github.event.inputs.audio_only }}" = "true" ]; then
            yt-dlp --cookies cookies.txt --remote-components ejs:github \
              --extractor-args "$CLIENT_ARGS" \
              --restrict-filenames "${COMMON_SPEED_FLAGS[@]}" \
              -f "bestaudio[acodec^=mp4a]/bestaudio" \
              -x --audio-format mp3 \
              -o "$OUTTMPL" \
              --print-to-file after_move:filepath filename.txt \
              "${{ github.event.inputs.video_url }}"
            QUALITY="audio"
          else
            yt-dlp --cookies cookies.txt --remote-components ejs:github \
              --extractor-args "$CLIENT_ARGS" \
              --restrict-filenames "${COMMON_SPEED_FLAGS[@]}" \
              -f "\( {{ github.event.inputs.format_id }}+bestaudio[acodec^=mp4a]/ \){{ github.event.inputs.format_id }}+bestaudio" \
              --merge-output-format mkv \
              -o "$OUTTMPL" \
              --print-to-file after_move:filepath filename.txt \
              --print-to-file after_move:"%(height)s|%(dynamic_range)s|%(fps)s" metadata.txt \
              "${{ github.event.inputs.video_url }}"

            METADATA=$(cat metadata.txt)
            IFS='|' read -r HEIGHT HDR FPS <<< "$METADATA"

            if [ "$HEIGHT" = "NA" ] || [ -z "$HEIGHT" ]; then
              QUALITY="unknown"
            else
              FPS_SUFFIX=""
              if [ "$FPS" != "NA" ] && [ -n "$FPS" ]; then
                FPS_SUFFIX="_${FPS%.*}fps"
              fi
              HDR_SUFFIX=""
              if [ "$HDR" != "SDR" ] && [ "$HDR" != "NA" ] && [ -n "$HDR" ]; then
                HDR_SUFFIX="_HDR"
              fi
              QUALITY="\( {HEIGHT}p \){FPS_SUFFIX}${HDR_SUFFIX}"
            fi
          fi

          if [ ! -s filename.txt ]; then
            echo "::error::yt-dlp did not produce an output file (filename.txt is empty/missing)."
            exit 1
          fi
          FILENAME=$(cat filename.txt)
          BASENAME="${FILENAME%.*}"
          EXT="${FILENAME##*.}"
          FINAL_NAME="\( {BASENAME}_ \){QUALITY}.${EXT}"
          mv "$FILENAME" "$FINAL_NAME"
          echo "filename=$FINAL_NAME" >> $GITHUB_OUTPUT

      - name: Clean up cookies
        if: always()
        run: rm -f cookies.txt filename.txt metadata.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: ${{ steps.dl.outputs.filename }}
          retention-days: 1

      - name: Create Release with direct link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: run-${{ github.run_id }}
          files: ${{ steps.dl.outputs.filename }}
          prerelease: true
          name: "Download run-${{ github.run_id }}"