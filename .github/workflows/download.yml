name: Fast YouTube Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube URL'
        required: true
      format_id:
        description: 'Format id or bestaudio'
        required: true
        default: 'bestvideo+bestaudio'
      audio_only:
        description: 'true for MP3'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install ffmpeg + aria2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg aria2

      - name: Install yt-dlp (binary)
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp \
            -o /usr/local/bin/yt-dlp
          sudo chmod +x /usr/local/bin/yt-dlp

      - name: Write cookies
        run: echo "${{ secrets.YTDLP_COOKIES }}" > cookies.txt

      - name: Download video
        id: dl
        run: |
          OUT="%(title).120s.%(ext)s"
          ARIA="aria2c:-x32 -s32 -k4M --file-allocation=none"

          if [ "${{ github.event.inputs.audio_only }}" = "true" ]; then
            yt-dlp --cookies cookies.txt \
              -f "bestaudio[acodec^=mp4a]/bestaudio" \
              --downloader aria2c --downloader-args "$ARIA" \
              -x --audio-format mp3 \
              -o "$OUT" \
              --print filename.txt \
              "${{ github.event.inputs.video_url }}"
            QUALITY="audio"
          else
            META=$(yt-dlp --cookies cookies.txt \
              -f "${{ github.event.inputs.format_id }}+bestaudio/best" \
              --downloader aria2c --downloader-args "$ARIA" \
              --print "%(height)s|%(dynamic_range)s|%(fps)s" \
              -o "$OUT" \
              --print filename.txt \
              "${{ github.event.inputs.video_url }}")

            HEIGHT=$(echo "$META" | cut -d'|' -f1)
            HDR=$(echo "$META" | cut -d'|' -f2)
            FPS=$(echo "$META" | cut -d'|' -f3)

            FPS_SUFFIX=""
            [ "$FPS" != "NA" ] && FPS_SUFFIX="_${FPS%.*}fps"

            HDR_SUFFIX=""
            [ "$HDR" != "SDR" ] && [ "$HDR" != "NA" ] && HDR_SUFFIX="_HDR"

            QUALITY="${HEIGHT}p${FPS_SUFFIX}${HDR_SUFFIX}"
          fi

          FILE=$(cat filename.txt)
          BASE="${FILE%.*}"
          EXT="${FILE##*.}"
          FINAL="${BASE}_${QUALITY}.${EXT}"

          mv "$FILE" "$FINAL"
          echo "filename=$FINAL" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: ${{ steps.dl.outputs.filename }}
          retention-days: 1

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: run-${{ github.run_id }}
          files: ${{ steps.dl.outputs.filename }}
          prerelease: true
