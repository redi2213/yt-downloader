name: Test Instagram Downloader

on:
  # این گزینه باعث می‌شود بتوانید دکمه Run را دستی در گیت‌هاب بزنید
  workflow_dispatch:
    inputs:
      instagram_url:
        description: 'لینک پست یا ریلز اینستاگرام'
        required: true
        default: 'https://www.instagram.com/reel/C8...'
      cookies_content:
        description: 'محتوای فایل کوکی (اختیاری - اگر پیج خصوصی یا استوری است)'
        required: false
        default: ''

jobs:
  download-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install ffmpeg (برای ادغام ویدیو و صدا)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install yt-dlp
      run: |
        python -m pip install --upgrade pip
        pip install yt-dlp

    - name: Prepare Cookies (اگر داده شده باشد)
      if: ${{ github.event.inputs.cookies_content != '' }}
      run: |
        echo "${{ github.event.inputs.cookies_content }}" > cookies.txt

    - name: Download from Instagram
      env:
        URL: ${{ github.event.inputs.instagram_url }}
      run: |
        mkdir -p downloads
        if [ -f cookies.txt ]; then
          echo "Using cookies for download..."
          yt-dlp --cookies cookies.txt -f "bestvideo+bestaudio/best" --merge-output-format mp4 -o "downloads/%(uploader)s_%(title)s_%(id)s.%(ext)s" "$URL"
        else
          echo "Downloading without cookies..."
          yt-dlp -f "bestvideo+bestaudio/best" --merge-output-format mp4 -o "downloads/%(uploader)s_%(title)s_%(id)s.%(ext)s" "$URL"
        fi

    - name: Upload Downloaded File
      uses: actions/upload-artifact@v4
      with:
        name: instagram-downloaded-file
        path: downloads/
        retention-days: 1