name: Telegram to GitHub Release

on:
  workflow_dispatch:
    inputs:
      telegram_url:
        description: "Telegram public message URL"
        required: true
        type: string

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Install tdl
        run: |
          curl -sSL https://docs.iyear.me/tdl/install.sh | sudo bash
          tdl version

      - name: Restore Telegram session
        env:
          TDL_SESSION: ${{ secrets.TDL_SESSION }}
        run: |
          mkdir -p "$HOME/tdl-data"
          echo "$TDL_SESSION" | base64 -d > "$HOME/telegram-session.tdl"

          tdl recover \
            -f "$HOME/telegram-session.tdl" \
            -n quickstart \
            --storage "type=bolt,path=$HOME/tdl-data"

      - name: Download Telegram file
        env:
          TELEGRAM_URL: ${{ inputs.telegram_url }}
        run: |
          mkdir -p "$HOME/tg-download"
          cd "$HOME/tg-download"

          tdl dl \
            -n quickstart \
            --storage "type=bolt,path=$HOME/tdl-data" \
            -u "$TELEGRAM_URL"

          echo "Downloaded files:"
          find . -type f -printf '%p\n'

      - name: Find downloaded file
        id: find_file
        run: |
          RAW_FILE=$(find "$HOME/tg-download" -type f | head -n 1)

          if [ -z "$RAW_FILE" ]; then
            echo "No downloaded file found."
            exit 1
          fi

          echo "Found: $RAW_FILE"

          DIR=$(dirname "$RAW_FILE")
          BASENAME=$(basename "$RAW_FILE")

          # tdl names files like "2758336301_170_asbab.zahmat-E12-360p.mp4"
          # (telegram numeric message/file id prefix). Strip a leading
          # "<digits>_<digits>_" or "<digits>_" prefix, keep the rest as-is.
          CLEAN_NAME=$(echo "$BASENAME" | sed -E 's/^[0-9]+(_[0-9]+)?_//')

          if [ -z "$CLEAN_NAME" ]; then
            CLEAN_NAME="$BASENAME"
          fi

          CLEAN_PATH="$DIR/$CLEAN_NAME"
          mv "$RAW_FILE" "$CLEAN_PATH"

          echo "Renamed to: $CLEAN_PATH"
          echo "FILE=$CLEAN_PATH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.find_file.outputs.FILE }}
          TELEGRAM_URL: ${{ inputs.telegram_url }}
        run: |
          TAG="run-${{ github.run_id }}"

          gh release create "$TAG" "$FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Telegram Download $(date '+%Y-%m-%d %H:%M:%S')" \
            --notes "Downloaded from Telegram message: $TELEGRAM_URL"

          echo "======================================"
          echo "Release created:"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          echo "======================================"

      - name: Show direct asset URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="run-${{ github.run_id }}"

          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY"
