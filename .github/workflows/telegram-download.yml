name: Telegram to GitHub Release
run-name: ${{ inputs.run_title || inputs.telegram_url }} [${{ inputs.job_id }}]${{ inputs.rerun && format(' ~{0}', inputs.rerun) || '' }}

on:
  workflow_dispatch:
    inputs:
      telegram_url:
        description: "Telegram public message URL"
        required: true
        type: string
      job_id:
        description: 'Set by the app so it can find this exact run (leave empty when running by hand)'
        required: false
        default: ''
        type: string
      rerun:
        description: 'Set by the app: the other inputs packed into the run name so "Run again" can repeat this run (leave empty when running by hand)'
        required: false
        default: ''
        type: string
      run_title:
        description: 'Short name for this run, set by the app (leave empty when running by hand)'
        required: false
        default: ''
        type: string
      storage:
        description: 'Where to keep the file: github, arvan or both (set by the app)'
        required: false
        default: 'github'
        type: string
      arvan_bucket:
        description: 'Preferred Arvan bucket id (set by the app; empty = the main bucket)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  download-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Install tdl
        run: |
          curl -sSL https://docs.iyear.me/tdl/install.sh | sudo bash
          tdl version

      - name: Restore Telegram session
        env:
          TDL_SESSION: ${{ secrets.TDL_SESSION }}
        run: |
          mkdir -p "$HOME/tdl-data"
          echo "$TDL_SESSION" | base64 -d > "$HOME/telegram-session.tdl"

          tdl recover \
            -f "$HOME/telegram-session.tdl" \
            -n quickstart \
            --storage "type=bolt,path=$HOME/tdl-data"

      - name: Download Telegram file
        env:
          TELEGRAM_URL: ${{ inputs.telegram_url }}
        run: |
          mkdir -p "$HOME/tg-download"
          cd "$HOME/tg-download"

          tdl dl \
            -n quickstart \
            --storage "type=bolt,path=$HOME/tdl-data" \
            -u "$TELEGRAM_URL"

          echo "Downloaded files:"
          find . -type f -printf '%p\n'

      - name: Find downloaded file
        id: find_file
        run: |
          RAW_FILE=$(find "$HOME/tg-download" -type f | head -n 1)

          if [ -z "$RAW_FILE" ]; then
            echo "No downloaded file found."
            exit 1
          fi

          echo "Found: $RAW_FILE"

          DIR=$(dirname "$RAW_FILE")
          BASENAME=$(basename "$RAW_FILE")

          # tdl names files like "2758336301_170_asbab.zahmat-E12-360p.mp4"
          # (telegram numeric message/file id prefix). Strip a leading
          # "<digits>_<digits>_" or "<digits>_" prefix, keep the rest as-is.
          CLEAN_NAME=$(echo "$BASENAME" | sed -E 's/^[0-9]+(_[0-9]+)?_//')

          if [ -z "$CLEAN_NAME" ]; then
            CLEAN_NAME="$BASENAME"
          fi

          CLEAN_PATH="$DIR/$CLEAN_NAME"
          mv "$RAW_FILE" "$CLEAN_PATH"

          echo "Renamed to: $CLEAN_PATH"
          echo "FILE=$CLEAN_PATH" >> "$GITHUB_OUTPUT"

      - name: Get the publish scripts
        uses: actions/checkout@v4
        with:
          path: _repo
          sparse-checkout: scripts
      - name: Install boto3 (Arvan Cloud)
        if: ${{ (inputs.storage == 'arvan' || inputs.storage == 'both') }}
        run: python3 -m pip install --quiet boto3 || python3 -m pip install --quiet --break-system-packages boto3
      - name: Publish (GitHub Release and/or Arvan Cloud)
        env:
          GH_TOKEN: ${{ github.token }}
          STORAGE: ${{ inputs.storage || 'github' }}
          ARVAN_BUCKET: ${{ inputs.arvan_bucket }}
          ALL_SECRETS: ${{ (inputs.storage == 'arvan' || inputs.storage == 'both') && toJSON(secrets) || '' }}
          FILE: ${{ steps.find_file.outputs.FILE }}
          TELEGRAM_URL: ${{ inputs.telegram_url }}
        run: |
          python3 _repo/scripts/storage_publish.py publish --file "$FILE" --tag "run-${{ github.run_id }}" --title "Telegram Download $(date '+%Y-%m-%d %H:%M:%S')" --notes "Downloaded from Telegram message: $TELEGRAM_URL"

      - name: Show direct asset URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="run-${{ github.run_id }}"

          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY"

      - name: Notify (ntfy)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          TOOL_NAME: Telegram
          ONLY_FAILURE: 'false'
          RUN_TITLE: ${{ inputs.run_title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          if [ "$JOB_STATUS" = "success" ] && [ "$ONLY_FAILURE" = "true" ]; then
            echo "Success and this tool only reports failures: no notification."
            exit 0
          fi
          # The topic is set once in the app (Settings) and kept in ntfy.json on the config branch.
          CFG=$(curl -fsS -m 20 -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ntfy.json?ref=config" 2>/dev/null || true)
          if [ -z "$CFG" ]; then
            echo "No ntfy.json on the config branch: no notification."
            exit 0
          fi
          RESULT=$(CFG="$CFG" python3 - <<'PY'
          import json, os, re
          try:
              d = json.loads(os.environ["CFG"])
          except Exception:
              d = {}
          topic = str(d.get("topic", "")).strip()
          server = str(d.get("server") or "https://ntfy.sh").strip().rstrip("/")
          if re.fullmatch(r"[A-Za-z0-9_-]{1,64}", topic) and re.fullmatch(r"https://[A-Za-z0-9.-]+(:[0-9]+)?", server):
              print(topic + " " + server)
          PY
          )
          if [ -z "$RESULT" ]; then
            echo "ntfy topic is not set: no notification."
            exit 0
          fi
          TOPIC=${RESULT%% *}
          SERVER=${RESULT#* }
          case "$JOB_STATUS" in
            success)   WORD="OK";        TAGS="white_check_mark"; PRIO="default" ;;
            cancelled) WORD="Cancelled"; TAGS="no_entry_sign";    PRIO="default" ;;
            *)         WORD="FAILED";    TAGS="x";                PRIO="high" ;;
          esac
          BODY="$TOOL_NAME: $WORD"
          if [ -n "${RUN_TITLE:-}" ]; then BODY="$BODY"$'\n'"$RUN_TITLE"; fi
          BODY="$BODY"$'\n'"$RUN_URL"
          if curl -fsS -m 20 -X POST "$SERVER/$TOPIC" \
              -H "Title: YT Bridge - $TOOL_NAME - $WORD" -H "Tags: $TAGS" -H "Priority: $PRIO" \
              -H "Click: $RUN_URL" --data-binary "$BODY" >/dev/null; then
            echo "Notification sent."
          else
            echo "ntfy could not be reached."
          fi
