name: Cleanup old releases

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete video releases older than 7 days (skip app releases)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          repo="${{ github.repository }}"
          cutoff=$(date -d '7 days ago' +%s)

          gh release list \
            --repo "$repo" \
            --limit 200 \
            --json tagName,createdAt \
            --jq '.[] | [.tagName, .createdAt] | @tsv' |
          while IFS=$'\t' read -r tag created; do

            # Skip non-video releases
            if [[ "$tag" != run-* ]]; then
              echo "Skipping non-video release: $tag"
              continue
            fi

            created_ts=$(date -d "$created" +%s)

            # Delete releases older than 7 days
            if [ "$created_ts" -lt "$cutoff" ]; then
              echo "Deleting old release: $tag"

              gh release delete \
                "$tag" \
                --repo "$repo" \
                --yes \
                --cleanup-tag || true
            else
              echo "Keeping recent release: $tag"
            fi

          done