name: Cleanup old releases

# Deletes (1) releases whose file is gone and (2) video releases older than 7 days.
# APK builds and project backups are kept. Rules: scripts/cleanup_releases.py

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = only list what would be deleted'
        required: false
        default: 'false'
        type: string

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Delete empty and old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 scripts/cleanup_releases.py
