name: Download Anything

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Any link yt-dlp supports'
        required: true
      mode:
        description: 'direct_link or upload_release'
        required: true
        default: 'upload_release'
        type: choice
        options:
          - direct_link
          - upload_release
      format_id:
        description: '(upload_release only) format id, or leave default for best'
        required: false
        default: 'bv*+ba/best'
      audio_only:
        description: '(upload_release only) true for audio-only MP3'
        required: false
        default: 'false'

env:
  YTDLP_VERSION: '2026.07.04'

permissions:
  contents: write

jobs:
  resolve:
    if: github.event.inputs.mode == 'direct_link'
    runs-on: ubuntu-latest
    steps:
      - name: Install yt-dlp + curl_cffi
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "yt-dlp[default,curl-cffi]==${{ env.YTDLP_VERSION }}"

      - name: Write cookies file
        run: echo "${{ secrets.YTDLP_COOKIES }}" > cookies.txt

      - name: Resolve direct link(s)
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          yt-dlp --cookies cookies.txt \
            --impersonate chrome \
            -f "bv*+ba/best" -g \
            "${{ github.event.inputs.url }}" | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Clean up cookies
        if: always()
        run: rm -f cookies.txt

  upload:
    if: github.event.inputs.mode == 'upload_release'
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg + aria2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg aria2

      - name: Install yt-dlp + curl_cffi
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "yt-dlp[default,curl-cffi]==${{ env.YTDLP_VERSION }}"

      - name: Write cookies file
        run: echo "${{ secrets.YTDLP_COOKIES }}" > cookies.txt

      - name: Download
        id: dl
        shell: bash
        run: |
          set -euo pipefail
          OUTTMPL="%(title).120s.%(ext)s"
          COMMON_SPEED_FLAGS=(--downloader aria2c --downloader-args "aria2c:-x 16 -s 16 -k 4M --file-allocation=none" -N 8 --retries 10 --fragment-retries 10 --socket-timeout 30)

          if [ "${{ github.event.inputs.audio_only }}" = "true" ]; then
            yt-dlp --cookies cookies.txt \
              --impersonate chrome \
              --restrict-filenames "${COMMON_SPEED_FLAGS[@]}" \
              -f "bestaudio/best" \
              -x --audio-format mp3 \
              -o "$OUTTMPL" \
              --print-to-file after_move:filepath filename.txt \
              "${{ github.event.inputs.url }}"
          else
            yt-dlp --cookies cookies.txt \
              --impersonate chrome \
              --restrict-filenames "${COMMON_SPEED_FLAGS[@]}" \
              -f "${{ github.event.inputs.format_id }}" \
              --merge-output-format mkv \
              -o "$OUTTMPL" \
              --print-to-file after_move:filepath filename.txt \
              "${{ github.event.inputs.url }}"
          fi

          if [ ! -s filename.txt ]; then
            echo "::error::yt-dlp did not produce an output file (filename.txt is empty/missing)."
            exit 1
          fi
          FILENAME=$(cat filename.txt)
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

      - name: Clean up cookies
        if: always()
        run: rm -f cookies.txt filename.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-file
          path: ${{ steps.dl.outputs.filename }}
          retention-days: 1

      - name: Create Release with direct link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: run-${{ github.run_id }}
          files: ${{ steps.dl.outputs.filename }}
          prerelease: true
          name: "Download run-${{ github.run_id }}"