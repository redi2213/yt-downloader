name: Download Anything

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'لینک ویدیو'
        required: true
        type: string

      mode:
        description: 'نوع خروجی'
        required: true
        default: 'direct_link'
        type: choice
        options:
          - direct_link
          - upload_release

      quality:
        description: 'حداکثر کیفیت'
        required: false
        default: '720'
        type: string

      audio_only:
        description: 'فقط صوت'
        required: false
        default: false
        type: boolean

env:
  YTDLP_VERSION: '2026.08.19'

permissions:
  contents: write

jobs:

  resolve:
    if: inputs.mode == 'direct_link'
    runs-on: ubuntu-latest

    steps:

      - name: Install yt-dlp
        run: |
          python -m pip install -U yt-dlp==${{ env.YTDLP_VERSION }}
          python -m pip install "curl_cffi>=0.10"

      - name: Prepare PornHub cookies
        if: contains(inputs.url, 'pornhub.com')
        env:
          PH_COOKIES: ${{ secrets.PH_COOKIES }}
        run: |
          set -e

          if [ -z "$PH_COOKIES" ]; then
            echo "PH_COOKIES secret is empty."
            exit 1
          fi

          printf '%s\n' "$PH_COOKIES" > cookies.txt
          chmod 600 cookies.txt

          echo "PornHub cookies loaded."

      - name: Inspect PornHub response
        if: contains(inputs.url, 'pornhub.com')
        env:
          INPUT_URL: ${{ inputs.url }}
        run: |
          set -e

          echo "======================================"
          echo "PornHub HTTP test"
          echo "======================================"

          curl \
            -L \
            -sS \
            -o /tmp/ph_page.html \
            -w "HTTP=%{http_code}\nFINAL_URL=%{url_effective}\nREDIRECTS=%{num_redirects}\n" \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36" \
            "$INPUT_URL"

          echo ""
          echo "Page size:"
          wc -c /tmp/ph_page.html

          echo ""
          echo "First 500 characters:"
          head -c 500 /tmp/ph_page.html || true

      - name: Get direct links
        env:
          INPUT_URL: ${{ inputs.url }}
          QUALITY: ${{ inputs.quality }}
        run: |
          set -e

          echo "## Direct Links" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if echo "$INPUT_URL" | grep -qi "pornhub.com"; then

            yt-dlp \
              --cookies cookies.txt \
              --impersonate chrome \
              -f "best[height<=$QUALITY]" \
              -g \
              --no-warnings \
              "$INPUT_URL" | tee -a "$GITHUB_STEP_SUMMARY"

          else

            yt-dlp \
              --impersonate chrome \
              -f "best[height<=$QUALITY]" \
              -g \
              --no-warnings \
              "$INPUT_URL" | tee -a "$GITHUB_STEP_SUMMARY"

          fi

          echo '```' >> "$GITHUB_STEP_SUMMARY"


  upload:
    if: inputs.mode == 'upload_release'
    runs-on: ubuntu-latest

    steps:

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg aria2

          python -m pip install -U yt-dlp==${{ env.YTDLP_VERSION }}
          python -m pip install "curl_cffi>=0.10"

      - name: Prepare PornHub cookies
        if: contains(inputs.url, 'pornhub.com')
        env:
          PH_COOKIES: ${{ secrets.PH_COOKIES }}
        run: |
          set -e

          if [ -z "$PH_COOKIES" ]; then
            echo "PH_COOKIES secret is empty."
            exit 1
          fi

          printf '%s\n' "$PH_COOKIES" > cookies.txt
          chmod 600 cookies.txt

          echo "PornHub cookies loaded."

      - name: Inspect PornHub response
        if: contains(inputs.url, 'pornhub.com')
        env:
          INPUT_URL: ${{ inputs.url }}
        run: |
          set -e

          echo "======================================"
          echo "PornHub HTTP test"
          echo "======================================"

          curl \
            -L \
            -sS \
            -o /tmp/ph_page.html \
            -w "HTTP=%{http_code}\nFINAL_URL=%{url_effective}\nREDIRECTS=%{num_redirects}\n" \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36" \
            "$INPUT_URL"

          echo ""
          echo "Page size:"
          wc -c /tmp/ph_page.html

          echo ""
          echo "First 500 characters:"
          head -c 500 /tmp/ph_page.html || true

      - name: Download video
        id: dl
        env:
          INPUT_URL: ${{ inputs.url }}
          QUALITY: ${{ inputs.quality }}
          AUDIO_ONLY: ${{ inputs.audio_only }}
        run: |
          set -e

          COOKIE_ARGS=""

          if echo "$INPUT_URL" | grep -qi "pornhub.com"; then
            COOKIE_ARGS="--cookies cookies.txt"
            echo "PornHub mode: cookies enabled"
          fi

          if [ "$AUDIO_ONLY" = "true" ]; then

            yt-dlp \
              --impersonate chrome \
              $COOKIE_ARGS \
              -f "bestaudio/best" \
              -x \
              --audio-format mp3 \
              --no-warnings \
              --restrict-filenames \
              -o "%(title).100s.%(ext)s" \
              --print-to-file after_move:filepath filename.txt \
              "$INPUT_URL"

          else

            yt-dlp \
              --impersonate chrome \
              $COOKIE_ARGS \
              -f "best[height<=$QUALITY]" \
              --merge-output-format mp4 \
              --no-warnings \
              --restrict-filenames \
              -o "%(title).100s.%(ext)s" \
              --print-to-file after_move:filepath filename.txt \
              "$INPUT_URL"

          fi

          FILENAME=$(cat filename.txt)

          if [ -z "$FILENAME" ]; then
            echo "Could not determine downloaded filename."
            exit 1
          fi

          if [ ! -f "$FILENAME" ]; then
            echo "Downloaded file not found:"
            echo "$FILENAME"
            exit 1
          fi

          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"

          echo ""
          echo "======================================"
          echo "Downloaded successfully:"
          echo "$FILENAME"
          echo "======================================"


      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-file
          path: ${{ steps.dl.outputs.filename }}
          retention-days: 2


      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: download-${{ github.run_id }}
          files: ${{ steps.dl.outputs.filename }}
          prerelease: true
          name: "Download ${{ github.run_id }}"
          body: |
            دانلود شده از:

            ${{ inputs.url }}

            کیفیت:
            ${{ inputs.quality }}

            Audio only:
            ${{ inputs.audio_only }}


      - name: Show final download link
        env:
          RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          echo "## ✅ Download completed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 🔗 GitHub Release" >> "$GITHUB_STEP_SUMMARY"
          echo "$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### 📁 File" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.dl.outputs.filename }}" >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "======================================"
          echo "FINAL RELEASE LINK:"
          echo "$RELEASE_URL"
          echo "======================================"