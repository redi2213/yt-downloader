name: Download Anything

# Generic, site-agnostic download workflow. Kept completely separate from
# download.yml / list-formats.yml (which are tuned specifically for
# YouTube's PO-Token / player-client requirements) so that changes here
# can never break the existing YouTube flow.
#
# Two modes:
#   - direct_link:   asks yt-dlp for the resolved, playable URL(s) without
#                     downloading anything. Fast, but the URL is often
#                     short-lived (site-dependent) and may require the
#                     same cookies/headers to actually play.
#   - upload_release: downloads the file and publishes it as a GitHub
#                     Release asset (same pattern as download.yml).

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Any link yt-dlp supports'
        required: true
      mode:
        description: 'direct_link or upload_release'
        required: true
        default: 'upload_release'
        type: choice
        options:
          - direct_link
          - upload_release
      format_id:
        description: '(upload_release only) format id, or leave default for best'
        required: false
        default: 'bv*+ba/best'
      audio_only:
        description: '(upload_release only) true for audio-only MP3'
        required: false
        default: 'false'

env:
  YTDLP_VERSION: '2026.07.04'

permissions:
  contents: write

jobs:
  resolve:
    if: github.event.inputs.mode == 'direct_link'
    runs-on: ubuntu-latest
    steps:
      - name: Cache yt-dlp
        id: cache-ytdlp
        uses: actions/cache@v4
        with:
          path: /opt/ytdlp
          key: ytdlp-anything-${{ env.YTDLP_VERSION }}-v1

      - name: Install yt-dlp (cache miss only)
        if: steps.cache-ytdlp.outputs.cache-hit != 'true'
        run: |
          pip install --target /opt/ytdlp yt-dlp==${{ env.YTDLP_VERSION }}
          # curl_cffi enables browser impersonation, needed by some sites
          # (e.g. Vimeo) to bypass anti-bot checks.
          pip install --target /opt/ytdlp "curl_cffi>=0.10"

      - name: Add yt-dlp to PATH
        run: |
          echo "PYTHONPATH=/opt/ytdlp" >> $GITHUB_ENV
          mkdir -p /opt/ytdlp-bin
          printf '#!/usr/bin/env bash\nPYTHONPATH=/opt/ytdlp python3 -m yt_dlp "$@"\n' > /opt/ytdlp-bin/yt-dlp
          chmod +x /opt/ytdlp-bin/yt-dlp
          echo "/opt/ytdlp-bin" >> $GITHUB_PATH

      - name: Write cookies file
        run: echo "${{ secrets.YTDLP_COOKIES }}" > cookies.txt

      - name: Resolve direct link(s)
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          yt-dlp --cookies cookies.txt \
            -f "bv*+ba/best" -g \
            "${{ github.event.inputs.url }}" | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Clean up cookies
        if: always()
        run: rm -f cookies.txt

  upload:
    if: github.event.inputs.mode == 'upload_release'
    runs-on: ubuntu-latest
    steps:
      # --- ffmpeg + aria2 (cached as .deb files, installed via dpkg = fast) ---
      - name: Cache apt debs
        id: cache-apt
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-debs-ffmpeg-aria2-v3

      - name: Download apt packages (cache miss only)
        if: steps.cache-apt.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --download-only ffmpeg aria2

      - name: Install ffmpeg + aria2 from local debs
        run: sudo dpkg -i /var/cache/apt/archives/*.deb || sudo apt-get install -f -y

      # --- yt-dlp (pinned version, cached separately from download.yml's
      #     cache so this workflow can never disturb it) ---
      - name: Cache yt-dlp
        id: cache-ytdlp
        uses: actions/cache@v4
        with:
          path: /opt/ytdlp
          key: ytdlp-anything-${{ env.YTDLP_VERSION }}-v1

      - name: Install yt-dlp (cache miss only)
        if: steps.cache-ytdlp.outputs.cache-hit != 'true'
        run: |
          pip install --target /opt/ytdlp yt-dlp==${{ env.YTDLP_VERSION }}
          pip install --target /opt/ytdlp "curl_cffi>=0.10"

      - name: Add yt-dlp to PATH
        run: |
          echo "PYTHONPATH=/opt/ytdlp" >> $GITHUB_ENV
          mkdir -p /opt/ytdlp-bin
          printf '#!/usr/bin/env bash\nPYTHONPATH=/opt/ytdlp python3 -m yt_dlp "$@"\n' > /opt/ytdlp-bin/yt-dlp
          chmod +x /opt/ytdlp-bin/yt-dlp
          echo "/opt/ytdlp-bin" >> $GITHUB_PATH

      - name: Write cookies file
        run: echo "${{ secrets.YTDLP_COOKIES }}" > cookies.txt

      - name: Download
        id: dl
        shell: bash
        run: |
          set -euo pipefail
          OUTTMPL="%(title).120s.%(ext)s"
          COMMON_SPEED_FLAGS=(--downloader aria2c --downloader-args "aria2c:-x 16 -s 16 -k 4M --file-allocation=none" -N 8 --retries 10 --fragment-retries 10 --socket-timeout 30)

          if [ "${{ github.event.inputs.audio_only }}" = "true" ]; then
            yt-dlp --cookies cookies.txt \
              --restrict-filenames "${COMMON_SPEED_FLAGS[@]}" \
              -f "bestaudio/best" \
              -x --audio-format mp3 \
              -o "$OUTTMPL" \
              --print-to-file after_move:filepath filename.txt \
              "${{ github.event.inputs.url }}"
          else
            yt-dlp --cookies cookies.txt \
              --restrict-filenames "${COMMON_SPEED_FLAGS[@]}" \
              -f "${{ github.event.inputs.format_id }}" \
              --merge-output-format mkv \
              -o "$OUTTMPL" \
              --print-to-file after_move:filepath filename.txt \
              "${{ github.event.inputs.url }}"
          fi

          if [ ! -s filename.txt ]; then
            echo "::error::yt-dlp did not produce an output file (filename.txt is empty/missing)."
            exit 1
          fi
          FILENAME=$(cat filename.txt)
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

      - name: Clean up cookies
        if: always()
        run: rm -f cookies.txt filename.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-file
          path: ${{ steps.dl.outputs.filename }}
          retention-days: 1

      - name: Create Release with direct link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: run-${{ github.run_id }}
          files: ${{ steps.dl.outputs.filename }}
          prerelease: true
          name: "Download run-${{ github.run_id }}"
