name: Download Anything

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'لینک ویدیو'
        required: true
      mode:
        description: 'direct_link یا upload_release'
        required: true
        default: 'direct_link'
        type: choice
        options:
          - direct_link
          - upload_release
      quality:
        description: 'حداکثر کیفیت (مثلا 720 یا 1080)'
        required: false
        default: '720'
      audio_only:
        description: 'فقط صوت'
        required: false
        default: 'false'
        type: boolean

env:
  YTDLP_VERSION: '2026.08.19'

permissions:
  contents: write

jobs:
  resolve:
    if: github.event.inputs.mode == 'direct_link'
    runs-on: ubuntu-latest
    steps:
      - name: Install yt-dlp + curl_cffi
        run: |
          pip install -U yt-dlp==${{ env.YTDLP_VERSION }}
          pip install "curl_cffi>=0.10"

      - name: Get direct links
        run: |
          echo "## Direct Links" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          yt-dlp \
            --impersonate chrome \
            -f "best[height<=${{ github.event.inputs.quality }}]" \
            -g --no-warnings \
            "${{ github.event.inputs.url }}" | tee -a $GITHUB_STEP_SUMMARY

          echo '```' >> $GITHUB_STEP_SUMMARY

  upload:
    if: github.event.inputs.mode == 'upload_release'
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg aria2
          pip install -U yt-dlp==${{ env.YTDLP_VERSION }}
          pip install "curl_cffi>=0.10"

      - name: Download video
        id: dl
        run: |
          set -e

          if [ "${{ github.event.inputs.audio_only }}" = "true" ]; then
            yt-dlp \
              --impersonate chrome \
              -f "bestaudio/best" \
              -x --audio-format mp3 \
              --no-warnings \
              -o "%(title).100s.%(ext)s" \
              --print-to-file after_move:filepath filename.txt \
              "${{ github.event.inputs.url }}"
          else
            yt-dlp \
              --impersonate chrome \
              -f "best[height<=${{ github.event.inputs.quality }}]" \
              --merge-output-format mp4 \
              --no-warnings \
              -o "%(title).100s.%(ext)s" \
              --print-to-file after_move:filepath filename.txt \
              "${{ github.event.inputs.url }}"
          fi

          FILENAME=$(cat filename.txt)
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "Downloaded: $FILENAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-file
          path: ${{ steps.dl.outputs.filename }}
          retention-days: 2

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: download-${{ github.run_id }}
          files: ${{ steps.dl.outputs.filename }}
          prerelease: true
          name: "Download ${{ github.run_id }}"
          body: |
            دانلود شده از:
            `${{ github.event.inputs.url }}`