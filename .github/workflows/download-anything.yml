name: Download Anything

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'لینک ویدیو'
        required: true
        type: string

      mode:
        description: 'نوع خروجی'
        required: true
        default: 'direct_link'
        type: choice
        options:
          - direct_link
          - upload_release

      quality:
        description: 'حداکثر کیفیت'
        required: false
        default: '720'
        type: string

      audio_only:
        description: 'فقط صوت'
        required: false
        default: false
        type: boolean

env:
  YTDLP_VERSION: '2026.08.19'

permissions:
  contents: write

jobs:

  resolve:
    if: inputs.mode == 'direct_link'
    runs-on: ubuntu-latest

    steps:

      - name: Install yt-dlp
        run: |
          python -m pip install -U yt-dlp==${{ env.YTDLP_VERSION }}
          python -m pip install "curl_cffi>=0.10"

      - name: Prepare PornHub cookies
        env:
          PH_COOKIES: ${{ secrets.PH_COOKIES }}
        run: |
          if echo "${{ inputs.url }}" | grep -qi "pornhub.com"; then
            if [ -z "$PH_COOKIES" ]; then
              echo "PH_COOKIES secret is missing"
              exit 1
            fi

            printf '%s' "$PH_COOKIES" > cookies.txt
            chmod 600 cookies.txt

            echo "PornHub cookies loaded."
          else
            echo "Non-PornHub URL. Cookies not needed."
          fi

      - name: Get direct links
        run: |
          echo "## Direct Links" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          if echo "${{ inputs.url }}" | grep -qi "pornhub.com"; then

            yt-dlp \
              --impersonate chrome \
              --cookies cookies.txt \
              -f "best[height<=${{ inputs.quality }}]" \
              -g \
              --no-warnings \
              "${{ inputs.url }}" | tee -a "$GITHUB_STEP_SUMMARY"

          else

            yt-dlp \
              --impersonate chrome \
              -f "best[height<=${{ inputs.quality }}]" \
              -g \
              --no-warnings \
              "${{ inputs.url }}" | tee -a "$GITHUB_STEP_SUMMARY"

          fi

          echo '```' >> "$GITHUB_STEP_SUMMARY"


  upload:
    if: inputs.mode == 'upload_release'
    runs-on: ubuntu-latest

    steps:

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg aria2

          python -m pip install -U yt-dlp==${{ env.YTDLP_VERSION }}
          python -m pip install "curl_cffi>=0.10"

      - name: Prepare PornHub cookies
        env:
          PH_COOKIES: ${{ secrets.PH_COOKIES }}
        run: |
          if echo "${{ inputs.url }}" | grep -qi "pornhub.com"; then
            if [ -z "$PH_COOKIES" ]; then
              echo "PH_COOKIES secret is missing"
              exit 1
            fi

            printf '%s' "$PH_COOKIES" > cookies.txt
            chmod 600 cookies.txt

            echo "PornHub cookies loaded."
          else
            echo "Non-PornHub URL. Cookies not needed."
          fi

      - name: Download video
        id: dl
        run: |
          set -e

          if echo "${{ inputs.url }}" | grep -qi "pornhub.com"; then
            COOKIE_ARG="--cookies cookies.txt"
          else
            COOKIE_ARG=""
          fi

          if [ "${{ inputs.audio_only }}" = "true" ]; then

            yt-dlp \
              --impersonate chrome \
              $COOKIE_ARG \
              -f "bestaudio/best" \
              -x \
              --audio-format mp3 \
              --no-warnings \
              -o "%(title).100s.%(ext)s" \
              --print-to-file after_move:filepath filename.txt \
              "${{ inputs.url }}"

          else

            yt-dlp \
              --impersonate chrome \
              $COOKIE_ARG \
              -f "best[height<=${{ inputs.quality }}]" \
              --merge-output-format mp4 \
              --no-warnings \
              -o "%(title).100s.%(ext)s" \
              --print-to-file after_move:filepath filename.txt \
              "${{ inputs.url }}"

          fi

          FILENAME=$(cat filename.txt)

          echo "filename=$FILENAME" >> "$GITHUB_OUTPUT"

          echo "Downloaded successfully:"
          echo "$FILENAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-file
          path: ${{ steps.dl.outputs.filename }}
          retention-days: 2

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: download-${{ github.run_id }}
          files: ${{ steps.dl.outputs.filename }}
          prerelease: true
          name: "Download ${{ github.run_id }}"
          body: |
            دانلود شده از:

            ${{ inputs.url }}

            کیفیت:
            ${{ inputs.quality }}

            Audio only:
            ${{ inputs.audio_only }}