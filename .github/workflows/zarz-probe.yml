name: Zarz Probe
run-name: Zarz Probe WARP (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Install Cloudflare WARP (proxy mode)
        run: |
          set -x
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          sleep 3
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy || warp-cli --accept-tos set-mode proxy || true
          warp-cli --accept-tos connect || true
          for i in $(seq 1 20); do
            warp-cli --accept-tos status | head -n 3
            warp-cli --accept-tos status | grep -qi 'Connected' && break
            sleep 2
          done
          warp-cli --accept-tos status || true

      - name: Probe api.zarz.moe through WARP and directly
        run: |
          P="socks5h://127.0.0.1:40000"
          probe() {
            local label="$1"; shift
            echo "=== $label"
            curl -sS -m 25 "$@" -D /tmp/h -o /tmp/b -w 'http=%{http_code}\n' || true
            grep -iE '^(server|cf-mitigated|content-type):' /tmp/h | tr -d '\r' || true
            head -c 200 /tmp/b | tr '\n' ' '; echo
          }
          echo "--- egress IP via WARP"
          curl -sS -m 20 -x "$P" https://ipinfo.io/json | head -c 300 || true
          probe "WARP bootstrap" -x "$P" "https://api.zarz.moe/v2/bootstrap?install_id=bffe98223336b6a7ee7e4bf3b31a7fec&app_version=tidal-web%401.2.5"
          probe "WARP challenge" -x "$P" "https://api.zarz.moe/v2/challenge"
          probe "WARP resolve" -x "$P" "https://api.zarz.moe/v2/resolve"
          probe "DIRECT bootstrap (control)" "https://api.zarz.moe/v2/bootstrap?install_id=bffe98223336b6a7ee7e4bf3b31a7fec&app_version=tidal-web%401.2.5"
