name: Build APK
run-name: Build APK [${{ inputs.job_id }}]${{ inputs.rerun && format(' ~{0}', inputs.rerun) || '' }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Unique id the app puts in the run name to find this run (set by the app)'
        required: false
        default: ''
        type: string
      rerun:
        description: 'Set by the app: the other inputs packed into the run name so "Run again" can repeat this run (leave empty when running by hand)'
        required: false
        default: ''
        type: string
      run_title:
        description: 'Ignored (kept so the app can send it)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing. Add it in Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          # Tolerate line breaks / spaces / quotes that sneak in when pasting a long secret,
          # and restore "=" padding that a copy can drop from the end.
          CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=')
          while [ $(( ${#CLEAN} % 4 )) -ne 0 ]; do CLEAN="${CLEAN}="; done
          echo "KEYSTORE_BASE64 length after cleaning: ${#CLEAN} characters (compare with: wc -c ytbridge.b64 in Termux)"
          printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/ytbridge.keystore" || echo "::warning::base64 decoding reported a problem"
          echo "Keystore size after decoding: $(stat -c %s "$RUNNER_TEMP/ytbridge.keystore" 2>/dev/null || echo 0) bytes"
          if ! keytool -list -keystore "$RUNNER_TEMP/ytbridge.keystore" \
                 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/keytool.out" 2>&1; then
            echo "::error::The keystore could not be opened (details below)."
            sed 's/^/keytool: /' "$RUNNER_TEMP/keytool.out" | head -8
            exit 1
          fi
          echo "Keystore OK (alias $KEY_ALIAS found)"

      - name: Embed source branch into build (not committed to repo)
        run: |
          echo "GITHUB_BRANCH = \"${{ github.ref_name }}\"" > core/_branch.py
          echo "Building from branch: ${{ github.ref_name }}"

      - name: Next version number (version.txt is saved only after a successful build)
        run: |
          CUR=$(tr -d ' \r\n' < version.txt 2>/dev/null || true)
          [ -n "$CUR" ] || CUR="2.0"
          if [[ "$CUR" == *.* ]]; then MAJOR="${CUR%%.*}"; MINOR="${CUR#*.}"; else MAJOR="$CUR"; MINOR=0; fi
          [[ "$MINOR" =~ ^[0-9]+$ ]] || MINOR=0
          NEW="$MAJOR.$((MINOR+1))"
          echo "VERSION=$NEW" >> "$GITHUB_ENV"
          # generated like core/_branch.py: baked into this build only, never committed
          echo "APP_VERSION = \"$NEW\"" > core/_version.py
          echo "Version: $CUR -> $NEW"

      - name: Prepare buildozer.spec (APK format + rising version code + version)
        run: |
          sed -i '/^android\.release_artifact/d;/^# *android\.release_artifact/d;/^android\.numeric_version/d' buildozer.spec
          sed -i '/^\[app\]/a android.release_artifact = apk\nandroid.numeric_version = ${{ github.run_number }}' buildozer.spec
          sed -i "s/^version *=.*/version = ${VERSION}/" buildozer.spec
          grep -n "release_artifact\|numeric_version\|^version" buildozer.spec

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache buildozer (platform + app build)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
            ~/.gradle
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf \
            libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev build-essential

      - name: Install buildozer and cython
        run: |
          pip3 install --upgrade buildozer cython==0.29.36

      - name: Fix legacy sdkmanager path for buildozer
        run: |
          mkdir -p /usr/local/lib/android/sdk/tools/bin
          ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager /usr/local/lib/android/sdk/tools/bin/sdkmanager

      - name: Install Android platform 33
        run: |
          yes | /usr/local/lib/android/sdk/tools/bin/sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Remove stale python venv from the restored cache
        # python-for-android builds a venv (build/venv) when a pure-Python
        # requirement is new. One restored from an older run (made with a
        # different Python) has a broken pip -> "cannot import name
        # BuildDependencyInstallError". A fresh venv is created each time.
        run: rm -rf .buildozer/android/platform/build-*/build/venv

      - name: Build signed APK with buildozer
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/ytbridge.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          yes | buildozer android release
          ls -la bin/

      - name: Publish APK to a release (the app finds it by run id)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SRC_APK=$(ls bin/*.apk | head -1)
          APK="bin/YT-Bridge-${VERSION}.apk"
          cp "$SRC_APK" "$APK"
          echo "APK: $APK"
          gh release create "run-${{ github.run_id }}" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "YT Bridge ${VERSION} (build #${{ github.run_number }})" \
            --notes "Version ${VERSION}. Signed with the fixed key - installs over the previous version."

      - name: Save the new version number in the repo
        run: |
          git checkout -- buildozer.spec
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "$VERSION" > version.txt
          git add version.txt
          git commit -m "Version ${VERSION}" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" || true
            if git push origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
            sleep 4
          done
          echo "::warning::Could not save version.txt (the APK is already published). Set it to ${VERSION} by hand."

  # A separate job: it starts only after the build job has fully ended, including the
  # "Post Cache buildozer" step (saving the cache takes minutes). As a last step of the
  # build job the message came before that and looked like the build was already done.
  notify:
    name: notify
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Notify (ntfy)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ needs.build.result }}
          TOOL_NAME: Build APK
          ONLY_FAILURE: 'false'
          RUN_TITLE: ${{ inputs.run_title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          if [ "$JOB_STATUS" = "success" ] && [ "$ONLY_FAILURE" = "true" ]; then
            echo "Success and this tool only reports failures: no notification."
            exit 0
          fi
          # The topic is set once in the app (Settings) and kept in ntfy.json on the config branch.
          CFG=$(curl -fsS -m 20 -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ntfy.json?ref=config" 2>/dev/null || true)
          if [ -z "$CFG" ]; then
            echo "No ntfy.json on the config branch: no notification."
            exit 0
          fi
          RESULT=$(CFG="$CFG" python3 - <<'PY'
          import json, os, re
          try:
              d = json.loads(os.environ["CFG"])
          except Exception:
              d = {}
          topic = str(d.get("topic", "")).strip()
          server = str(d.get("server") or "https://ntfy.sh").strip().rstrip("/")
          if re.fullmatch(r"[A-Za-z0-9_-]{1,64}", topic) and re.fullmatch(r"https://[A-Za-z0-9.-]+(:[0-9]+)?", server):
              print(topic + " " + server)
          PY
          )
          if [ -z "$RESULT" ]; then
            echo "ntfy topic is not set: no notification."
            exit 0
          fi
          TOPIC=${RESULT%% *}
          SERVER=${RESULT#* }
          case "$JOB_STATUS" in
            success)   WORD="OK";        TAGS="white_check_mark"; PRIO="default" ;;
            cancelled) WORD="Cancelled"; TAGS="no_entry_sign";    PRIO="default" ;;
            *)         WORD="FAILED";    TAGS="x";                PRIO="high" ;;
          esac
          BODY="$TOOL_NAME: $WORD"
          if [ -n "${RUN_TITLE:-}" ]; then BODY="$BODY"$'\n'"$RUN_TITLE"; fi
          BODY="$BODY"$'\n'"$RUN_URL"
          if curl -fsS -m 20 -X POST "$SERVER/$TOPIC" \
              -H "Title: YT Bridge - $TOOL_NAME - $WORD" -H "Tags: $TAGS" -H "Priority: $PRIO" \
              -H "Click: $RUN_URL" --data-binary "$BODY" >/dev/null; then
            echo "Notification sent."
          else
            echo "ntfy could not be reached."
          fi
