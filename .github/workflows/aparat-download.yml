name: Aparat to GitHub Release
run-name: ${{ inputs.run_title || inputs.aparat_url }} [${{ inputs.job_id }}]${{ inputs.rerun && format(' ~{0}', inputs.rerun) || '' }}

on:
  workflow_dispatch:
    inputs:
      aparat_url:
        description: "Aparat video, playlist or channel link"
        required: true
        type: string
      quality:
        description: "best, 1080p, 720p, 480p, 360p, 240p or 144p"
        required: false
        default: "best"
        type: string
      output:
        description: "upload_separate, upload_zip or links (links_phone: the app gets the links itself)"
        required: false
        default: "upload_separate"
        type: string
      channel_limit:
        description: "Channel links only, e.g. count:10 or days:7"
        required: false
        default: "count:5"
        type: string
      video_ids:
        description: "Only these videos (comma separated Aparat video ids picked in the app; empty = everything the link gives)"
        required: false
        default: ""
        type: string
      job_id:
        description: 'Set by the app so it can find this exact run (leave empty when running by hand)'
        required: false
        default: ''
        type: string
      rerun:
        description: 'Set by the app: the other inputs packed into the run name so "Run again" can repeat this run (leave empty when running by hand)'
        required: false
        default: ''
        type: string
      release_tag:
        description: 'Auto follow: add the files to this release (created the first time) instead of making run-<id> (leave empty when running by hand)'
        required: false
        default: ''
        type: string
      run_title:
        description: 'Short name for this run, set by the app (leave empty when running by hand)'
        required: false
        default: ''
        type: string
      storage:
        description: 'Where to keep the file: github, arvan or both (set by the app)'
        required: false
        default: 'github'
        type: string
      arvan_bucket:
        description: 'Preferred Arvan bucket id (set by the app; empty = the main bucket)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  aparat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Get Persian word dictionary (for Finglish file names)
        run: git clone --depth 1 https://github.com/mmahdibarghi/persian-to-finglish /tmp/p2f 2>/dev/null || true

      - name: Fetch from Aparat
        env:
          VIDEO_IDS: ${{ inputs.video_ids }}
          APARAT_URL: ${{ inputs.aparat_url }}
          QUALITY: ${{ inputs.quality }}
          OUTPUT: ${{ inputs.output }}
          CHANNEL_LIMIT: ${{ inputs.channel_limit }}
        run: |
          OUT="$RUNNER_TEMP/aparat-out"
          NOTES="$RUNNER_TEMP/aparat-notes.md"

          python scripts/aparat_workflow.py \
            --url "$APARAT_URL" \
            --quality "$QUALITY" \
            --output "$OUTPUT" \
            --limit "$CHANNEL_LIMIT" \
            --ids "$VIDEO_IDS" \
            --outdir "$OUT" \
            --notes "$NOTES"

          echo "Files to upload:"
          ls -la "$OUT"

      - name: Create GitHub Release (links list)
        if: ${{ inputs.output == 'links' || inputs.output == 'links_phone' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT="$RUNNER_TEMP/aparat-out"
          NOTES="$RUNNER_TEMP/aparat-notes.md"
          TAG="run-${{ github.run_id }}"

          gh release create "$TAG" "$OUT"/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Aparat Download $(date '+%Y-%m-%d %H:%M:%S')" \
            --notes-file "$NOTES"

          echo "======================================"
          echo "Release created:"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          echo "======================================"

      - name: Install boto3 (Arvan Cloud)
        if: ${{ inputs.output != 'links' && inputs.output != 'links_phone' && (inputs.storage == 'arvan' || inputs.storage == 'both') }}
        run: python3 -m pip install --quiet boto3 || python3 -m pip install --quiet --break-system-packages boto3
      - name: Publish (GitHub Release and/or Arvan Cloud)
        if: ${{ inputs.output != 'links' && inputs.output != 'links_phone' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STORAGE: ${{ inputs.storage || 'github' }}
          ARVAN_BUCKET: ${{ inputs.arvan_bucket }}
          ALL_SECRETS: ${{ (inputs.storage == 'arvan' || inputs.storage == 'both') && toJSON(secrets) || '' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            # Auto follow: one release per channel that keeps growing (Arvan is not used here)
            STORAGE=github python3 scripts/storage_publish.py publish --dir "$RUNNER_TEMP/aparat-out" --tag "$RELEASE_TAG" --title "Auto: ${RELEASE_TAG#auto-}" --notes-file "$RUNNER_TEMP/aparat-notes.md" --append
          else
            python3 scripts/storage_publish.py publish --dir "$RUNNER_TEMP/aparat-out" --tag "run-${{ github.run_id }}" --title "Aparat Download $(date '+%Y-%m-%d %H:%M:%S')" --notes-file "$RUNNER_TEMP/aparat-notes.md"
          fi

      - name: Show direct asset URLs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="${RELEASE_TAG:-run-${{ github.run_id }}}"

          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY"

      - name: Notify (ntfy)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          TOOL_NAME: Aparat
          ONLY_FAILURE: 'false'
          RUN_TITLE: ${{ inputs.run_title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          if [ "$JOB_STATUS" = "success" ] && [ "$ONLY_FAILURE" = "true" ]; then
            echo "Success and this tool only reports failures: no notification."
            exit 0
          fi
          # The topic is set once in the app (Settings) and kept in ntfy.json on the config branch.
          CFG=$(curl -fsS -m 20 -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ntfy.json?ref=config" 2>/dev/null || true)
          if [ -z "$CFG" ]; then
            echo "No ntfy.json on the config branch: no notification."
            exit 0
          fi
          RESULT=$(CFG="$CFG" python3 - <<'PY'
          import json, os, re
          try:
              d = json.loads(os.environ["CFG"])
          except Exception:
              d = {}
          topic = str(d.get("topic", "")).strip()
          server = str(d.get("server") or "https://ntfy.sh").strip().rstrip("/")
          if re.fullmatch(r"[A-Za-z0-9_-]{1,64}", topic) and re.fullmatch(r"https://[A-Za-z0-9.-]+(:[0-9]+)?", server):
              print(topic + " " + server)
          PY
          )
          if [ -z "$RESULT" ]; then
            echo "ntfy topic is not set: no notification."
            exit 0
          fi
          TOPIC=${RESULT%% *}
          SERVER=${RESULT#* }
          case "$JOB_STATUS" in
            success)   WORD="OK";        TAGS="white_check_mark"; PRIO="default" ;;
            cancelled) WORD="Cancelled"; TAGS="no_entry_sign";    PRIO="default" ;;
            *)         WORD="FAILED";    TAGS="x";                PRIO="high" ;;
          esac
          BODY="$TOOL_NAME: $WORD"
          if [ -n "${RUN_TITLE:-}" ]; then BODY="$BODY"$'\n'"$RUN_TITLE"; fi
          BODY="$BODY"$'\n'"$RUN_URL"
          if curl -fsS -m 20 -X POST "$SERVER/$TOPIC" \
              -H "Title: YT Bridge - $TOOL_NAME - $WORD" -H "Tags: $TAGS" -H "Priority: $PRIO" \
              -H "Click: $RUN_URL" --data-binary "$BODY" >/dev/null; then
            echo "Notification sent."
          else
            echo "ntfy could not be reached."
          fi
