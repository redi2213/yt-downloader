name: Instagram Downloader

on:
  workflow_dispatch:
    inputs:
      instagram_url:
        description: "Instagram post, Reel, or Story URL"
        required: true
        type: string
      proxy:
        description: "Optional proxy override (socks5h:// or http://)"
        required: false
        type: string
      v2ray_config:
        description: "Optional V2Ray/Xray share link, subscription URL, or JSON config"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: instagram-downloader-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout proxy configuration branch
        uses: actions/checkout@v4
        with:
          ref: config
          path: labcfg
          persist-credentials: false

      - name: Install dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install --upgrade "requests[socks]" PySocks
          python -m pip install --upgrade --force-reinstall "yt-dlp[pin] @ git+https://github.com/0xvd/yt-dlp-exp@fix/instagram-stories"
          yt-dlp --version

      - name: Start optional Xray proxy
        env:
          V2RAY_CONFIG: ${{ inputs.v2ray_config }}
        run: |
          set -e
          python3 lab_scripts/xray_setup.py

      - name: Prepare extraction routes and cookies
        env:
          INSTAGRAM_URL: ${{ inputs.instagram_url }}
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
          PROXY: ${{ inputs.proxy }}
        run: |
          set -euo pipefail
          mkdir -p downloads .instagram-work
          python3 - <<'PY'
          import os
          from pathlib import Path

          url = os.environ["INSTAGRAM_URL"].strip()
          if not url.startswith(("https://www.instagram.com/", "https://instagram.com/")):
              raise SystemExit("Please provide an Instagram URL beginning with https://www.instagram.com/")

          cookies = os.environ.get("INSTAGRAM_COOKIES", "")
          if cookies.strip():
              p = Path("instagram-cookies.txt")
              p.write_text(cookies, encoding="utf-8")
              p.chmod(0o600)

          proxies = []
          if Path("/tmp/xray_from_config").is_file():
              print("Configured Xray tunnel is available for metadata extraction.")
              proxies = ["socks5h://127.0.0.1:10808"]
          else:
              manual = os.environ.get("PROXY", "").strip()
              if manual:
                  proxies.append(manual)
              proxy_file = Path("labcfg/lab/working_proxies.txt")
              if proxy_file.is_file():
                  for line in proxy_file.read_text(encoding="utf-8", errors="replace").splitlines():
                      line = line.strip()
                      if line and not line.startswith("#"):
                          proxies.append(line)

          unique = []
          for proxy in proxies:
              if proxy not in unique:
                  unique.append(proxy)
          unique.append("DIRECT")
          Path("extraction-attempts.txt").write_text("\n".join(unique) + "\n", encoding="utf-8")
          print(f"Prepared {len(unique) - 1} proxy route(s) and a direct extraction fallback.")
          print("Instagram cookies:", "configured" if cookies.strip() else "not configured")
          PY

      - name: Extract story metadata through proxy, then download media directly
        env:
          INSTAGRAM_URL: ${{ inputs.instagram_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          url = os.environ["INSTAGRAM_URL"].strip()
          cookie_file = Path("instagram-cookies.txt")
          cookie_args = ["--cookies", str(cookie_file)] if cookie_file.is_file() else []
          routes = [x.strip() for x in Path("extraction-attempts.txt").read_text().splitlines() if x.strip()]

          extracted = None
          extraction_route = None
          for number, route in enumerate(routes, 1):
              cmd = ["yt-dlp", "--no-warnings", "--socket-timeout", "20", "--retries", "2",
                     "--fragment-retries", "2", "--dump-json", *cookie_args]
              if route != "DIRECT":
                  cmd += ["--proxy", route]
              cmd.append(url)
              print(f"Metadata extraction attempt {number}/{len(routes)} via {route}")
              result = subprocess.run(cmd, capture_output=True, text=True)
              entries = []
              for line in result.stdout.splitlines():
                  try:
                      item = json.loads(line)
                      if isinstance(item, dict) and item.get("id"):
                          entries.append(item)
                  except json.JSONDecodeError:
                      continue
              if result.returncode == 0 and entries:
                  extracted = entries
                  extraction_route = route
                  break
              print((result.stderr or "No metadata returned.")[-3500:])

          if not extracted:
              raise SystemExit("Could not extract any Instagram media metadata using the available routes.")

          print(f"Extracted metadata for {len(extracted)} media item(s) using {extraction_route}.")
          Path("downloads/.expected-count").write_text(str(len(extracted)), encoding="utf-8")

          completed = []
          for index, item in enumerate(extracted, 1):
              info_path = Path(".instagram-work") / f"info-{index:04d}.json"
              info_path.write_text(json.dumps(item, ensure_ascii=False), encoding="utf-8")
              output_dir = Path("downloads") / f"item-{index:04d}"

              def run_download(route):
                  shutil.rmtree(output_dir, ignore_errors=True)
                  output_dir.mkdir(parents=True, exist_ok=True)
                  cmd = ["yt-dlp", "--no-warnings", "--socket-timeout", "20", "--retries", "2",
                         "--fragment-retries", "2", "--merge-output-format", "mp4",
                         "-f", "bv*+ba/best", "-o", str(output_dir / "%(title)s.%(id)s.%(ext)s"),
                         *cookie_args, "--load-info-json", str(info_path)]
                  if route != "DIRECT":
                      cmd += ["--proxy", route]
                  print(f"Media item {index}/{len(extracted)} download via {route}")
                  result = subprocess.run(cmd, text=True)
                  files = [p for p in output_dir.rglob("*") if p.is_file()
                           and not p.name.endswith((".part", ".ytdl", ".tmp"))]
                  return result.returncode == 0 and len(files) == 1 and files[0].stat().st_size > 0, files

              ok, files = run_download("DIRECT")
              if not ok and extraction_route != "DIRECT":
                  print(f"Direct CDN download failed for item {index}; retrying this item through the extraction proxy.")
                  ok, files = run_download(extraction_route)

              if not ok:
                  raise SystemExit(f"Media item {index}/{len(extracted)} did not produce exactly one complete output file.")
              completed.append(str(files[0]))
              print(f"Completed item {index}/{len(extracted)}: {files[0].name}")

          if len(completed) != len(extracted):
              raise SystemExit(f"Incomplete download: {len(completed)} of {len(extracted)} items completed.")

          print(f"All {len(completed)} of {len(extracted)} media item(s) downloaded successfully.")
          PY

      - name: Verify files and create download links manifest
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find downloads -type f ! -name '.*' ! -name '*.part' ! -name '*.ytdl' ! -name '*.tmp' -print | sort)
          EXPECTED=$(cat downloads/.expected-count)
          if [ "${#FILES[@]}" -eq 0 ] || [ "${#FILES[@]}" -ne "$EXPECTED" ]; then
            echo "Expected $EXPECTED complete media file(s), found ${#FILES[@]}."
            exit 1
          fi

          TAG="run-${RUN_ID}"
          RELEASE_URL="https://github.com/${REPOSITORY}/releases/tag/${TAG}"

          {
            echo "Instagram Downloader"
            echo
            echo "Complete files: ${#FILES[@]} / $EXPECTED"
            echo "Release: ${RELEASE_URL}"
            echo
            echo "Direct file links (available after publishing):"
            for FILE in "${FILES[@]}"; do
              NAME=$(basename "$FILE")
              ENCODED=$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$NAME")
              echo "https://github.com/${REPOSITORY}/releases/download/${TAG}/${ENCODED}"
            done
          } > downloads/download-links.txt

          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "COMPLETE_COUNT=${#FILES[@]}" >> "$GITHUB_ENV"
          echo "Verified ${#FILES[@]} complete media file(s); partial files are excluded."

      - name: Publish files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Instagram download #${{ github.run_number }}"
          body: |
            Downloaded by Instagram Downloader.
            Metadata extraction uses the selected proxy route; media downloads try direct CDN access first and use the extraction proxy only as a fallback.
            The release contains only verified complete media files.
            Complete files: ${{ env.COMPLETE_COUNT }} / ${{ env.COMPLETE_COUNT }}
          files: |
            downloads/item-*/*
          fail_on_unmatched_files: true
          generate_release_notes: false

      - name: Clean temporary files
        if: always()
        run: |
          rm -f instagram-cookies.txt extraction-attempts.txt
          rm -rf .instagram-work downloads
