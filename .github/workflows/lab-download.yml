name: Lab Download Release

# Copy of link_downloader's xh_download.yml for the app's Lab.
# Extracts the links (any site yt-dlp supports), downloads the best match for the
# chosen quality and uploads it to a release with tag "run-<id>".

run-name: ${{ inputs.run_title || 'Lab download' }} [${{ inputs.job_id }}]

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Unique id the app puts in the run name to find this run (set by the app)'
        required: false
        default: ''
        type: string
      run_title:
        description: 'Short name for this run, set by the app (leave empty when running by hand)'
        required: false
        default: ''
        type: string
      url:
        description: "Video page URL (several links: one per line)"
        required: true
        type: string
      quality:
        description: "best / 1080 / 720 / 480"
        required: false
        default: "720"
        type: string
      proxy:
        description: "Proxy only for extracting the page (not for the CDN download)"
        required: false
        type: string
      v2ray_config:
        description: "Optional Xray config for the extract step only"
        required: false
        type: string
      direct_link:
        description: "Link already found on the phone (set by the app): skips the extract steps"
        required: false
        default: ''
        type: string
      direct_title:
        description: "Video title for the file name when direct_link is used"
        required: false
        default: ''
        type: string
      install_only:
        description: "Only prepare and verify dependencies (maintenance test; no download)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Checkout lab branch (proxy list)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: lab
          path: labcfg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: lab-pip-${{ runner.os }}-v1
          restore-keys: lab-pip-${{ runner.os }}-

      - name: Cache static FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ffmpeg-static
          key: lab-ffmpeg-${{ runner.os }}-amd64-v1

      - name: Install deps (yt-dlp + ffmpeg)
        timeout-minutes: 8
        env:
          PIP_TIMEOUT: "30"
          PIP_RETRIES: "5"
          DIRECT_LINK: ${{ inputs.direct_link }}
        run: |
          set -e
          FFMPEG_CACHE_DIR="$HOME/.cache/ffmpeg-static"
          mkdir -p "$FFMPEG_CACHE_DIR"

          # Prefer cached static binaries: avoids slow apt mirrors and ~80 system packages.
          if [ -x "$FFMPEG_CACHE_DIR/ffmpeg" ] && [ -x "$FFMPEG_CACHE_DIR/ffprobe" ]; then
            echo "Using cached static FFmpeg"
          else
            echo "FFmpeg cache miss; downloading static build"
            TMP_FFMPEG="$(mktemp -d)"
            if curl -fL --retry 3 --connect-timeout 20 --max-time 180 \
              https://www.johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
              -o "$TMP_FFMPEG/ffmpeg.tar.xz" \
              && tar -xJf "$TMP_FFMPEG/ffmpeg.tar.xz" -C "$TMP_FFMPEG"; then
              FFMPEG_BIN="$(find "$TMP_FFMPEG" -type f -name ffmpeg -perm -111 | head -1)"
              FFPROBE_BIN="$(find "$TMP_FFMPEG" -type f -name ffprobe -perm -111 | head -1)"
              if [ -n "$FFMPEG_BIN" ] && [ -n "$FFPROBE_BIN" ]; then
                cp "$FFMPEG_BIN" "$FFMPEG_CACHE_DIR/ffmpeg"
                cp "$FFPROBE_BIN" "$FFMPEG_CACHE_DIR/ffprobe"
                chmod +x "$FFMPEG_CACHE_DIR/ffmpeg" "$FFMPEG_CACHE_DIR/ffprobe"
              fi
            fi
            rm -rf "$TMP_FFMPEG"
          fi

          if [ -x "$FFMPEG_CACHE_DIR/ffmpeg" ] && [ -x "$FFMPEG_CACHE_DIR/ffprobe" ]; then
            echo "$FFMPEG_CACHE_DIR" >> "$GITHUB_PATH"
            echo "Static FFmpeg ready"
          else
            echo "Static FFmpeg unavailable; falling back to Ubuntu packages"
            # apt can stall on a bad mirror: every try has a time limit, then it tries again
            if ! command -v ffmpeg >/dev/null 2>&1; then
              for i in 1 2 3; do
                echo "ffmpeg: apt try $i"
                if timeout 120 sudo apt-get update -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=20 \
                   && timeout 240 sudo apt-get install -y -qq -o Acquire::Retries=3 -o Acquire::http::Timeout=20 ffmpeg; then
                  break
                fi
                if [ "$i" = 3 ]; then echo "ffmpeg install failed"; exit 1; fi
              done
            fi
          fi

          pip install -U pip setuptools wheel
          pip install curl_cffi requests PySocks
          if [ -z "$DIRECT_LINK" ]; then
            pip uninstall -y xhamster_api unofficial-api-for-xhamster 2>/dev/null || true
            pip install -U unofficial-api-for-xhamster
            pip install -U unofficial-api-for-beeg || echo "beeg api install failed (Beeg falls back to yt-dlp)"
          fi
          pip install -U yt-dlp
          yt-dlp --version
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Setup Xray (optional, extract only)
        if: ${{ inputs.direct_link == '' && inputs.install_only != true }}
        run: python3 lab_scripts/xray_setup.py || true

      - name: Default configs (auto-refreshed list; skipped when you set a proxy or config)
        if: ${{ inputs.direct_link == '' && inputs.v2ray_config == '' && inputs.proxy == '' && inputs.install_only != true }}
        run: python3 lab_scripts/xray_default.py || true

      - name: Prepare proxies for extract
        if: ${{ inputs.direct_link == '' && inputs.install_only != true }}
        env:
          PROXY_IN: ${{ inputs.proxy }}
        run: |
          if [ -f labcfg/lab/working_proxies.txt ]; then
            cp labcfg/lab/working_proxies.txt working_proxies.txt
          fi
          if [ -n "$PROXY_IN" ]; then
            echo "$PROXY_IN" > working_proxies.txt
          fi
          cat working_proxies.txt 2>/dev/null || true

      - name: Extract links
        if: ${{ inputs.direct_link == '' && inputs.install_only != true }}
        env:
          LAB_LOG_MODE: download
          URL: ${{ inputs.url }}
          PROXY: ${{ inputs.proxy }}
          V2RAY_CONFIG: ${{ inputs.v2ray_config }}
        run: python lab_scripts/links.py

      - name: Use the link the phone already found
        if: ${{ inputs.direct_link != '' && inputs.install_only != true }}
        env:
          DIRECT_LINK: ${{ inputs.direct_link }}
          DIRECT_TITLE: ${{ inputs.direct_title }}
          PAGE: ${{ inputs.url }}
        run: |
          python3 - <<'PY'
          import json, os
          link = os.environ["DIRECT_LINK"].strip()
          page = (os.environ.get("PAGE") or "").strip().splitlines()[0]
          item = {
              "url": page,
              "title": os.environ.get("DIRECT_TITLE") or "video",
              "m3u8": link if ".m3u8" in link else "",
              "qualities": [{"quality": "", "link": link, "ext": "m3u8" if ".m3u8" in link else "mp4"}],
              "error": None,
              "proxy_used": None,
              "method": "phone",
          }
          json.dump([item], open("xh_links.json", "w"), ensure_ascii=False)
          print("Using the phone's link:", link[:160])
          PY

      - name: Download HLS + GitHub Release
        if: ${{ inputs.install_only != true }}
        env:
          LAB_LOG_MODE: download
          UPLOAD: "true"
          QUALITY: ${{ inputs.quality }}
          PROXY_IN: ${{ inputs.proxy }}
          V2RAY_CONFIG: ${{ inputs.v2ray_config }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python lab_scripts/download.py

      - name: Save failure logs (config branch, folder lab-logs)
        if: ${{ always() && hashFiles('lab_logs_out/*') != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 lab_scripts/lab_log_push.py
