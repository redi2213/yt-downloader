name: Any Site Extract and Upload
run-name: Media ${{ inputs.mode }} [${{ inputs.job_id }}]

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "direct = لینک مستقیم | release = آپلود به ریلیز"
        required: true
        default: "release"
        type: choice
        options: ["direct", "release"]
      urls:
        description: "لینک‌ها (هر خط یکی). اگر خالی باشد، urls.txt مخزن خوانده می‌شود"
        required: false
        type: string
      quality:
        description: "کیفیت هدف | check = فقط لیست کیفیت‌های موجود (بدون دانلود)"
        required: true
        default: "720"
        type: choice
        options: ["144", "240", "360", "480", "720", "1080", "highest", "check"]
      format_id:
        description: "اختیاری: format_id دقیق (از خروجی check). اگر پر باشد، کیفیت نادیده گرفته می‌شود و همین فرمت دانلود می‌شود"
        required: false
        default: ""
        type: string
      job_id:
        description: "Set by the app so it can find this exact run (leave empty when running by hand)"
        required: false
        default: ""
        type: string
      storage:
        description: 'Where to keep the file: github, arvan or both (set by the app)'
        required: false
        default: 'github'
        type: string
      arvan_bucket:
        description: 'Preferred Arvan bucket id (set by the app; empty = the main bucket)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.collect.outputs.matrix }}
      tag: ${{ steps.collect.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect links
        id: collect
        env:
          URLS: ${{ inputs.urls }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path

          raw = os.environ.get("URLS", "").strip()
          if not raw and Path("urls.txt").is_file():
              raw = Path("urls.txt").read_text(encoding="utf-8-sig")

          lines = [l for l in raw.splitlines() if not l.lstrip().startswith("#")]
          urls = [u for u in " ".join(lines).split()
                  if u.lower().startswith(("http://", "https://"))]
          urls = list(dict.fromkeys(urls))
          if not urls:
              print("::error::No valid links found (must start with http:// or https://)")
              sys.exit(1)

          print(f"Found {len(urls)} link(s)")
          matrix = [{"idx": i, "url": u} for i, u in enumerate(urls, 1)]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
              f.write("tag=run-" + os.environ["GITHUB_RUN_ID"] + "\n")
          PY

      # در حالت check ریلیز ساخته نمی‌شود
      - name: Create the release
        if: ${{ inputs.mode == 'release' && !(inputs.quality == 'check' && inputs.format_id == '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.collect.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease \
            --title "Media $GITHUB_RUN_ID" \
            --notes "Auto upload"

  process:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 340
    name: link ${{ matrix.idx }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          pip install -U "yt-dlp[default,curl-cffi]" || pip install -U yt-dlp
          sudo apt-get update -qq && sudo apt-get install -y -qq aria2

      # اختیاری: اگر Secret به اسم COOKIES_TXT (فرمت Netscape) بسازی استفاده می‌شود
      - name: Prepare cookies (optional)
        env:
          COOKIES: ${{ secrets.COOKIES_TXT }}
        run: |
          if [ -n "$COOKIES" ]; then
            printf '%s\n' "$COOKIES" > cookies.txt
            echo "Cookies loaded"
          fi

      - name: Extract direct link
        id: pick
        env:
          URL: ${{ matrix.url }}
          QUALITY: ${{ inputs.quality }}
          IDX: ${{ matrix.idx }}
          FORMAT_ID: ${{ inputs.format_id }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys, time, urllib.request
          from concurrent.futures import ThreadPoolExecutor

          url = os.environ["URL"]
          idx = os.environ["IDX"]
          q = os.environ["QUALITY"]
          fid_in = os.environ.get("FORMAT_ID", "").strip()
          check = (q == "check" and not fid_in)
          target = 0 if q in ("highest", "check") else int(q)
          cookie = ["--cookies", "cookies.txt"] if os.path.isfile("cookies.txt") else []

          def ytdlp(args, extra=()):
              return subprocess.run(
                  ["yt-dlp", "--no-warnings", "--no-playlist"] + cookie + list(extra) + args,
                  capture_output=True, text=True, timeout=180)

          def short(msg):
              return (msg or "unknown error")[-300:].replace("\n", " ")

          def fail(msg):
              print(f"::error::{short(msg)}")
              sys.exit(1)

          # ---- 1) گرفتن اطلاعات: ۳ بار تلاش معمولی، ۳ بار با شبیه‌سازی مرورگر ----
          STRATEGIES = [("plain", []),
                        ("impersonate chrome", ["--impersonate", "chrome"])]

          def fetch_info():
              last = ""
              for name, extra in STRATEGIES:
                  for attempt in range(1, 4):
                      try:
                          r = ytdlp(["-J", url], extra)
                          if r.returncode == 0:
                              return json.loads(r.stdout), extra, ""
                          last = r.stderr or r.stdout
                      except subprocess.TimeoutExpired:
                          last = "timeout"
                      except ValueError:
                          last = "invalid JSON from yt-dlp"
                      print(f"[{name}] attempt {attempt}/3 failed: {short(last)}", flush=True)
                      if attempt < 3:
                          time.sleep(5 * attempt)
              return None, [], last

          data, extra, last = fetch_info()

          # ---- 2) آخرین شانس: نسخه nightly از yt-dlp ----
          if data is None:
              print("All attempts failed. Trying the yt-dlp nightly build...", flush=True)
              subprocess.run([sys.executable, "-m", "pip", "install", "-U", "--pre", "--quiet",
                              "yt-dlp[default,curl-cffi]"])
              data, extra, last = fetch_info()

          # ---- 3) اگر باز هم نشد: لاگ verbose برای عیب‌یابی ----
          if data is None:
              print("::group::yt-dlp verbose output (for debugging)")
              try:
                  v = ytdlp(["-v", "-J", url])
                  print((v.stderr or "")[-4000:])
              except Exception as e:
                  print(f"verbose run failed: {e}")
              print("::endgroup::")
              fail(last)

          if extra:
              print("Working strategy: " + " ".join(extra))

          # ---- 4) جمع‌آوری فرمت‌ها ----
          raw = {}
          rows = []
          for f in data.get("formats") or []:
              if f.get("vcodec") == "none":
                  continue
              fid = str(f.get("format_id", ""))
              h = f.get("height")
              if not h:
                  m = re.search(r"(\d+)p", fid)
                  h = int(m.group(1)) if m else None
              raw[fid] = f
              rows.append({
                  "id": fid,
                  "h": int(h) if h else None,
                  "ext": f.get("ext", ""),
                  "fps": f.get("fps"),
                  "vcodec": (f.get("vcodec") or "?").split(".")[0],
                  "acodec": f.get("acodec"),
                  "size": f.get("filesize") or f.get("filesize_approx"),
                  "tbr": f.get("tbr"),
                  "proto": f.get("protocol", ""),
              })

          def mb(n):
              return f"{n / 1048576:.0f} MB" if n else "-"

          def probe_size(r):
              # سایت‌هایی مثل Eporner حجم را نمی‌دهند: با یک درخواست Range کوچک از هدر می‌خوانیم
              f = raw.get(r["id"]) or {}
              u = f.get("url")
              if not u or f.get("protocol") not in ("http", "https"):
                  return None
              hdrs = dict(f.get("http_headers") or {})
              hdrs.setdefault("User-Agent", "Mozilla/5.0")
              hdrs.setdefault("Referer", url)
              hdrs["Range"] = "bytes=0-0"
              try:
                  req = urllib.request.Request(u, headers=hdrs)
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      m = re.search(r"/(\d+)$", resp.headers.get("Content-Range", ""))
                      if m:
                          return int(m.group(1))
                      if resp.status == 200 and resp.headers.get("Content-Length"):
                          return int(resp.headers["Content-Length"])
              except Exception:
                  return None
              return None

          def fill_sizes(rs):
              todo = [r for r in rs if not r["size"]]
              if not todo:
                  return
              with ThreadPoolExecutor(max_workers=8) as ex:
                  for r, sz in zip(todo, ex.map(probe_size, todo)):
                      if sz:
                          r["size"] = sz

          # ---- حالت check: فقط لیست کیفیت‌ها ----
          if check:
              fill_sizes(rows)
              rows.sort(key=lambda r: (r["h"] or 0, r["size"] or 0))
              heights = sorted({r["h"] for r in rows if r["h"]})
              title = data.get("title") or "video"
              print(f"Title: {title}")
              print("AVAILABLE_HEIGHTS: " + (",".join(map(str, heights)) or "none"))
              print(f"{'format_id':<18}{'height':<8}{'ext':<6}{'fps':<5}{'size':<9}{'audio':<7}vcodec")
              for r in rows:
                  has_a = "no" if r["acodec"] == "none" else "yes"
                  print(f"{r['id']:<18}{str(r['h'] or '?'):<8}{r['ext']:<6}"
                        f"{str(r['fps'] or '-'):<5}{mb(r['size']):<9}{has_a:<7}{r['vcodec']}")
              if not rows:
                  print("No video formats listed by the site.")

              payload = {"url": url, "title": title, "heights": heights, "formats": rows}
              with open(f"formats_{idx}.json", "w", encoding="utf-8") as fh:
                  json.dump(payload, fh, ensure_ascii=False, indent=1)
              # یک خط فشرده در لاگ، برای اپ (اگر آپلود artifact به خاطر سهمیه جواب نداد)
              print("FORMATS_JSON=" + json.dumps(payload, ensure_ascii=False, separators=(",", ":")))

              summ = os.environ.get("GITHUB_STEP_SUMMARY")
              if summ:
                  with open(summ, "a", encoding="utf-8") as fh:
                      fh.write(f"### link {idx}: {title}\n\n")
                      fh.write("**Heights:** " + (", ".join(f"{h}p" for h in heights) or "none") + "\n\n")
                      fh.write("| format_id | height | ext | fps | size | audio | vcodec |\n")
                      fh.write("|---|---|---|---|---|---|---|\n")
                      for r in rows:
                          has_a = "no" if r["acodec"] == "none" else "yes"
                          fh.write(f"| {r['id']} | {r['h'] or '?'} | {r['ext']} | {r['fps'] or '-'} "
                                   f"| {mb(r['size'])} | {has_a} | {r['vcodec']} |\n")
                      fh.write("\n")
              sys.exit(0)

          # ---- 5) انتخاب فرمت ----
          ext = ""
          chosen = None
          if fid_in:
              chosen = next((r for r in rows if r["id"] == fid_in), None)
              if not chosen:
                  fail(f"format_id '{fid_in}' not found. Available: " + ", ".join(r["id"] for r in rows))
              print(f"Using the requested format_id: {fid_in}")
          else:
              fmts = [r for r in rows if r["h"] and r["id"]]
              if fmts:
                  t = target or max(r["h"] for r in fmts)
                  best_h = min({r["h"] for r in fmts}, key=lambda hh: (abs(hh - t), -hh))
                  if target and best_h != target:
                      print(f"Requested {target}p not available, closest is {best_h}p")
                  cands = [r for r in fmts if r["h"] == best_h]
                  fill_sizes(cands)
                  # بین فرمت‌های هم‌رزولوشن: کم‌حجم‌ترین؛ اگر حجم نامعلوم بود، mp4 ترجیح دارد
                  cands.sort(key=lambda r: (r["size"] is None, r["size"] or 0,
                                            0 if r["ext"] == "mp4" else 1))
                  print(f"Candidates at {best_h}p: " +
                        ", ".join(f"{r['id']} ({mb(r['size'])})" for r in cands))
                  chosen = cands[0]

          if chosen:
              ext = chosen["ext"]
              fsel = f"{chosen['id']}+ba/{chosen['id']}" if chosen["acodec"] == "none" else chosen["id"]
              print(f"Chosen: {chosen['id']} ({chosen['h'] or '?'}p, {mb(chosen['size'])}) -> {fsel}")
          else:
              # سایت‌هایی که ارتفاع نمی‌دهند: بهترین کیفیت
              fsel = "bv*+ba/b"
              print("No height info, using best available")

          r = ytdlp(["-g", "-f", fsel, url], extra)
          if r.returncode:
              fail(r.stderr or r.stdout)
          links = [l.strip() for l in r.stdout.splitlines()
                   if l.strip().startswith(("http://", "https://"))]
          if not links:
              fail("No media URL returned.")
          open("link.txt", "w").write("\n".join(links) + "\n")

          title = re.sub(r"[^A-Za-z0-9._-]+", "_", data.get("title") or "video")
          title = title.strip("._-")[:120] or "video"
          if len(links) > 1 or any(".m3u8" in l for l in links) or ext not in ("mp4", "webm", "mkv", "mov", "m4v"):
              ext = "mp4"
          name = f"{title}.{ext}"

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"fsel={fsel}\nname={name}\nextra={' '.join(extra)}\n")
          PY

      # ---------- حالت check: لیست کیفیت‌ها به صورت artifact ----------
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && inputs.quality == 'check' && inputs.format_id == '' }}
        continue-on-error: true
        with:
          name: formats-${{ matrix.idx }}
          path: formats_${{ matrix.idx }}.json
          retention-days: 1
          if-no-files-found: ignore

      # ---------- حالت direct ----------
      - name: Save direct link
        if: ${{ inputs.mode == 'direct' && !(inputs.quality == 'check' && inputs.format_id == '') }}
        run: |
          N=$(printf '%04d' "${{ matrix.idx }}")
          mv link.txt "link_$N.txt"
          echo "LINKFILE=link_$N.txt" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.mode == 'direct' && !(inputs.quality == 'check' && inputs.format_id == '') }}
        with:
          name: link-${{ matrix.idx }}
          path: ${{ env.LINKFILE }}
          retention-days: 1

      # ---------- حالت release ----------
      - name: Download (aria2, fallback yt-dlp)
        if: ${{ inputs.mode == 'release' && !(inputs.quality == 'check' && inputs.format_id == '') }}
        env:
          URL: ${{ matrix.url }}
          FSEL: ${{ steps.pick.outputs.fsel }}
          NAME: ${{ steps.pick.outputs.name }}
          EXTRA: ${{ steps.pick.outputs.extra }}
        run: |
          set -euo pipefail
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          mapfile -t LINKS < link.txt
          mkdir -p work

          COOKIE_ARGS=()
          if [ -s cookies.txt ]; then COOKIE_ARGS=(--cookies cookies.txt); fi
          EXTRA_ARGS=()
          read -r -a EXTRA_ARGS <<< "${EXTRA:-}"

          USE_YTDLP=0
          if printf '%s\n' "${LINKS[@]}" | grep -qi '\.m3u8'; then
            echo "HLS stream detected, using yt-dlp"
            USE_YTDLP=1
          else
            PARTS=()
            i=0
            for L in "${LINKS[@]}"; do
              i=$((i+1))
              if aria2c -x 16 -s 16 -k 1M \
                  --file-allocation=none \
                  --connect-timeout=20 \
                  --max-tries=5 --retry-wait=5 \
                  --user-agent="$UA" \
                  --referer="$URL" \
                  -d work -o "part$i" "$L"; then
                PARTS+=("work/part$i")
              else
                echo "aria2 failed, falling back to yt-dlp"
                USE_YTDLP=1
                break
              fi
            done
          fi

          if [ "$USE_YTDLP" = "1" ]; then
            rm -rf work && mkdir -p work
            yt-dlp --no-warnings --no-playlist "${COOKIE_ARGS[@]}" "${EXTRA_ARGS[@]}" \
              -f "$FSEL" \
              --merge-output-format mp4 \
              --concurrent-fragments 16 \
              --retries 5 --fragment-retries 5 \
              -o "work/$NAME" "$URL"
          elif [ "${#PARTS[@]}" -eq 1 ]; then
            mv "${PARTS[0]}" "work/$NAME"
          else
            ffmpeg -y -loglevel error -i "${PARTS[0]}" -i "${PARTS[1]}" -c copy "work/$NAME"
            rm -f "${PARTS[@]}"
          fi

          if [ ! -s "work/$NAME" ]; then
            echo "::error::Download failed or file is empty"
            exit 1
          fi
          ls -lh work

      - name: Get the publish scripts
        if: ${{ inputs.mode == 'release' && !(inputs.quality == 'check' && inputs.format_id == '') }}
        uses: actions/checkout@v4
        with:
          path: _repo
          sparse-checkout: scripts
      - name: Install boto3 (Arvan Cloud)
        if: ${{ inputs.mode == 'release' && !(inputs.quality == 'check' && inputs.format_id == '') && (inputs.storage == 'arvan' || inputs.storage == 'both') }}
        run: python3 -m pip install --quiet boto3 || python3 -m pip install --quiet --break-system-packages boto3
      - name: Upload (GitHub Release and/or Arvan Cloud)
        if: ${{ inputs.mode == 'release' && !(inputs.quality == 'check' && inputs.format_id == '') }}
        env:
          GH_TOKEN: ${{ github.token }}
          STORAGE: ${{ inputs.storage || 'github' }}
          ARVAN_BUCKET: ${{ inputs.arvan_bucket }}
          ALL_SECRETS: ${{ (inputs.storage == 'arvan' || inputs.storage == 'both') && toJSON(secrets) || '' }}
          TAG: ${{ needs.prepare.outputs.tag }}
          IDX: ${{ matrix.idx }}
          NAME: ${{ steps.pick.outputs.name }}
        run: |
          python3 _repo/scripts/storage_publish.py upload --file "work/$NAME" --tag "$TAG" --idx "$IDX" --meta-out "meta/meta-$IDX.json"

      - name: Keep the Arvan result for the final step
        if: ${{ !cancelled() && inputs.mode == 'release' && !(inputs.quality == 'check' && inputs.format_id == '') && (inputs.storage == 'arvan' || inputs.storage == 'both') }}
        uses: actions/upload-artifact@v4
        with:
          name: storage-meta-${{ matrix.idx }}
          path: meta/meta-${{ matrix.idx }}.json
          retention-days: 1
          if-no-files-found: ignore

  finalize:
    needs: [prepare, process]
    if: ${{ !cancelled() && inputs.mode == 'release' && !(inputs.quality == 'check' && inputs.format_id == '') && (inputs.storage == 'arvan' || inputs.storage == 'both') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: arvan links
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: storage-meta-*
          merge-multiple: true
          path: metas

      - name: Write the Arvan links into the release
        env:
          GH_TOKEN: ${{ github.token }}
          STORAGE: ${{ inputs.storage }}
        run: |
          mkdir -p metas
          python3 scripts/storage_publish.py finalize --tag "${{ needs.prepare.outputs.tag }}" --meta-dir metas --notes "Auto upload"

  collect:
    needs: process
    if: ${{ !cancelled() && inputs.mode == 'direct' && !(inputs.quality == 'check' && inputs.format_id == '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: link-*
          merge-multiple: true

      - name: Merge links
        run: |
          ls link_*.txt 2>/dev/null | sort | xargs cat > links.txt || true
          {
            echo "**Links:** $(wc -l < links.txt)"
            echo '```'
            cat links.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: links
          path: links.txt
          retention-days: 1
