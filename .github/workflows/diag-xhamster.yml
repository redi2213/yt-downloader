name: Diag XHamster (temporary)
run-name: Diag XHamster

# Temporary diagnostic: shows what xHamster returns to a GitHub runner.
# Not used by the app. Safe to delete after the xHamster problem is solved.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "xHamster video URL"
        required: true
        default: "https://xhamster.com/videos/rough-fuck-with-big-tits-and-huge-squirt-xhBYszg"

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      URL: ${{ inputs.url }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Runner network
        continue-on-error: true
        run: |
          curl -s --max-time 15 https://ipinfo.io/json | python3 -c "import sys,json; d=json.load(sys.stdin); print('Runner:', d.get('ip'), '|', d.get('org'), '|', d.get('country'))" || echo "ipinfo failed"

      - name: Page fetch (plain and Chrome-impersonated)
        continue-on-error: true
        run: |
          pip install -q curl_cffi
          python3 - <<'PY'
          import os, re, urllib.request, urllib.error
          url = os.environ["URL"]
          MARKERS = ["videoModel", "window.initials", "Just a moment", "cf-chl", "captcha", "Access denied", "Attention Required"]
          def report(label, status, text):
              title = re.search(r"<title>(.*?)</title>", text, re.S)
              found = [m for m in MARKERS if m in text]
              line = f"[{label}] status={status} bytes={len(text)} title={(title.group(1).strip()[:80] if title else None)!r} markers={found}"
              print(line)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write("- " + line + "\n")
          ua = "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36"
          try:
              req = urllib.request.Request(url, headers={"User-Agent": ua, "Accept-Language": "en-US,en;q=0.9"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  report("urllib", r.status, r.read().decode("utf-8", "replace"))
          except urllib.error.HTTPError as e:
              report("urllib", e.code, e.read().decode("utf-8", "replace"))
          except Exception as e:
              print("[urllib] failed:", repr(e))
          try:
              from curl_cffi import requests as cr
              r = cr.get(url, impersonate="chrome", timeout=30)
              report("curl_cffi chrome", r.status_code, r.text)
          except Exception as e:
              print("[curl_cffi] failed:", repr(e))
          PY

      - name: Repeat page fetch (how often does the page miss videoModel?)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import os, re, time, urllib.request, urllib.error
          from curl_cffi import requests as cr
          url = os.environ["URL"]
          ua = "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36"
          ok = 0
          total = 0
          def fetch(i):
              if i % 2 == 0:
                  req = urllib.request.Request(url, headers={"User-Agent": ua, "Accept-Language": "en-US,en;q=0.9"})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return "urllib", r.status, r.read().decode("utf-8", "replace")
                  except urllib.error.HTTPError as e:
                      return "urllib", e.code, e.read().decode("utf-8", "replace")
              r = cr.get(url, impersonate="chrome", timeout=30)
              return "chrome", r.status_code, r.text
          for i in range(14):
              try:
                  label, status, text = fetch(i)
              except Exception as e:
                  print(f"#{i} failed: {e!r}")
                  continue
              total += 1
              has = "videoModel" in text
              ok += has
              line = f"#{i} {label} status={status} bytes={len(text)} videoModel={has}"
              if not has:
                  snippet = re.sub(r"\s+", " ", re.sub(r"<script.*?</script>|<style.*?</style>", " ", text, flags=re.S))
                  line += " | page text: " + re.sub(r"<[^>]+>", " ", snippet)[:300]
              print(line)
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                  f.write("- " + line + "\n")
              time.sleep(4)
          print(f"RESULT: {ok}/{total} pages contained videoModel")
          PY

      - name: yt-dlp list formats
        continue-on-error: true
        run: |
          pip install -q -U "yt-dlp[default,curl-cffi]"
          for mode in plain impersonate; do
            echo "::group::yt-dlp $mode"
            if [ "$mode" = "plain" ]; then EXTRA=""; else EXTRA="--impersonate chrome"; fi
            if yt-dlp --no-warnings --no-playlist $EXTRA -F "$URL" 2>&1 | tail -n 12; then :; fi
            echo "::endgroup::"
          done
