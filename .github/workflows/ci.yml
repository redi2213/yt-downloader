name: CI
run-name: CI ${{ github.ref_name }}

# Runs on every pull request to main (and by hand): Python syntax, valid workflow YAML, unit tests.
# Cheap (about a minute) and needs no secrets.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: pip install pytest pyyaml requests pynacl

      - name: Python syntax of every file
        run: python -m compileall -q core api services screens scripts tests main.py

      - name: Workflow files are valid YAML
        run: |
          python - <<'PY'
          import glob, sys, yaml
          bad = 0
          for path in sorted(glob.glob(".github/workflows/*.y*ml")):
              try:
                  doc = yaml.safe_load(open(path, encoding="utf-8"))
                  assert isinstance(doc, dict) and "jobs" in doc, "no jobs section"
              except Exception as e:
                  bad += 1
                  print(f"::error file={path}::{e}")
          sys.exit(1 if bad else 0)
          PY

      - name: Unit tests
        run: python -m pytest -q
