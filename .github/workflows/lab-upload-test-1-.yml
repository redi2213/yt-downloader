name: Upload test
run-name: ${{ inputs.run_title || 'Upload test' }} [${{ inputs.job_id }}]
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Set by the app: unique id put in the run name so it can find this run'
        required: false
        default: ''
        type: string
      run_title:
        description: 'Set by the app: short name for this run'
        required: false
        default: ''
        type: string
      word:
        description: 'a word to print'
        required: false
        default: 'hello'
        type: string
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/upl_test.py "${{ inputs.word }}"
