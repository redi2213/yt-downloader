name: Mornye Lossless Test
run-name: Mornye ${{ inputs.quality }} - ${{ inputs.spotify_url }}

on:
  workflow_dispatch:
    inputs:
      spotify_url:
        description: Spotify track, album, playlist, or artist URL
        required: true
        type: string
      quality:
        description: Desired quality
        required: true
        type: choice
        options:
          - LOSSLESS
          - HI_RES_LOSSLESS
        default: LOSSLESS
      services:
        description: Preferred provider followed by fallback
        required: true
        type: choice
        options:
          - ext:tidal-web ext:qobuz-web
          - ext:qobuz-web ext:tidal-web
        default: ext:tidal-web ext:qobuz-web
      job_id:
        description: Optional app job identifier
        required: false
        type: string
        default: ''
      run_title:
        description: Optional release title
        required: false
        type: string
        default: ''

permissions:
  contents: write

env:
  MORNYE_REGISTRIES: https://raw.githubusercontent.com/mornyeapp/Mornye-Extension/main/registry.json

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install system dependencies and Mornye
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install mornye

      - name: Verify registry and provider entries
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = os.environ["MORNYE_REGISTRIES"]
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mornye-GitHub-Actions-Test"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              registry = json.load(response)

          extensions = {
              item.get("id"): item
              for item in registry.get("extensions", [])
          }

          for ext_id in ("tidal-web", "qobuz-web"):
              item = extensions.get(ext_id)
              if not item:
                  raise SystemExit(
                      f"Required extension missing from registry: {ext_id}"
                  )
              print(
                  f"{ext_id}: version={item.get('version')} "
                  f"category={item.get('category')} "
                  f"url={item.get('download_url')}"
              )

          print("Registry JSON and required entries verified.")
          PY

      - name: Verify Mornye CLI
        run: |
          set -euo pipefail
          python -c "from importlib.metadata import version; print('Mornye version:', version('mornye'))"
          mornye --help

      - name: Download with provider fallback
        env:
          SPOTIFY_URL: ${{ inputs.spotify_url }}
          QUALITY: ${{ inputs.quality }}
          SERVICE_LIST: ${{ inputs.services }}
        run: |
          set -euo pipefail
          mkdir -p out

          read -r -a SERVICES <<< "$SERVICE_LIST"

          printf 'Quality: %s\n' "$QUALITY"
          printf 'Provider order: %s\n' "$SERVICE_LIST"
          printf 'Job ID: %s\n' "${{ inputs.job_id }}"

          mornye "$SPOTIFY_URL" out \
            --service "${SERVICES[@]}" \
            --quality "$QUALITY" \
            --no-lyrics \
            --no-enrich \
            --verbose

          if ! find out -type f -size +0c -print -quit | grep -q .; then
            echo "::error::Mornye completed without producing output files."
            exit 1
          fi

          echo "Produced files:"
          find out -type f -printf '%p (%s bytes)\n'

      - name: Publish successful download to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/storage_publish.py publish \
            --dir out \
            --tag "run-${{ github.run_id }}" \
            --title "${{ inputs.run_title || format('Mornye {0}', inputs.quality) }}"

      - name: Report failure
        if: failure()
        run: |
          echo "::error::Mornye test failed. Review the registry, extension installation, and provider logs."
