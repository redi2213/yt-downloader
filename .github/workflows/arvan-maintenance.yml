name: Arvan maintenance
run-name: Arvan ${{ inputs.action || 'cleanup' }} [${{ inputs.job_id }}]

# cleanup - deletes this project's files (under ytbridge/) older than 7 days
#           from every Arvan bucket. Runs by itself once a day.
# info    - usage and file list of every bucket; the app reads the result from
#           the description of release run-<run id> (only when the app started it).
# Needs the repository secrets ARVAN_ACCESS_KEY / ARVAN_SECRET_KEY / ... (see PROJECT_NOTES.md).

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'cleanup or info'
        required: false
        default: 'cleanup'
        type: string
      job_id:
        description: 'Set by the app so it can find this exact run (leave empty when running by hand)'
        required: false
        default: ''
        type: string
      run_title:
        description: 'Short name for this run, set by the app (leave empty when running by hand)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  arvan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Install boto3
        run: python3 -m pip install --quiet boto3 || python3 -m pip install --quiet --break-system-packages boto3

      - name: Run
        env:
          GH_TOKEN: ${{ github.token }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ACTION: ${{ inputs.action || 'cleanup' }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          case "$ACTION" in cleanup|info) ;; *) echo "::error::Unknown action $ACTION"; exit 1;; esac
          TAG_ARGS=()
          # a release with the result is made only when the app asked for it
          if [ -n "$JOB_ID" ]; then TAG_ARGS=(--tag "run-$GITHUB_RUN_ID"); fi
          python3 scripts/arvan_maintenance.py "$ACTION" "${TAG_ARGS[@]}"
