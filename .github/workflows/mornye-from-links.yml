name: Mornye From Links
run-name: ${{ inputs.run_title || 'Mornye' }} [${{ inputs.job_id }}]${{ inputs.rerun && format(' ~{0}', inputs.rerun) || '' }}

# The phone asks api.zarz.moe (it blocks GitHub's IPs) and sends the track links
# here; this workflow only downloads them, joins DASH parts into .flac and
# publishes the files like the other download workflows.

on:
  workflow_dispatch:
    inputs:
      tracks_json:
        description: Tracks and links made by the app (JSON)
        required: true
        type: string
      job_id:
        description: Run token (set by the app)
        required: false
        type: string
        default: ''
      run_title:
        description: Short name for this run (set by the app)
        required: false
        type: string
        default: ''
      rerun:
        description: Packed inputs for Run again (set by the app)
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  mornye:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: python -m pip install --quiet requests

      - name: Download tracks
        env:
          TRACKS_JSON: ${{ inputs.tracks_json }}
        run: python scripts/mornye_fetch.py

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TITLE: ${{ inputs.run_title || 'Mornye' }}
        run: |
          # GITHUB_ACTIONS is unset on purpose: with it set, the publish script installs
          # ffmpeg through apt just to measure the quality, which sometimes takes the
          # whole 240 s timeout (one run was stuck there for 4 minutes).
          env -u GITHUB_ACTIONS python3 scripts/storage_publish.py publish \
            --dir out \
            --tag "run-${{ github.run_id }}" \
            --title "$RELEASE_TITLE" \
            --notes-file meta/notes.txt
