name: Free Iran Proxy List
run-name: ${{ inputs.run_title || 'Iran proxies' }} [${{ inputs.job_id }}]${{ inputs.rerun && format(' ~{0}', inputs.rerun) || '' }}

on:
  workflow_dispatch:
    inputs:
      max_proxies:
        description: 'Maximum number of proxies to keep'
        required: false
        default: '50 (Max)'
        type: string
      protocol:
        description: 'Protocol: http, socks4, socks5 or all'
        required: false
        default: 'all (Protocol)'
        type: string
      only_working:
        description: 'Quick live check (true/false)'
        required: false
        default: 'true (Live check)'
        type: string
      check_irancell:
        description: 'Find Irancell only? (true/false)'
        required: false
        default: 'true (Irancell only)'
        type: string
      job_id:
        description: 'Set by the app'
        required: false
        default: ''
        type: string
      run_title:
        description: 'Short name for this run'
        required: false
        default: ''
        type: string
      rerun:
        description: 'Set by the app'
        required: false
        default: ''
        type: string
      storage:
        description: 'github, arvan or both'
        required: false
        default: 'github'
        type: string
      arvan_bucket:
        description: 'Arvan bucket id'
        required: false
        default: ''
        type: string

permissions:
  contents: write

# REGISTRATION STUB. GitHub only starts a workflow by file name when the file exists on main.
# The real definition lives on the `lab` branch (same path) and is what runs when the app
# dispatches this file with ref=lab. Do not put steps here.
jobs:
  stub:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Stub on main. The real workflow runs from the lab branch."
