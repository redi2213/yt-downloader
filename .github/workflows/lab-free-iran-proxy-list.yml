name: Free Iran Proxy List
run-name: ${{ inputs.run_title || 'Iran proxies' }} [${{ inputs.job_id }}]${{ inputs.rerun && format(' ~{0}', inputs.rerun) || '' }}

on:
  workflow_dispatch:
    inputs:
      max_proxies:
        description: 'Maximum number of proxies to keep (default 50)'
        required: false
        default: '50'
        type: string
      protocol:
        description: 'Preferred protocol: http, socks4, socks5 or all'
        required: false
        default: 'all'
        type: string
      only_working:
        description: 'Quick live check (true/false). true is slower but cleaner'
        required: false
        default: 'false'
        type: string
      check_irancell:
        description: 'Keep only proxies whose ISP is Irancell (true/false)'
        required: false
        default: 'false'
        type: string
      job_id:
        description: 'Set by the app so it can find this exact run (leave empty when running by hand)'
        required: false
        default: ''
        type: string
      run_title:
        description: 'Short name for this run, set by the app (leave empty when running by hand)'
        required: false
        default: ''
        type: string
      rerun:
        description: 'Set by the app so Run again can repeat this run (leave empty when running by hand)'
        required: false
        default: ''
        type: string
      storage:
        description: 'Where to keep the file: github, arvan or both (set by the app)'
        required: false
        default: 'github'
        type: string
      arvan_bucket:
        description: 'Preferred Arvan bucket id (set by the app; empty = the main bucket)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

# REGISTRATION STUB. GitHub only starts a workflow by file name when the file exists on main.
# The real definition lives on the `lab` branch (same path) and is what runs when the app
# dispatches this file with ref=lab. Do not put steps here.
jobs:
  stub:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Stub on main. The real workflow runs from the lab branch."
