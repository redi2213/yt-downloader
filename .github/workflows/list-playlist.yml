name: List Playlist
run-name: ${{ inputs.run_title || inputs.playlist_url }} [${{ inputs.job_id }}]${{ inputs.rerun && format(' ~{0}', inputs.rerun) || '' }}

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: 'YouTube playlist URL, or a channel / page link (then sort and limit are used)'
        required: true
      sort:
        description: 'Channel links only: latest or popular (most viewed)'
        required: false
        default: ''
        type: string
      limit:
        description: 'Channel links only: how many videos to list'
        required: false
        default: '30'
        type: string
      job_id:
        description: 'Set by the app so it can find this exact run (leave empty when running by hand)'
        required: false
        default: ''
        type: string
      rerun:
        description: 'Set by the app: the other inputs packed into the run name so "Run again" can repeat this run (leave empty when running by hand)'
        required: false
        default: ''
        type: string
      run_title:
        description: 'Short name for this run, set by the app (leave empty when running by hand)'
        required: false
        default: ''
        type: string

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: denoland/setup-deno@v2

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-yt-dlp-${{ runner.os }}

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Write cookies file
        env:
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
        run: |
          # The secret goes in through an environment variable, so the shell
          # never parses its content (quotes, $ or backticks are harmless).
          printf '%s\n' "$YTDLP_COOKIES" > cookies.txt
          chmod 600 cookies.txt

      - name: List playlist entries
        env:
          URL: ${{ inputs.playlist_url }}
          SORT: ${{ inputs.sort }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -o pipefail
          case "$LIMIT" in ''|*[!0-9]*) LIMIT=30 ;; esac
          MODE=playlist
          case "$URL" in
            *list=*|*/playlist*) ;;   # a normal playlist: as before
            *)
              if [ -n "$SORT" ]; then   # a channel / page link
                BASE="${URL%%\?*}"; BASE="${BASE%/}"
                BASE=$(echo "$BASE" | sed -E 's#/(videos|streams|shorts|featured|live)$##')
                URL="$BASE/videos"
                MODE="$SORT"
              fi ;;
          esac
          YT=(yt-dlp --cookies cookies.txt --remote-components ejs:github --flat-playlist)
          if [ "$MODE" = "popular" ]; then
            # YouTube's own "most viewed" order is not available to yt-dlp: read the newest 500
            # videos with their view counts and sort them here.
            "${YT[@]}" --playlist-end 500 --print "%(view_count|0)s|%(id)s|%(title)s" "$URL" \
              | sort -t'|' -k1,1nr | head -n "$LIMIT" \
              | sed -E 's/^[^|]*\|(.*)$/ITEM|\1/' | tee -a $GITHUB_STEP_SUMMARY
          elif [ "$MODE" = "latest" ]; then
            "${YT[@]}" --playlist-end "$LIMIT" --print "ITEM|%(id)s|%(title)s" "$URL" | tee -a $GITHUB_STEP_SUMMARY
          else
            "${YT[@]}" --print "ITEM|%(id)s|%(title)s" "$URL" | tee -a $GITHUB_STEP_SUMMARY
          fi

      - name: Clean up cookies
        if: always()
        run: rm -f cookies.txt

      - name: Notify (ntfy)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          TOOL_NAME: YouTube playlist
          ONLY_FAILURE: 'true'
          RUN_TITLE: ${{ inputs.run_title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          if [ "$JOB_STATUS" = "success" ] && [ "$ONLY_FAILURE" = "true" ]; then
            echo "Success and this tool only reports failures: no notification."
            exit 0
          fi
          # The topic is set once in the app (Settings) and kept in ntfy.json on the config branch.
          CFG=$(curl -fsS -m 20 -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ntfy.json?ref=config" 2>/dev/null || true)
          if [ -z "$CFG" ]; then
            echo "No ntfy.json on the config branch: no notification."
            exit 0
          fi
          RESULT=$(CFG="$CFG" python3 - <<'PY'
          import json, os, re
          try:
              d = json.loads(os.environ["CFG"])
          except Exception:
              d = {}
          topic = str(d.get("topic", "")).strip()
          server = str(d.get("server") or "https://ntfy.sh").strip().rstrip("/")
          if re.fullmatch(r"[A-Za-z0-9_-]{1,64}", topic) and re.fullmatch(r"https://[A-Za-z0-9.-]+(:[0-9]+)?", server):
              print(topic + " " + server)
          PY
          )
          if [ -z "$RESULT" ]; then
            echo "ntfy topic is not set: no notification."
            exit 0
          fi
          TOPIC=${RESULT%% *}
          SERVER=${RESULT#* }
          case "$JOB_STATUS" in
            success)   WORD="OK";        TAGS="white_check_mark"; PRIO="default" ;;
            cancelled) WORD="Cancelled"; TAGS="no_entry_sign";    PRIO="default" ;;
            *)         WORD="FAILED";    TAGS="x";                PRIO="high" ;;
          esac
          BODY="$TOOL_NAME: $WORD"
          if [ -n "${RUN_TITLE:-}" ]; then BODY="$BODY"$'\n'"$RUN_TITLE"; fi
          BODY="$BODY"$'\n'"$RUN_URL"
          if curl -fsS -m 20 -X POST "$SERVER/$TOPIC" \
              -H "Title: YT Bridge - $TOOL_NAME - $WORD" -H "Tags: $TAGS" -H "Priority: $PRIO" \
              -H "Click: $RUN_URL" --data-binary "$BODY" >/dev/null; then
            echo "Notification sent."
          else
            echo "ntfy could not be reached."
          fi
