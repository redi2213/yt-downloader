name: List Playlist
run-name: ${{ inputs.run_title || inputs.playlist_url }} [${{ inputs.job_id }}]

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: 'YouTube playlist URL'
        required: true
      job_id:
        description: 'Set by the app so it can find this exact run (leave empty when running by hand)'
        required: false
        default: ''
        type: string
      run_title:
        description: 'Short name for this run, set by the app (leave empty when running by hand)'
        required: false
        default: ''
        type: string

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: denoland/setup-deno@v2

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-yt-dlp-${{ runner.os }}

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Write cookies file
        run: echo "${{ secrets.YTDLP_COOKIES }}" > cookies.txt

      - name: List playlist entries
        run: |
          yt-dlp --cookies cookies.txt --remote-components ejs:github \
            --flat-playlist --print "%(webpage_url)s" \
            "${{ github.event.inputs.playlist_url }}" | tee -a $GITHUB_STEP_SUMMARY

      - name: Clean up cookies
        if: always()
        run: rm -f cookies.txt
