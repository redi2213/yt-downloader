name: Warm Caches

# Pre-builds the apt (ffmpeg, aria2) and yt-dlp caches so download.yml
# never has to install anything from scratch. Deno is NOT cached here —
# denoland/setup-deno downloads it fresh each run via GitHub's own
# tool-cache in a few seconds, which is fast enough on its own and
# avoids the path mismatch that broke manual caching.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

env:
  YTDLP_VERSION: '2026.07.04'

jobs:
  warm-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Cache apt debs
        id: cache-apt
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-debs-ffmpeg-aria2-v3

      - name: Download apt packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --download-only ffmpeg aria2

      - name: Cache yt-dlp
        id: cache-ytdlp
        uses: actions/cache@v4
        with:
          path: /opt/ytdlp
          key: ytdlp-${{ env.YTDLP_VERSION }}

      - name: Install yt-dlp
        run: pip install --target /opt/ytdlp yt-dlp==${{ env.YTDLP_VERSION }}

      - name: Confirm cache contents
        run: |
          echo "apt debs:"
          ls -la /var/cache/apt/archives/*.deb | wc -l
          echo "yt-dlp:"
          ls -la /opt/ytdlp/bin
