name: Warm Caches

# Pre-builds the apt/yt-dlp/deno caches so download.yml never has to
# install anything from scratch. Run this manually once, then it
# refreshes itself daily.

on:
  schedule:
    - cron: '0 2 * * *'  # every day at 02:00 UTC (1 hour before base-image rebuild, if you use that too)
  workflow_dispatch: {}

env:
  YTDLP_VERSION: '2026.07.04'

jobs:
  warm-cache:
    runs-on: ubuntu-latest
    steps:
      # --- ffmpeg + aria2 ---
      - name: Cache apt debs
        id: cache-apt
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-debs-ffmpeg-aria2-v2

      - name: Download apt packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --download-only ffmpeg aria2

      # --- yt-dlp ---
      - name: Cache yt-dlp
        id: cache-ytdlp
        uses: actions/cache@v4
        with:
          path: /opt/ytdlp
          key: ytdlp-${{ env.YTDLP_VERSION }}

      - name: Install yt-dlp
        run: pip install --target /opt/ytdlp yt-dlp==${{ env.YTDLP_VERSION }}

      # --- Deno ---
      - name: Cache Deno
        id: cache-deno
        uses: actions/cache@v4
        with:
          path: ~/.deno
          key: deno-${{ runner.os }}-v2

      - name: Install Deno
        if: steps.cache-deno.outputs.cache-hit != 'true'
        uses: denoland/setup-deno@v2

      - name: Confirm cache contents
        run: |
          echo "apt debs:"
          ls -la /var/cache/apt/archives/*.deb | head -5
          echo "yt-dlp:"
          ls -la /opt/ytdlp | head -5
          echo "deno:"
          ls -la ~/.deno/bin
