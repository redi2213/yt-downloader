name: Fail test
run-name: ${{ inputs.run_title || 'Fail test' }} [${{ inputs.job_id }}]

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Set by the app: unique id put in the run name so it can find this run'
        required: false
        default: ''
        type: string
      run_title:
        description: 'Set by the app: short name for this run'
        required: false
        default: ''
        type: string
      url:
        description: 'a link'
        required: true
        type: string

permissions:
  contents: write

# REGISTRATION STUB. GitHub only starts a workflow by file name when the file exists on main.
# The real definition lives on the `lab` branch (same path) and is what runs when the app
# dispatches this file with ref=lab. Do not put steps here.
jobs:
  stub:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Stub on main. The real workflow runs from the lab branch."
